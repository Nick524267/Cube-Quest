<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Valheim-like — Открытый мир</title>
<style>
  :root {
    --wood-dark: #2e1f12;
    --wood-mid: #4a3520;
    --wood-light: #6a4a2a;
    --wood-border: #a8804a;
    --parchment: #f5e6c8;
    --gold: #e0b060;
    --gold-bright: #ffd27a;
    --shadow: 0 4px 12px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--wood-dark);
    font-family: 'Segoe UI', system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; touch-action: none; }

  /* Кнопки-иконки */
  .icon-btn {
    width: 46px; height: 46px;
    border-radius: 8px;
    border: 2px solid var(--wood-border);
    background: linear-gradient(180deg, var(--wood-mid), var(--wood-dark));
    color: var(--parchment); font-size: 20px;
    cursor: pointer;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.1);
    display: flex; align-items: center; justify-content: center;
    transition: transform .1s ease, border-color .15s ease;
  }
  .icon-btn:active {
    transform: scale(.94);
    border-color: var(--gold);
  }

  #menuBtns {
    position: fixed; top: 12px; left: 12px;
    display: flex; gap: 6px; z-index: 6;
  }

  #topright {
    position: fixed; top: 12px; right: 12px;
    display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
    color: var(--parchment); z-index: 5;
    padding: 6px 10px;
    background: rgba(30,20,10,.6);
    border: 1px solid var(--wood-border);
    border-radius: 8px;
    backdrop-filter: blur(4px);
  }
  #topright label.small { font-size: 10px; opacity: .85; letter-spacing: .5px; text-transform: uppercase; }
  #zoom {
    -webkit-appearance: none; appearance: none;
    width: 130px; height: 4px; border-radius: 2px;
    background: var(--wood-light); outline: none;
  }
  #zoom::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 1px 4px rgba(0,0,0,.7); cursor: pointer;
  }
  #zoom::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--gold); }

  /* Хотбар */
  #hotbar {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; z-index: 6;
    padding: 5px;
    background: rgba(30,20,10,.75);
    border: 2px solid var(--wood-border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(4px);
  }
  .hotbar-slot {
    width: 46px; height: 46px;
    border-radius: 6px;
    border: 2px solid var(--wood-light);
    background: rgba(0,0,0,.4);
    color: var(--parchment); font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    position: relative;
    transition: all .12s ease;
  }
  .hotbar-slot.selected {
    border-color: var(--gold);
    background: rgba(224,176,96,.3);
    box-shadow: 0 0 10px rgba(224,176,96,.6);
    transform: translateY(-3px);
  }
  .hotbar-slot .num {
    position: absolute; top: 1px; left: 3px;
    font-size: 9px; font-weight: 700;
    color: rgba(245,230,200,.6);
  }
  .hotbar-slot .cnt {
    position: absolute; bottom: 1px; right: 3px;
    font-size: 10px; font-weight: 700;
    color: var(--gold-bright);
    text-shadow: 0 1px 2px #000;
  }

  /* Кнопки действий */
  #action, #buildBtn {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    padding: 10px 22px; border-radius: 999px;
    font-family: inherit; font-size: 14px; font-weight: 700;
    display: none; z-index: 7; cursor: pointer;
    border: 2px solid var(--wood-border);
    box-shadow: var(--shadow);
    letter-spacing: .3px;
  }
  #action {
    background: linear-gradient(180deg, var(--wood-mid), var(--wood-dark));
    color: var(--parchment);
  }
  #action:active { transform: translateX(-50%) scale(.96); }
  #buildBtn {
    background: linear-gradient(180deg, #5a4020, #3a2a15);
    color: var(--gold-bright);
    border-color: var(--gold);
  }

  #jumpBtn, #diveBtn {
    position: fixed; right: 20px;
    width: 68px; height: 68px; border-radius: 50%;
    border: 2px solid var(--wood-border);
    background: linear-gradient(180deg, var(--wood-mid), var(--wood-dark));
    color: var(--parchment); font-size: 26px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; cursor: pointer; z-index: 6;
    box-shadow: var(--shadow);
  }
  #jumpBtn { bottom: 100px; }
  #jumpBtn:active { background: var(--gold); color: var(--wood-dark); }
  #diveBtn { bottom: 178px; display: none; border-color: #4fc3f7; }
  #diveBtn:active { background: #4fc3f7; color: var(--wood-dark); }

  #oxygen {
    position: fixed; bottom: 184px; left: 50%; transform: translateX(-50%);
    width: 200px; height: 14px;
    background: rgba(0,0,0,.6);
    border: 2px solid var(--wood-border);
    border-radius: 7px; overflow: hidden;
    display: none; z-index: 8;
  }
  .oxy-fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #4fc3f7, #29b6f6);
    transition: width .08s linear, background .3s ease;
  }

  /* Джойстик */
  #stick {
    position: fixed; left: 20px; bottom: 20px; width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(30,20,10,.35);
    border: 2px solid var(--wood-border);
    display: none; touch-action: none; z-index: 5;
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px;
    margin: -26px 0 0 -26px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--parchment), var(--wood-border));
    box-shadow: 0 3px 12px rgba(0,0,0,.6);
  }

  /* Хинт */
  #hint {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--parchment);
    background: rgba(30,20,10,.7);
    padding: 6px 14px; border-radius: 8px;
    border: 1px solid var(--wood-border);
    text-shadow: 0 1px 3px #000;
    pointer-events: none; transition: opacity 1.2s ease; z-index: 5;
    max-width: 80vw; text-align: center;
  }

  /* Тост */
  #toast {
    position: fixed; top: 42%; left: 50%; transform: translate(-50%,-50%);
    padding: 10px 20px; border-radius: 8px;
    background: rgba(30,20,10,.92);
    border: 2px solid var(--gold);
    color: var(--parchment);
    font-size: 14px; font-weight: 600;
    opacity: 0; transition: opacity .3s ease;
    pointer-events: none; z-index: 20;
    box-shadow: 0 4px 16px rgba(0,0,0,.7);
  }

  /* Модалки — древесный стиль */
  .modal {
    position: fixed; inset: 0;
    background: rgba(10,6,3,.7);
    display: none; align-items: center; justify-content: center;
    z-index: 100;
    backdrop-filter: blur(3px);
  }
  .modal.open { display: flex; }
  .modal-content {
    background: linear-gradient(180deg, #3a2818, #2a1a0e);
    border: 3px solid var(--wood-border);
    border-radius: 12px;
    padding: 18px 20px 20px;
    min-width: 300px; max-width: 92vw;
    max-height: 85vh; overflow-y: auto;
    color: var(--parchment);
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .modal-content h2 {
    margin: 0 0 14px;
    font-size: 18px; letter-spacing: 1px;
    color: var(--gold-bright);
    text-transform: uppercase;
    font-weight: 700;
    border-bottom: 1px solid var(--wood-border);
    padding-bottom: 8px;
  }
  .modal-close {
    position: absolute; top: 8px; right: 10px;
    width: 32px; height: 32px;
    border: 2px solid var(--wood-border); border-radius: 6px;
    background: rgba(0,0,0,.3);
    color: var(--parchment); font-size: 20px; line-height: 1;
    cursor: pointer;
  }
  .modal-close:active { background: var(--wood-light); }

  /* Инвентарь */
  .inv-grid {
    display: grid;
    grid-template-columns: repeat(6, 44px);
    gap: 5px;
  }
  .inv-slot {
    width: 44px; height: 44px;
    background: rgba(0,0,0,.35);
    border: 2px solid var(--wood-light);
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    position: relative; font-size: 22px;
  }
  .inv-slot .count {
    position: absolute; bottom: 1px; right: 3px;
    font-size: 10px; font-weight: 700; color: var(--gold-bright);
    text-shadow: 0 1px 2px #000;
  }

  /* Крафт */
  .craft-list { display: flex; flex-direction: column; gap: 8px; }
  .craft-item {
    padding: 12px 14px; border-radius: 8px;
    border: 2px solid var(--wood-light);
    background: rgba(0,0,0,.3);
    color: var(--parchment);
    cursor: pointer; text-align: left; font-family: inherit; font-size: 13px;
    font-weight: 600;
    transition: all .15s ease;
  }
  .craft-item:active { transform: scale(.98); }
  .craft-item.enough {
    border-color: var(--gold);
    background: rgba(224,176,96,.15);
    box-shadow: 0 0 10px rgba(224,176,96,.3);
  }
  .craft-item.done {
    border-color: #6a8a4a;
    background: rgba(106,138,74,.15);
    opacity: .7;
    cursor: default;
  }
  .craft-item small {
    display: block; font-weight: 400; opacity: .75;
    font-size: 11px; margin-top: 4px;
  }

  /* Build menu */
  .build-tabs {
    display: flex; gap: 6px; margin-bottom: 12px;
    border-bottom: 1px solid var(--wood-border);
    padding-bottom: 8px;
  }
  .build-tab {
    padding: 8px 14px; border-radius: 6px;
    border: 2px solid var(--wood-light);
    background: rgba(0,0,0,.3);
    color: var(--parchment);
    font-size: 12px; font-weight: 700;
    cursor: pointer; letter-spacing: .5px;
  }
  .build-tab.active {
    border-color: var(--gold);
    background: rgba(224,176,96,.25);
    color: var(--gold-bright);
  }
  .build-pieces {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .build-piece {
    padding: 14px;
    border-radius: 8px;
    border: 2px solid var(--wood-light);
    background: rgba(0,0,0,.3);
    color: var(--parchment);
    cursor: pointer; text-align: center;
    font-size: 13px; font-weight: 600;
    transition: all .15s ease;
  }
  .build-piece:active { transform: scale(.97); }
  .build-piece.enough {
    border-color: var(--gold);
    background: rgba(224,176,96,.15);
  }
  .build-piece.disabled {
    opacity: .4; cursor: not-allowed;
  }
  .build-piece .icon { font-size: 28px; display: block; margin-bottom: 4px; }
  .build-piece .cost {
    display: block; font-weight: 400; opacity: .75;
    font-size: 11px; margin-top: 4px;
  }

  /* Landscape optimization */
  @media (orientation: landscape) and (max-height: 500px) {
    .icon-btn { width: 38px; height: 38px; font-size: 16px; }
    #hotbar { bottom: 8px; padding: 3px; }
    .hotbar-slot { width: 38px; height: 38px; font-size: 18px; }
    #jumpBtn, #diveBtn { width: 56px; height: 56px; font-size: 22px; right: 12px; }
    #jumpBtn { bottom: 70px; }
    #diveBtn { bottom: 134px; }
    #action, #buildBtn { bottom: 58px; padding: 8px 18px; font-size: 12px; }
    #oxygen { bottom: 140px; height: 12px; width: 160px; }
    #stick { width: 100px; height: 100px; left: 12px; bottom: 12px; }
    #knob { width: 44px; height: 44px; margin: -22px 0 0 -22px; }
    #topright { padding: 4px 8px; }
    #zoom { width: 100px; }
    #hint { font-size: 11px; padding: 4px 10px; }
    .modal-content { padding: 12px 16px 16px; min-width: 260px; }
    .inv-grid { grid-template-columns: repeat(6, 38px); }
    .inv-slot { width: 38px; height: 38px; font-size: 18px; }
  }
</style>
</head>
<body>

<div id="hint">WASD — идти · Space — прыжок · E — действие · 1–9 — хотбар · B — строить</div>

<div id="menuBtns">
  <button class="icon-btn" id="openInv" title="Инвентарь">🎒</button>
  <button class="icon-btn" id="openCraft" title="Крафт">⚒</button>
  <button class="icon-btn" id="fsBtn" title="Полный экран">⛶</button>
</div>

<div id="topright">
  <label class="small">Обзор</label>
  <input type="range" id="zoom" min="8" max="35" step="0.5" value="18" />
</div>

<div id="oxygen"><div class="oxy-fill" id="oxyFill"></div></div>
<div id="hotbar"></div>

<div class="modal" id="invModal">
  <div class="modal-content">
    <button class="modal-close" data-close>×</button>
    <h2>Инвентарь</h2>
    <div class="inv-grid" id="invGrid"></div>
  </div>
</div>

<div class="modal" id="craftModal">
  <div class="modal-content">
    <button class="modal-close" data-close>×</button>
    <h2>Крафт</h2>
    <div class="craft-list" id="craftList"></div>
  </div>
</div>

<div class="modal" id="buildModal">
  <div class="modal-content">
    <button class="modal-close" data-close>×</button>
    <h2>Строительство</h2>
    <div class="build-tabs" id="buildTabs"></div>
    <div class="build-pieces" id="buildPieces"></div>
  </div>
</div>

<button id="action">Подобрать</button>
<button id="buildBtn">🔨 Поставить</button>
<button id="jumpBtn">↑</button>
<button id="diveBtn">↓</button>
<div id="toast"></div>
<div id="stick"><div id="knob"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ==================== НАСТРОЙКИ ==================== */
const WORLD_SIZE     = 2520;
const TERRAIN_SEG    = 300;
const PINE_COUNT     = 1000;
const OAK_COUNT      = 600;
const BIRCH_COUNT    = 450;
const SMALL_TREE_COUNT = 600;
const ROCK_COUNT     = 700;
const FLINT_COUNT    = 500;
const BRANCH_COUNT   = 900;
const SEAWEED_COUNT  = 400;
const PEBBLE_COUNT   = 400;
const GRASS_PER_VARIANT = 5000;
const PLAYER_RADIUS  = 0.35;
const PLAYER_HEIGHT  = 1.7;
const SPEED          = 10;
const ACCEL          = 14;
const CAM_MIN        = 8;
const CAM_MAX        = 35;
const WATER_LEVEL    = -1.2;
const GRAVITY        = 25;
const JUMP_SPEED     = 9;
const SWIM_SPEED_MUL = 0.55;
const DIVE_SPEED     = 4.5;
const SWIM_DEPTH_THRESHOLD = 1.0;
const MAX_STEP_DOWN  = 0.5;
const OXYGEN_MAX     = 100;
const OXYGEN_DRAIN   = 9;
const OXYGEN_REFILL  = 35;
const FOG_DENSITY    = 0.0025;
const FOG_DENSITY_UNDER = 0.09;

/* ==================== РЕНДЕР ==================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const MAX_ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa8c8d8);
scene.fog = new THREE.FogExp2(0xa8c8d8, FOG_DENSITY);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 3000);
camera.position.set(0, 12, 18);

scene.add(new THREE.HemisphereLight(0xd8ecff, 0x445533, 0.9));

const sun = new THREE.DirectionalLight(0xfff2d0, 2.2);
sun.position.set(40, 60, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -60; sc.right = 60; sc.top = 60; sc.bottom = -60; sc.near = 1; sc.far = 220;
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.03;
scene.add(sun); scene.add(sun.target);

const skyGeo = new THREE.SphereGeometry(2000, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    topColor: { value: new THREE.Color(0x4a90d0) },
    midColor: { value: new THREE.Color(0xa8c8d8) },
    botColor: { value: new THREE.Color(0xe0d8c0) },
  },
  vertexShader: `varying vec3 vDir; void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader: `varying vec3 vDir; uniform vec3 topColor,midColor,botColor; void main(){ float h=clamp(vDir.y*0.5+0.5,0.0,1.0); vec3 c=mix(botColor,midColor,smoothstep(0.3,0.55,h)); c=mix(c,topColor,smoothstep(0.55,1.0,h)); gl_FragColor=vec4(c,1.0);} `,
});
const sky = new THREE.Mesh(skyGeo, skyMat);
sky.renderOrder = -1;
scene.add(sky);

/* ==================== ШУМ ==================== */
function hash(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function smooth(t) { return t * t * (3 - 2 * t); }
function valueNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const a = hash(xi, yi), b = hash(xi + 1, yi);
  const c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  const u = smooth(xf), v = smooth(yf);
  return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
}
function fbm(x, y) {
  let v = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < 4; i++) { v += amp * valueNoise(x * freq, y * freq); freq *= 2; amp *= 0.5; }
  return v;
}
function valueNoiseSeamless(x, y, period) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const x0 = ((xi % period) + period) % period;
  const y0 = ((yi % period) + period) % period;
  const x1 = (x0 + 1) % period;
  const y1 = (y0 + 1) % period;
  const a = hash(x0, y0), b = hash(x1, y0);
  const c = hash(x0, y1), d = hash(x1, y1);
  const u = smooth(xf), v = smooth(yf);
  return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
}

/* ==================== РЕЛЬЕФ ==================== */
function terrainHeight(x, z) {
  const hills = (fbm(x * 0.008 + 10, z * 0.008 + 10) - 0.42) * 22;
  const amp = 0.35 + 0.65 * fbm(x * 0.0035 + 50, z * 0.0035 + 50);
  let h = hills * amp;
  h += (fbm(x * 0.06, z * 0.06) - 0.5) * 1.4;
  const r1center = Math.sin(x * 0.016) * 30 + Math.cos(x * 0.005) * 20;
  const r1 = Math.max(0, 1 - Math.abs(z - r1center) / 11);
  const r2center = Math.sin(z * 0.014) * 28 + Math.cos(z * 0.006) * 18;
  const r2 = Math.max(0, 1 - Math.abs(x - r2center) / 10);
  const riverMask = Math.max(r1, r2);
  if (riverMask > 0) { const k = riverMask * riverMask; h = h * (1 - k * 0.95) - k * 6.5; }
  return h;
}

const GRID_HALF = WORLD_SIZE / 2;
const GRID_CELL = WORLD_SIZE / TERRAIN_SEG;
const GRID_N = TERRAIN_SEG + 1;
const gridHeights = new Float32Array(GRID_N * GRID_N);
for (let iz = 0; iz < GRID_N; iz++) {
  for (let ix = 0; ix < GRID_N; ix++) {
    gridHeights[iz * GRID_N + ix] = terrainHeight(-GRID_HALF + ix * GRID_CELL, -GRID_HALF + iz * GRID_CELL);
  }
}

function getTerrainYAt(x, z) {
  const gx = (x + GRID_HALF) / GRID_CELL;
  const gz = (z + GRID_HALF) / GRID_CELL;
  let ix = Math.floor(gx), iz = Math.floor(gz);
  if (ix < 0) ix = 0;
  if (iz < 0) iz = 0;
  if (ix > GRID_N - 2) ix = GRID_N - 2;
  if (iz > GRID_N - 2) iz = GRID_N - 2;
  const fx = Math.max(0, Math.min(1, gx - ix));
  const fz = Math.max(0, Math.min(1, gz - iz));
  const h00 = gridHeights[iz * GRID_N + ix];
  const h10 = gridHeights[iz * GRID_N + ix + 1];
  const h01 = gridHeights[(iz + 1) * GRID_N + ix];
  const h11 = gridHeights[(iz + 1) * GRID_N + ix + 1];
  if (fx + fz < 1) return h00 * (1 - fx - fz) + h01 * fz + h10 * fx;
  else return h01 * (1 - fx) + h11 * (fx + fz - 1) + h10 * (1 - fz);
}

/* ==================== ТЕКСТУРЫ ==================== */
function makeNoiseTexture() {
  const SIZE = 512;
  const c = document.createElement('canvas');
  c.width = SIZE; c.height = SIZE;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(SIZE, SIZE);
  const P1 = 4, P2 = 12;
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const i = (y * SIZE + x) * 4;
      const n1 = valueNoiseSeamless(x * P1 / SIZE, y * P1 / SIZE, P1);
      const n2 = valueNoiseSeamless(x * P2 / SIZE, y * P2 / SIZE, P2);
      const v = 190 + (n1 * 0.65 + n2 * 0.35) * 65;
      img.data[i] = v; img.data[i+1] = v; img.data[i+2] = v * 0.96; img.data[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(80, 80);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = MAX_ANISO;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  return tex;
}

function makeWaterNormalMap() {
  const SIZE = 256;
  const c = document.createElement('canvas');
  c.width = SIZE; c.height = SIZE;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(SIZE, SIZE);
  const P1 = 6, P2 = 16, P3 = 40;
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const i = (y * SIZE + x) * 4;
      const b = valueNoiseSeamless(x*P1/SIZE, y*P1/SIZE, P1)*0.5 + valueNoiseSeamless(x*P2/SIZE, y*P2/SIZE, P2)*0.3 + valueNoiseSeamless(x*P3/SIZE, y*P3/SIZE, P3)*0.2;
      const nx = valueNoiseSeamless((x+1)*P1/SIZE, y*P1/SIZE, P1)*0.5 + valueNoiseSeamless((x+1)*P2/SIZE, y*P2/SIZE, P2)*0.3 + valueNoiseSeamless((x+1)*P3/SIZE, y*P3/SIZE, P3)*0.2;
      const ny = valueNoiseSeamless(x*P1/SIZE, (y+1)*P1/SIZE, P1)*0.5 + valueNoiseSeamless(x*P2/SIZE, (y+1)*P2/SIZE, P2)*0.3 + valueNoiseSeamless(x*P3/SIZE, (y+1)*P3/SIZE, P3)*0.2;
      img.data[i] = 128 + (nx - b) * 380;
      img.data[i+1] = 128 + (ny - b) * 380;
      img.data[i+2] = 255; img.data[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(60, 60);
  tex.anisotropy = MAX_ANISO;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  return tex;
}

/* ==================== ХОТБАР (динамический) ==================== */
const HOTBAR_SLOTS = 9;
const hotbarItems = new Array(HOTBAR_SLOTS).fill(null);
let selectedSlot = -1;

const ITEM_DEFS = {
  stoneAxe: { icon: '🪓', name: 'Каменный топор' },
  flintAxe: { icon: '🪓', name: 'Кремневый топор' },
  hammer:   { icon: '🔨', name: 'Молот' },
  torch:    { icon: '🔥', name: 'Факел' },
  wood:     { icon: '🪵', name: 'Дерево', isResource: true },
  stone:    { icon: '🪨', name: 'Камень', isResource: true },
  flint:    { icon: '⚪', name: 'Кремень', isResource: true },
  resin:    { icon: '🟠', name: 'Смола', isResource: true },
};

const hotbarEl = document.getElementById('hotbar');

function ensureInHotbar(itemId) {
  if (hotbarItems.includes(itemId)) return;
  const empty = hotbarItems.indexOf(null);
  if (empty >= 0) {
    hotbarItems[empty] = itemId;
    renderHotbar();
  }
}

function renderHotbar() {
  hotbarEl.innerHTML = '';
  for (let i = 0; i < HOTBAR_SLOTS; i++) {
    const slot = document.createElement('div');
    slot.className = 'hotbar-slot';
    slot.dataset.slot = i;
    const itemId = hotbarItems[i];
    if (itemId) {
      const def = ITEM_DEFS[itemId];
      let countStr = '';
      if (def.isResource && inv[itemId] > 0) {
        countStr = `<span class="cnt">${inv[itemId]}</span>`;
      }
      slot.innerHTML = `<span class="num">${i + 1}</span>${def.icon}${countStr}`;
    } else {
      slot.innerHTML = `<span class="num">${i + 1}</span>`;
    }
    if (i === selectedSlot) slot.classList.add('selected');
    slot.addEventListener('click', () => selectSlot(i));
    hotbarEl.appendChild(slot);
  }
}

function selectSlot(i) {
  if (i < 0 || i >= HOTBAR_SLOTS) return;
  const itemId = hotbarItems[i];
  if (!itemId) return;
  if (i === selectedSlot) {
    // deselect
    selectedSlot = -1;
    setHandItem(null);
    renderHotbar();
    updateBuildBtn();
    return;
  }
  selectedSlot = i;
  setHandItem(itemId);
  const def = ITEM_DEFS[itemId];
  toast(def.name);
  renderHotbar();
  updateBuildBtn();
}

function refreshHotbarCounts() {
  for (let i = 0; i < HOTBAR_SLOTS; i++) {
    const itemId = hotbarItems[i];
    if (!itemId) continue;
    const slot = hotbarEl.children[i];
    if (!slot) continue;
    const def = ITEM_DEFS[itemId];
    if (def.isResource) {
      let cnt = slot.querySelector('.cnt');
      if (inv[itemId] > 0) {
        if (!cnt) {
          cnt = document.createElement('span');
          cnt.className = 'cnt';
          slot.appendChild(cnt);
        }
        cnt.textContent = inv[itemId];
      } else if (cnt) {
        cnt.remove();
      }
    }
  }
}

const craftList = document.getElementById('craftList');
function renderCraft() {
  const items = [
    { id: 'stoneAxe', name: 'Каменный топор',   desc: '5 дерева · 4 камня',          can: inv.wood >= 5 && inv.stone >= 4, done: inv.stoneAxe },
    { id: 'flintAxe', name: 'Кремневый топор',  desc: '4 дерева · 6 кремня',         can: inv.wood >= 4 && inv.flint >= 6, done: inv.flintAxe },
    { id: 'hammer',   name: 'Молот',            desc: '3 дерева · 2 камня',          can: inv.wood >= 3 && inv.stone >= 2, done: inv.hammer },
    { id: 'torch',    name: 'Факел',            desc: '1 дерево · 1 смола',          can: inv.wood >= 1 && inv.resin >= 1, done: inv.torch },
  ];
  craftList.innerHTML = items.map(it => {
    const cls = it.done ? 'craft-item done' : (it.can ? 'craft-item enough' : 'craft-item');
    const label = it.done ? `${it.name} — готово` : it.name;
    return `<button class="${cls}" data-craft="${it.id}">${label}<small>${it.desc}</small></button>`;
  }).join('');
  craftList.querySelectorAll('[data-craft]').forEach(btn => {
    btn.addEventListener('click', () => doCraft(btn.dataset.craft));
  });
}

function doCraft(id) {
  if (id === 'stoneAxe') {
    if (inv.stoneAxe) return toast('Уже есть');
    if (inv.wood < 5 || inv.stone < 4) return toast('Не хватает');
    inv.wood -= 5; inv.stone -= 4; inv.stoneAxe = true;
    ensureInHotbar('stoneAxe');
    toast('Каменный топор создан!'); beep(520);
  } else if (id === 'flintAxe') {
    if (inv.flintAxe) return toast('Уже есть');
    if (inv.wood < 4 || inv.flint < 6) return toast('Не хватает');
    inv.wood -= 4; inv.flint -= 6; inv.flintAxe = true;
    ensureInHotbar('flintAxe');
    toast('Кремневый топор создан!'); beep(680);
  } else if (id === 'hammer') {
    if (inv.hammer) return toast('Уже есть');
    if (inv.wood < 3 || inv.stone < 2) return toast('Не хватает');
    inv.wood -= 3; inv.stone -= 2; inv.hammer = true;
    ensureInHotbar('hammer');
    toast('Молот создан!'); beep(560);
  } else if (id === 'torch') {
    if (inv.torch) return toast('Уже есть');
    if (inv.wood < 1 || inv.resin < 1) return toast('Нужно 1🪵 и 1🟠');
    inv.wood -= 1; inv.resin -= 1; inv.torch = true;
    ensureInHotbar('torch');
    toast('Факел создан!'); beep(720);
  }
  renderInventory(); renderCraft(); refreshHotbarCounts();
}

  { id: 'roof', label: 'Крыши' },

let activeBuildCat = 'floor';

const buildTabsEl = document.getElementById('buildTabs');

function renderBuildMenu() {
  buildTabsEl.innerHTML = buildCategories.map(c =>
    `<button class="build-tab ${c.id === activeBuildCat ? 'active' : ''}" data-cat="${c.id}">${c.label}</button>`
  ).join('');
  buildTabsEl.querySelectorAll('[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => { activeBuildCat = btn.dataset.cat; renderBuildMenu(); });
  });

  const pieces = Object.entries(BUILD_PIECES).filter(([id, p]) => p.cat === activeBuildCat);
  buildPiecesEl.innerHTML = pieces.map(([id, p]) => {
    const costStr = Object.entries(p.cost).map(([k, v]) => `${v}${ITEM_DEFS[k].icon}`).join(' ');

    const cls = can ? 'build-piece enough' : 'build-piece disabled';
    return `<button class="${cls}" data-piece="${id}">
      <span class="icon">${p.icon}</span>${p.label}

  buildPiecesEl.querySelectorAll('[data-piece]').forEach(btn => {
    btn.addEventListener('click', () => startPlacing(btn.dataset.piece));
  });

let placingPiece = null;
let ghostMesh = null;

function startPlacing(pieceId) {
  const piece = BUILD_PIECES[pieceId];
  if (!piece) return;
  const can = Object.entries(piece.cost).every(([k, v]) => inv[k] >= v);
  if (!can) return toast('Не хватает ресурсов');

  if (ghostMesh) { scene.remove(ghostMesh); ghostMesh = null; }

  const geo = new THREE.BoxGeometry(piece.size[0], piece.size[1], piece.size[2]);
  const mat = new THREE.MeshBasicMaterial({ color: 0x66ff66, transparent: true, opacity: 0.45, depthWrite: false });
  ghostMesh = new THREE.Mesh(geo, mat);
  ghostMesh.userData.pieceId = pieceId;
  scene.add(ghostMesh);
  placingPiece = pieceId;

  closeAllModals();
  updateBuildBtn();
  toast(`Размещение: ${piece.label}`);
}

function cancelPlacing() {
  if (ghostMesh) { scene.remove(ghostMesh); ghostMesh = null; }
  placingPiece = null;
  updateBuildBtn();
}

function updateGhostPosition() {
  if (!ghostMesh || !placingPiece) return;
  const piece = BUILD_PIECES[placingPiece];
  const fwdX = Math.sin(player.rotation.y);
  const fwdZ = Math.cos(player.rotation.y);
  const bx = player.position.x + fwdX * 2.8;
  const bz = player.position.z + fwdZ * 2.8;
  const by = getTerrainYAt(bx, bz);

  ghostMesh.position.set(bx, by + piece.yOff, bz);
  ghostMesh.rotation.y = player.rotation.y;

  // valid check
  let valid = by >= WATER_LEVEL - 0.5;
  ghostMesh.material.color.setHex(valid ? 0x66ff66 : 0xff4444);
}

const buildBtn = document.getElementById('buildBtn');
function updateBuildBtn() {
  if (placingPiece) {
    buildBtn.style.display = 'block';
    buildBtn.textContent = '✓ Поставить';
  } else if (selectedSlot >= 0 && hotbarItems[selectedSlot] === 'hammer' && !modalOpen) {
    buildBtn.style.display = 'block';
    buildBtn.textContent = '🔨 Строить (B)';
  } else {
    buildBtn.style.display = 'none';
  }
}

buildBtn.addEventListener('click', () => {
  if (placingPiece) {
    placeCurrentPiece();
  } else {
    renderBuildMenu();
    openModal(buildModal);
  }
});

function placeCurrentPiece() {
  if (!placingPiece || !ghostMesh) return;
  const piece = BUILD_PIECES[placingPiece];
  const can = Object.entries(piece.cost).every(([k, v]) => inv[k] >= v);
  if (!can) return toast('Не хватает ресурсов');

  const pos = ghostMesh.position.clone();
  const rotY = ghostMesh.rotation.y;

  // Create solid mesh
  const mat = new THREE.MeshStandardMaterial({ color: piece.color, roughness: 0.9, flatShading: true });
  const geo = new THREE.BoxGeometry(piece.size[0], piece.size[1], piece.size[2]);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  mesh.rotation.y = rotY;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  // Deduct resources
  for (const [k, v] of Object.entries(piece.cost)) inv[k] -= v;
  renderInventory();
  refreshHotbarCounts();
  beep(500);

  // Keep ghost for next placement, but recheck validity
  updateGhostPosition();
}

/* ==================== TOAST / ЗВУК ==================== */
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.style.opacity = '0'; }, 1600);
}
let actx = null;
function beep(freq = 600) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(freq, actx.currentTime);
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.12, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.18);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 0.2);
  } catch (e) {}
}

/* ==================== УПРАВЛЕНИЕ ==================== */
const keys = new Set();
let jumpRequested = false;
let touchDive = false;

addEventListener('keydown', (e) => {
  keys.add(e.code);
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyE' && currentAction && !modalOpen) doAction();
  if (e.code === 'Space' && !modalOpen) jumpRequested = true;
  if (e.code === 'Escape') { closeAllModals(); if (placingPiece) cancelPlacing(); }
  if (e.code === 'KeyB' && !modalOpen && selectedSlot >= 0 && hotbarItems[selectedSlot] === 'hammer') {
    renderBuildMenu();
    openModal(buildModal);
  }
  if (!modalOpen && e.code.startsWith('Digit')) {
    const n = parseInt(e.code.slice(5));
    if (n >= 1 && n <= 9) selectSlot(n - 1);
  }
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => { keys.clear(); touchDive = false; });

document.getElementById('jumpBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); jumpRequested = true; });
const diveBtnEl = document.getElementById('diveBtn');
diveBtnEl.addEventListener('pointerdown', (e) => { e.preventDefault(); touchDive = true; });
['pointerup','pointerleave','pointercancel'].forEach(ev => {
  diveBtnEl.addEventListener(ev, () => { touchDive = false; });
});

const stick = document.getElementById('stick');
const knob = document.getElementById('knob');
let joyId = null, joyOrigin = { x: 0, y: 0 }, joyVec = { x: 0, y: 0 };
addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' || joyId !== null) return;
  if (modalOpen) return;
  if (e.clientX > innerWidth * 0.5) return;
  if (e.target.closest('#topright, #action, #jumpBtn, #diveBtn, #menuBtns, #buildBtn, .modal, #hotbar')) return;
  joyId = e.pointerId;
  joyOrigin = { x: e.clientX, y: e.clientY };
  stick.style.display = 'block';
  stick.style.left = (e.clientX - 60) + 'px';
  stick.style.top  = (e.clientY - 60) + 'px';
  stick.style.bottom = 'auto';
  knob.style.transform = 'translate(0,0)';
});
addEventListener('pointermove', (e) => {
  if (e.pointerId !== joyId) return;
  const dx = e.clientX - joyOrigin.x;
  const dy = e.clientY - joyOrigin.y;
  const max = 50;
  const len = Math.hypot(dx, dy) || 1;
  const k = len > max ? max / len : 1;
  const kx = dx * k, ky = dy * k;
  knob.style.transform = `translate(${kx}px, ${ky}px)`;
  joyVec.x = kx / max; joyVec.y = ky / max;
});
function endJoy(e) {
  if (e.pointerId !== joyId) return;
  joyId = null; joyVec.x = joyVec.y = 0;
  stick.style.display = 'none';
  knob.style.transform = 'translate(0,0)';
}
addEventListener('pointerup', endJoy);
addEventListener('pointercancel', endJoy);

/* ==================== КАМЕРА ==================== */
let camDistance = 18;
const zoomEl = document.getElementById('zoom');
zoomEl.value = String(camDistance);
zoomEl.addEventListener('input', (e) => {
  const v = parseFloat(e.target.value);
  if (!isNaN(v)) camDistance = Math.max(CAM_MIN, Math.min(CAM_MAX, v));
});
const camDesired = new THREE.Vector3();
const lookAt = new THREE.Vector3();
const tmpV = new THREE.Vector3();
function updateCamera(dt) {
  const height = camDistance * 0.55;
  const back = camDistance * 0.85;
  camDesired.set(player.position.x, player.position.y + height, player.position.z + back);
  const t = 1 - Math.exp(-5 * dt);
  camera.position.lerp(camDesired, t);
  tmpV.set(player.position.x, player.position.y + 1.2, player.position.z);
  lookAt.lerp(tmpV, Math.min(1, t * 1.8));
  camera.lookAt(lookAt);
}

/* ==================== ФИЗИКА ==================== */
const velocity = new THREE.Vector3();
let vy = 0;
let onGround = true;
let walkPhase = 0;
let idlePhase = 0;
let currentSpeed01 = 0;
let oxygen = OXYGEN_MAX;
let isSwimming = false;
let isUnderwater = false;
let bodyTiltTarget = 0;
let airborneBlend = 0;
let runBlend = 0;

player.position.set(0, getTerrainYAt(0, 0), 0);

function dampAngle(cur, target, lambda, dt) {
  let diff = (target - cur) % (Math.PI * 2);
  if (diff > Math.PI) diff -= Math.PI * 2;
  if (diff < -Math.PI) diff += Math.PI * 2;
  return cur + diff * (1 - Math.exp(-lambda * dt));
}

function getInput() {
  if (modalOpen) return { x: 0, z: 0 };
  let x = 0, z = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp'))    z -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown'))  z += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft'))  x -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) x += 1;
  x += joyVec.x; z += joyVec.y;
  const len = Math.hypot(x, z);
  if (len > 1) { x /= len; z /= len; }
  return { x, z };
}

function resolveObstacles() {
  for (const o of obstacles) {
    const dx = player.position.x - o.x;
    const dz = player.position.z - o.z;
    const d = Math.hypot(dx, dz);
    const min = o.radius + PLAYER_RADIUS;
    if (d < min && d > 0.0001) {
      const k = min / d;
      player.position.x = o.x + dx * k;
      player.position.z = o.z + dz * k;
    }
  }
}

function updatePlayer(dt) {
  const inp = getInput();
  const t = 1 - Math.exp(-ACCEL * dt);

  const groundYpre = getTerrainYAt(player.position.x, player.position.z);
  const waterDepthPre = WATER_LEVEL - groundYpre;
  const inWaterPre = player.position.y < WATER_LEVEL - 0.1;
  isSwimming = inWaterPre && waterDepthPre > SWIM_DEPTH_THRESHOLD;

  const speedMul = isSwimming ? SWIM_SPEED_MUL : (inWaterPre ? 0.7 : 1.0);
  velocity.x += (inp.x * SPEED * speedMul - velocity.x) * t;
  velocity.z += (inp.z * SPEED * speedMul - velocity.z) * t;
  player.position.x += velocity.x * dt;
  player.position.z += velocity.z * dt;

  resolveObstacles();

  const half = WORLD_SIZE / 2 - 5;
  player.position.x = Math.max(-half, Math.min(half, player.position.x));
  player.position.z = Math.max(-half, Math.min(half, player.position.z));

  const groundY = getTerrainYAt(player.position.x, player.position.z);
  const waterSurface = WATER_LEVEL - 0.3;

  const waterDepth = WATER_LEVEL - groundY;
  const inWaterNow = player.position.y < WATER_LEVEL - 0.1;
  isSwimming = inWaterNow && waterDepth > SWIM_DEPTH_THRESHOLD;

  if (isSwimming) {
    const holdingDive = touchDive || keys.has('ShiftLeft') || keys.has('ShiftRight');
    if (oxygen <= 0) {
      vy += (waterSurface - player.position.y) * 12 * dt;
    } else if (holdingDive) {
      vy -= DIVE_SPEED * 5 * dt;
    } else {
      vy += (waterSurface - player.position.y) * 6 * dt;
    }
    vy = Math.max(-DIVE_SPEED, Math.min(vy, 4));
    if (jumpRequested) vy = Math.max(vy, JUMP_SPEED * 0.5);
    player.position.y += vy * dt;

    if (player.position.y < groundY + 0.2) {
      player.position.y = groundY + 0.2;
      vy = Math.max(0, vy);
    }
    if (player.position.y > waterSurface && vy > 0) {
      player.position.y = waterSurface;
      vy = 0;
    }
    onGround = false;
  } else {
    // === ФИЗИКА НА ЗЕМЛЕ (ИСПРАВЛЕНА) ===
    if (jumpRequested && onGround) {
      vy = JUMP_SPEED;
      onGround = false;
      player.position.y += vy * dt;
    } else if (!onGround) {
      // В воздухе — гравитация
      vy -= GRAVITY * dt;
      player.position.y += vy * dt;

      // Приземление
      if (player.position.y <= groundY && vy <= 0) {
        player.position.y = groundY;
        vy = 0;
        onGround = true;
      }
    } else {
      // На земле — проверяем обрыв или следование рельефу
      const drop = player.position.y - groundY;
      if (drop > MAX_STEP_DOWN) {
        // Обрыв — начинаем падать
        onGround = false;
        vy = 0;
      } else {
        // Прилипаем к земле (плавно вверх/вниз по склону)
        player.position.y = groundY;
        vy = 0;
      }
    }
  }

  jumpRequested = false;

  const headY = player.position.y + PLAYER_HEIGHT;
  isUnderwater = headY < WATER_LEVEL;

  if (isUnderwater) {
    oxygen -= OXYGEN_DRAIN * dt;
    if (oxygen < 0) oxygen = 0;
  } else {
    oxygen += OXYGEN_REFILL * dt;
    if (oxygen > OXYGEN_MAX) oxygen = OXYGEN_MAX;
  }

  const sp = Math.hypot(velocity.x, velocity.z);
  currentSpeed01 = onGround ? Math.min(1, sp / SPEED) : 0;

  if (sp > 0.4) {
    player.rotation.y = dampAngle(player.rotation.y, Math.atan2(velocity.x, velocity.z), 12, dt);
  }

  diveBtnEl.style.display = isSwimming ? 'flex' : 'none';
}

/* ==================== АНИМАЦИЯ ==================== */
const lerpA = (a, b, t) => a + (b - a) * t;
function updatePlayerAnim(dt) {
  const s = currentSpeed01;
  walkPhase += dt * (4 + s * 9) * s;
  idlePhase += dt * 2;

  const airborneTarget = (!onGround && !isSwimming) ? 1 : 0;
  airborneBlend += (airborneTarget - airborneBlend) * (1 - Math.exp(-14 * dt));
  const runTarget = s > 0.65 ? 1 : 0;
  runBlend += (runTarget - runBlend) * (1 - Math.exp(-6 * dt));

  if (isSwimming) {
    bodyTiltTarget = 1.15;
    const t = performance.now() / 1000;
    const sp = 4.5;
    armL.rotation.x = Math.sin(t * sp) * 1.3 + 0.3;
    armR.rotation.x = Math.sin(t * sp + Math.PI) * 1.3 + 0.3;
    armL.rotation.z = -0.35; armR.rotation.z = 0.35;
    const kick = Math.sin(t * sp * 2);
    legL.rotation.x = kick * 0.45;
    legR.rotation.x = -kick * 0.45;
    headGroup.rotation.x = -0.6;
    headGroup.rotation.y = 0;
  } else {
    const swing = Math.sin(walkPhase) * (0.6 + runBlend * 0.3) * s;
    const swingOpp = Math.sin(walkPhase + Math.PI) * (0.6 + runBlend * 0.3) * s;
    const airLeg = -0.55;
    const airArm = -1.15 + (vy < 0 ? 0.3 : 0);
    legL.rotation.x = lerpA(swing, airLeg, airborneBlend);
    legR.rotation.x = lerpA(swingOpp, airLeg - 0.1, airborneBlend);
    armL.rotation.x = lerpA(swingOpp * 0.8, airArm, airborneBlend);
    armR.rotation.x = lerpA(swing * 0.8, airArm, airborneBlend);
    armL.rotation.z = lerpA(-0.06 - runBlend * 0.15, -0.5, airborneBlend);
    armR.rotation.z = lerpA(0.06 + runBlend * 0.15, 0.5, airborneBlend);
    const headBob = Math.sin(walkPhase * 2) * 0.03 * s;
    headGroup.rotation.x = lerpA(headBob, 0.15, airborneBlend);
    if (s < 0.05) {
      headGroup.rotation.y = Math.sin(idlePhase * 0.4) * 0.25;
    } else {
      headGroup.rotation.y *= Math.exp(-4 * dt);
    }
    bodyTiltTarget = lerpA(s * 0.07 + runBlend * 0.05, 0.18, airborneBlend);
  }

  bodyRoot.rotation.x += (bodyTiltTarget - bodyRoot.rotation.x) * (1 - Math.exp(-8 * dt));
  bodyRoot.rotation.z = Math.sin(walkPhase) * (0.04 + runBlend * 0.03) * s;
  const bob = Math.abs(Math.sin(walkPhase * 2)) * (0.04 + runBlend * 0.03) * s;
  const breathe = s < 0.1 && onGround && !isSwimming ? Math.sin(idlePhase) * 0.012 : 0;
  bodyRoot.position.y = bob + breathe;
}

function updateTorch(time) {
  if (selectedSlot < 0 || hotbarItems[selectedSlot] !== 'torch') return;
  const flicker = 2.3 + Math.sin(time * 18) * 0.35 + Math.sin(time * 27) * 0.2 + Math.sin(time * 9) * 0.15;
  torchLight.intensity = flicker;
  const scale = 1 + Math.sin(time * 15) * 0.08;
  torchFlame.scale.set(scale, 1 + Math.sin(time * 20) * 0.15, scale);
  torchFlame2.scale.set(scale, 1 + Math.sin(time * 25) * 0.2, scale);
}

/* ==================== ДЕЙСТВИЯ (подбор/рубка) ==================== */
function findNearestAction() {
  if (modalOpen || placingPiece) { setAction(null); return; }
  const px = player.position.x, pz = player.position.z;
  let best = null, bestDist = Infinity;

  for (const r of rockData) {
    if (!r.alive) continue;
    const d = Math.hypot(px - r.x, pz - r.z);
    if (d < 2.0 && d < bestDist) { bestDist = d; best = { kind: 'rock', target: r, label: 'Подобрать камень' }; }
  }
  for (const f of flintData) {
    if (!f.alive) continue;
    const d = Math.hypot(px - f.x, pz - f.z);
    if (d < 2.0 && d < bestDist) { bestDist = d; best = { kind: 'flint', target: f, label: 'Подобрать кремень' }; }
  }
  for (const b of branchData) {
    if (!b.alive) continue;
    const d = Math.hypot(px - b.x, pz - b.z);
    if (d < 2.0 && d < bestDist) { bestDist = d; best = { kind: 'branch', target: b, label: 'Подобрать ветку' }; }
  }
  const hasAxe = inv.stoneAxe || inv.flintAxe;
  for (const tt of treeData) {
    if (!tt.alive) continue;
    const d = Math.hypot(px - tt.x, pz - tt.z);
    if (d < 2.4 && d < bestDist) {
      bestDist = d;
      const canCut = hasAxe || tt.type === 'small';
      let label;
      if (tt.type === 'small') label = hasAxe ? 'Рубить маленькое дерево' : 'Срубить руками';
      else if (hasAxe) label = 'Рубить дерево';
      else label = 'Нужен топор';
      best = { kind: canCut ? 'tree' : 'tree-noaxe', target: tt, label };
    }
  }
  setAction(best);
}

function hideInstance(inst, idx) {
  dummy.position.set(0, -9999, 0);
  dummy.rotation.set(0, 0, 0); dummy.scale.set(0, 0, 0); dummy.updateMatrix();
  inst.setMatrixAt(idx, dummy.matrix);
  inst.instanceMatrix.needsUpdate = true;
}

function doAction() {
  if (!currentAction) return;
  const { kind, target } = currentAction;

  if (kind === 'rock') {
    target.alive = false;
    hideInstance(rockInst, target.idx);
    inv.stone += 2 + Math.floor(Math.random() * 2);
    ensureInHotbar('stone');
    renderInventory(); refreshHotbarCounts();
    toast('+ камень'); beep(420);
  } else if (kind === 'flint') {
    target.alive = false;
    hideInstance(flintInst, target.idx);
    inv.flint += 2 + Math.floor(Math.random() * 2);
    ensureInHotbar('flint');
    renderInventory(); refreshHotbarCounts();
    toast('+ кремень'); beep(560);
  } else if (kind === 'branch') {
    target.alive = false;
    hideInstance(branchInst, target.idx);
    inv.wood += 1 + Math.floor(Math.random() * 2);
    ensureInHotbar('wood');
    renderInventory(); refreshHotbarCounts();
    toast('+ дерево'); beep(480);
  } else if (kind === 'tree' || kind === 'tree-noaxe') {
    if (kind === 'tree-noaxe') { toast('Сначала топор'); return; }
    let dmg;
    if (target.type === 'small') dmg = 2;
    else dmg = inv.flintAxe ? 6 : 4;
    target.hp -= dmg;
    beep(inv.flintAxe ? 300 : 240);
    if (target.hp <= 0) {
      target.alive = false;
      for (const inst of target.insts) hideInstance(inst, target.idx);
      let woodAmount, resinAmount = 0;
      if (target.type === 'small') {
        woodAmount = 2 + Math.floor(Math.random() * 2);
        resinAmount = 1 + Math.floor(Math.random() * 2);
        toast(`Маленькое дерево (+${woodAmount}🪵 +${resinAmount}🟠)`);
      } else {
        woodAmount = (target.type === 'oak' ? 5 : target.type === 'birch' ? 3 : 4) + Math.floor(Math.random() * 3);
        if (Math.random() < 0.6) resinAmount = 1 + Math.floor(Math.random() * 2);
        const name = target.type === 'oak' ? 'Дуб' : target.type === 'birch' ? 'Берёза' : 'Сосна';
        const resinMsg = resinAmount > 0 ? ` +${resinAmount}🟠` : '';
        toast(`${name} (+${woodAmount}🪵${resinMsg})`);
      }
      inv.wood += woodAmount;
      inv.resin += resinAmount;
      ensureInHotbar('wood');
      if (resinAmount > 0) ensureInHotbar('resin');
      renderInventory(); refreshHotbarCounts();
    } else {
      toast(target.type === 'small' ? 'Хрясь!' : (inv.flintAxe ? 'Быстрый удар' : 'Удар топором'));
    }
  }
  setAction(null);
}

/* ==================== КИСЛОРОД ==================== */
const oxyEl = document.getElementById('oxygen');
const oxyFill = document.getElementById('oxyFill');
function updateOxygenUI() {
  oxyEl.style.display = isUnderwater ? 'block' : 'none';
  if (!isUnderwater) return;
  const pct = (oxygen / OXYGEN_MAX) * 100;
  oxyFill.style.width = pct + '%';
  oxyFill.style.background = oxygen < 30 ? '#f44336' : 'linear-gradient(90deg, #4fc3f7, #29b6f6)';
}

/* ==================== ПОСТОБРАБОТКА ==================== */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.6, 0.9));
composer.addPass(new OutputPass());
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

const hintEl = document.getElementById('hint');
setTimeout(() => { hintEl.style.opacity = '0'; }, 5500);

/* ==================== АТМОСФЕРА ==================== */
const FOG_AIR = new THREE.Color(0xa8c8d8);
const FOG_WATER = new THREE.Color(0x1a4a6a);
const BG_AIR = new THREE.Color(0xa8c8d8);
const BG_WATER = new THREE.Color(0x1a4a6a);
function updateAtmosphere() {
  if (isUnderwater) {
    scene.fog.color.copy(FOG_WATER);
    scene.fog.density = FOG_DENSITY_UNDER;
    scene.background.copy(BG_WATER);
    waterMat.opacity = 0.15;
  } else {
    scene.fog.color.copy(FOG_AIR);
    scene.fog.density = FOG_DENSITY;
    scene.background.copy(BG_AIR);
    waterMat.opacity = 0.78;
  }
}

/* ==================== ЦИКЛ ==================== */
const SUN_OFFSET = new THREE.Vector3(35, 55, 25);
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  updatePlayer(dt);
  updatePlayerAnim(dt);
  updateCamera(dt);
  findNearestAction();
  updateAtmosphere();
  updateOxygenUI();
  updateBuildBtn();
  updateTorch(elapsed);

  if (placingPiece) updateGhostPosition();

  waterNormalMap.offset.x = elapsed * 0.02;
  waterNormalMap.offset.y = elapsed * 0.03;

  sun.position.copy(player.position).add(SUN_OFFSET);
  sun.target.position.copy(player.position);
  sky.position.copy(player.position);

  composer.render();
}

renderInventory();
renderCraft();
renderHotbar();
animate();
</script>
