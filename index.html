<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Valheim-like</title>
<style>
  :root {
    --wood-dark: #2e1f12; --wood-mid: #4a3520; --wood-light: #6a4a2a;
    --wood-border: #a8804a; --parchment: #f5e6c8; --gold: #e0b060; --gold-bright: #ffd27a;
    --shadow: 0 4px 12px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--wood-dark);
    font-family: 'Segoe UI', system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  canvas { display: block; touch-action: none; }

  /* Единый стиль для всех иконок (сепия, как деревянные) */
  .ui-icon {
    font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
    filter: sepia(1) hue-rotate(-15deg) saturate(1.5) brightness(0.9) drop-shadow(0 2px 2px rgba(0,0,0,0.5));
    display: inline-block;
    font-style: normal;
    line-height: 1;
  }
  .ui-icon-white {
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.8));
  }

  #startScreen {
    position: fixed; inset: 0;
    background: radial-gradient(circle at 50% 40%, #2a1a0e, #0a0602 70%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 500; padding: 20px; text-align: center;
  }
  #startScreen h1 {
    color: var(--gold-bright); font-size: clamp(28px, 6vw, 48px);
    margin: 0 0 6px; letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(224,176,96,.5);
  }
  #startScreen p { color: var(--parchment); opacity: .7; font-size: 14px; margin: 0 0 28px; }
  #startBtn {
    padding: 14px 48px; font-size: 20px; font-weight: 700;
    background: linear-gradient(180deg, #6a4a20, #3a2a15);
    color: var(--gold-bright); border: 3px solid var(--gold);
    border-radius: 12px; cursor: pointer; letter-spacing: 3px;
    box-shadow: 0 0 30px rgba(224,176,96,.4), inset 0 1px 0 rgba(255,255,255,.15);
    font-family: inherit;
  }
  #startBtn:active { transform: scale(.97); }

  .icon-btn {
    width: 46px; height: 46px; border-radius: 8px;
    border: 2px solid var(--wood-border);
    background: linear-gradient(180deg, var(--wood-mid), var(--wood-dark));
    color: var(--parchment); font-size: 22px; cursor: pointer;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.1);
    display: flex; align-items: center; justify-content: center;
    transition: transform .1s;
  }
  .icon-btn:active { transform: scale(.94); border-color: var(--gold); }

  #menuBtns { position: fixed; top: 12px; left: 12px; display: flex; gap: 6px; z-index: 6; }

  #topright {
    position: fixed; top: 12px; right: 12px;
    display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
    color: var(--parchment); z-index: 5; padding: 6px 10px;
    background: rgba(30,20,10,.6);
    border: 1px solid var(--wood-border); border-radius: 8px;
    backdrop-filter: blur(4px);
  }
  #topright .small { font-size: 10px; opacity: .85; letter-spacing: .5px; text-transform: uppercase; }

  #clockBadge {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center;
    padding: 6px 14px; border-radius: 8px;
    background: rgba(30,20,10,.7);
    border: 1px solid var(--wood-border);
    color: var(--parchment); font-size: 12px;
    z-index: 5; pointer-events: none;
    backdrop-filter: blur(4px);
  }
  #clockBadge .icon { font-size: 16px; }

  #hotbar {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; z-index: 6; padding: 5px;
    background: rgba(30,20,10,.75);
    border: 2px solid var(--wood-border); border-radius: 10px;
    box-shadow: var(--shadow); backdrop-filter: blur(4px);
  }
  .hotbar-slot {
    width: 46px; height: 46px; border-radius: 6px;
    border: 2px solid var(--wood-light);
    background: rgba(0,0,0,.4);
    color: var(--parchment); font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative; transition: all .12s;
  }
  .hotbar-slot.selected {
    border-color: var(--gold);
    background: rgba(224,176,96,.3);
    box-shadow: 0 0 10px rgba(224,176,96,.6);
    transform: translateY(-3px);
  }
  .hotbar-slot .num { position: absolute; top: 1px; left: 3px; font-size: 9px; font-weight: 700; color: rgba(245,230,200,.6); }
  .hotbar-slot .cnt { position: absolute; bottom: 1px; right: 3px; font-size: 10px; font-weight: 700; color: var(--gold-bright); text-shadow: 0 1px 2px #000; }

  #action, #buildBtn {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    padding: 10px 22px; border-radius: 999px;
    font-family: inherit; font-size: 14px; font-weight: 700;
    display: none; z-index: 7; cursor: pointer;
    border: 2px solid var(--wood-border); box-shadow: var(--shadow);
  }
  #action { background: linear-gradient(180deg, var(--wood-mid), var(--wood-dark)); color: var(--parchment); }
  #action:active { transform: translateX(-50%) scale(.96); }
  #buildBtn { background: linear-gradient(180deg, #5a4020, #3a2a15); color: var(--gold-bright); border-color: var(--gold); }

  #jumpBtn, #diveBtn {
    position: fixed; right: 20px; width: 68px; height: 68px;
    border-radius: 50%; border: 2px solid var(--wood-border);
    background: linear-gradient(180deg, var(--wood-mid), var(--wood-dark));
    color: var(--parchment); font-size: 26px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; cursor: pointer; z-index: 6; box-shadow: var(--shadow);
  }
  #jumpBtn { bottom: 100px; }
  #jumpBtn:active { background: var(--gold); color: var(--wood-dark); }
  #diveBtn { bottom: 178px; display: none; border-color: #4fc3f7; }
  #diveBtn:active { background: #4fc3f7; color: var(--wood-dark); }

  #oxygen {
    position: fixed; bottom: 184px; left: 50%; transform: translateX(-50%);
    width: 200px; height: 14px;
    background: rgba(0,0,0,.6); border: 2px solid var(--wood-border);
    border-radius: 7px; overflow: hidden; display: none; z-index: 8;
  }
  .oxy-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #4fc3f7, #29b6f6); transition: width .08s linear, background .3s; }

  #stick {
    position: fixed; left: 20px; bottom: 20px;
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(30,20,10,.35);
    border: 2px solid var(--wood-border);
    display: none; touch-action: none; z-index: 5;
  }
  #knob {
    position: absolute; left: 50%; top: 50%;
    width: 52px; height: 52px;
    margin: -26px 0 0 -26px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--parchment), var(--wood-border));
    box-shadow: 0 3px 12px rgba(0,0,0,.6);
  }

  #toast {
    position: fixed; top: 42%; left: 50%; transform: translate(-50%,-50%);
    padding: 10px 20px; border-radius: 8px;
    background: rgba(30,20,10,.92);
    border: 2px solid var(--gold);
    color: var(--parchment); font-size: 14px; font-weight: 600;
    opacity: 0; transition: opacity .3s;
    pointer-events: none; z-index: 20;
    box-shadow: 0 4px 16px rgba(0,0,0,.7);
  }

  .modal {
    position: fixed; inset: 0;
    background: rgba(10,6,3,.75);
    display: none; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(3px);
  }
  .modal.open { display: flex; }
  .modal-content {
    background: linear-gradient(180deg, #3a2818, #2a1a0e);
    border: 3px solid var(--wood-border);
    border-radius: 12px; padding: 18px 20px 20px;
    min-width: 340px; max-width: 96vw;
    max-height: 92vh; overflow-y: auto;
    color: var(--parchment); position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .modal-content h2 {
    margin: 0 0 12px; font-size: 16px; letter-spacing: 1px;
    color: var(--gold-bright); text-transform: uppercase; font-weight: 700;
    border-bottom: 1px solid var(--wood-border); padding-bottom: 6px;
  }
  .modal-content h2.second { margin-top: 16px; }
  .modal-close {
    position: absolute; top: 8px; right: 10px;
    width: 32px; height: 32px;
    border: 2px solid var(--wood-border); border-radius: 6px;
    background: rgba(0,0,0,.3);
    color: var(--parchment); font-size: 20px; line-height: 1; cursor: pointer;
  }
  .modal-close:active { background: var(--wood-light); }

  .inv-grid { display: grid; grid-template-columns: repeat(6, 50px); gap: 5px; }
  .inv-slot {
    width: 50px; height: 50px;
    background: rgba(0,0,0,.35);
    border: 2px solid var(--wood-light); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    position: relative; font-size: 24px;
    cursor: pointer; touch-action: none;
  }
  .inv-slot .count { position: absolute; bottom: 1px; right: 3px; font-size: 11px; font-weight: 700; color: var(--gold-bright); text-shadow: 0 1px 2px #000; }

  .hotbar-m-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
  .hotbar-m-slot {
    aspect-ratio: 1; min-width: 40px;
    background: rgba(0,0,0,.35);
    border: 2px solid var(--wood-light); border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    position: relative; font-size: 20px;
    cursor: pointer; touch-action: none;
  }
  .hotbar-m-slot .num { position: absolute; top: 1px; left: 3px; font-size: 9px; opacity: .6; }
  .hotbar-m-slot .count { position: absolute; bottom: 1px; right: 3px; font-size: 10px; font-weight: 700; color: var(--gold-bright); text-shadow: 0 1px 2px #000; }
  .inv-hint { font-size: 11px; opacity: .55; text-align: center; margin-top: 8px; letter-spacing: .3px; }

  .craft-list { display: flex; flex-direction: column; gap: 8px; }
  .craft-item {
    padding: 12px 14px; border-radius: 8px;
    border: 2px solid var(--wood-light);
    background: rgba(0,0,0,.3);
    color: var(--parchment); cursor: pointer; text-align: left;
    font-family: inherit; font-size: 13px; font-weight: 600;
    transition: all .15s;
  }
  .craft-item:active { transform: scale(.98); }
  .craft-item.enough { border-color: var(--gold); background: rgba(224,176,96,.15); box-shadow: 0 0 10px rgba(224,176,96,.3); }
  .craft-item.done { border-color: #6a8a4a; background: rgba(106,138,74,.15); opacity: .7; cursor: default; }
  .craft-item small { display: block; font-weight: 400; opacity: .75; font-size: 11px; margin-top: 4px; }

  .build-tabs { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 1px solid var(--wood-border); padding-bottom: 8px; }
  .build-tab {
    padding: 8px 14px; border-radius: 6px;
    border: 2px solid var(--wood-light);
    background: rgba(0,0,0,.3);
    color: var(--parchment); font-size: 12px; font-weight: 700;
    cursor: pointer; letter-spacing: .5px;
  }
  .build-tab.active { border-color: var(--gold); background: rgba(224,176,96,.25); color: var(--gold-bright); }
  .build-pieces { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .build-piece {
    padding: 14px; border-radius: 8px;
    border: 2px solid var(--wood-light);
    background: rgba(0,0,0,.3);
    color: var(--parchment); cursor: pointer;
    text-align: center; font-size: 13px; font-weight: 600;
    transition: all .15s;
  }
  .build-piece:active { transform: scale(.97); }
  .build-piece.enough { border-color: var(--gold); background: rgba(224,176,96,.15); }
  .build-piece.disabled { opacity: .4; cursor: not-allowed; }
  .build-piece .icon { font-size: 28px; display: block; margin-bottom: 4px; }
  .build-piece .cost { display: block; font-weight: 400; opacity: .75; font-size: 11px; margin-top: 4px; }

  .drag-ghost { pointer-events: none; filter: drop-shadow(0 4px 8px rgba(0,0,0,.8)); }

  @media (orientation: landscape) and (max-height: 500px) {
    .icon-btn { width: 38px; height: 38px; font-size: 18px; }
    #hotbar { bottom: 8px; padding: 3px; }
    .hotbar-slot { width: 38px; height: 38px; font-size: 18px; }
    #jumpBtn, #diveBtn { width: 56px; height: 56px; font-size: 22px; right: 12px; }
    #jumpBtn { bottom: 70px; } #diveBtn { bottom: 134px; }
    #action, #buildBtn { bottom: 58px; padding: 8px 18px; font-size: 12px; }
    #oxygen { bottom: 140px; height: 12px; width: 160px; }
    #stick { width: 100px; height: 100px; left: 12px; bottom: 12px; }
    #knob { width: 44px; height: 44px; margin: -22px 0 0 -22px; }
    #topright { padding: 4px 8px; }
    #clockBadge { font-size: 11px; padding: 4px 10px; }
    .modal-content { padding: 12px 16px 16px; min-width: 300px; }
    .inv-grid { grid-template-columns: repeat(6, 44px); gap: 4px; }
    .inv-slot { width: 44px; height: 44px; font-size: 20px; }
    .hotbar-m-slot { font-size: 16px; }
  }
</style>
</head>
<body>

<div id="startScreen">
  <h1>VALHEIM-LIKE</h1>
  <p>Открытый мир · Выживание · Строительство</p>
  <button id="startBtn">▶ ИГРАТЬ</button>
</div>

<div id="clockBadge">
  <span class="icon ui-icon-white" id="clockIcon">☀️</span>
  <span id="clockTime">06:00</span>
  <span id="weatherName" style="opacity:.8">· Ясно</span>
</div>

<div id="menuBtns">
  <button class="icon-btn" id="openInv" title="Инвентарь"><span class="ui-icon">🎒</span></button>
  <button class="icon-btn" id="openCraft" title="Крафт"><span class="ui-icon">⚒</span></button>
  <button class="icon-btn" id="fsBtn" title="Полный экран"><span class="ui-icon">⛶</span></button>
  <button class="icon-btn" id="camBtn" title="Сменить вид"><span class="ui-icon">📷</span></button>
</div>

<div id="topright">
  <div class="small">Управление</div>
  <div style="font-size: 10px; opacity: 0.6; text-align: right; line-height: 1.2;">
    Свайп справа — камера<br>2 пальца — зум
  </div>
</div>

<div id="oxygen"><div class="oxy-fill" id="oxyFill"></div></div>
<div id="hotbar"></div>

<div class="modal" id="invModal">
  <div class="modal-content">
    <button class="modal-close" data-close>×</button>
    <h2>Инвентарь</h2>
    <div class="inv-grid" id="invGrid"></div>
    <h2 class="second">Хотбар</h2>
    <div class="hotbar-m-grid" id="hotbarMGrid"></div>
    <div class="inv-hint">Перетащи предмет в другой слот</div>
  </div>
</div>

<div class="modal" id="craftModal">
  <div class="modal-content">
    <button class="modal-close" data-close>×</button>
    <h2>Крафт</h2>
    <div class="craft-list" id="craftList"></div>
  </div>
</div>

<div class="modal" id="buildModal">
  <div class="modal-content">
    <button class="modal-close" data-close>×</button>
    <h2>Строительство</h2>
    <div class="build-tabs" id="buildTabs"></div>
    <div class="build-pieces" id="buildPieces"></div>
  </div>
</div>

<button id="action">Подобрать</button>
<button id="buildBtn"><span class="ui-icon">🔨</span> Строить</button>
<button id="jumpBtn">↑</button>
<button id="diveBtn">↓</button>
<div id="toast"></div>
<div id="stick"><div id="knob"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ==================== СТАРТ ==================== */
document.getElementById('startBtn').addEventListener('click', async () => {
  try {
    if (document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen();
    } else if (document.documentElement.webkitRequestFullscreen) {
      await document.documentElement.webkitRequestFullscreen();
    }
  } catch(e) {}
  try {
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock('landscape');
    }
  } catch(e) {}
  document.getElementById('startScreen').style.display = 'none';
});

/* ==================== НАСТРОЙКИ ==================== */
const WORLD_SIZE     = 2520;
const TERRAIN_SEG    = 300;
const PINE_COUNT     = 1000;
const OAK_COUNT      = 600;
const BIRCH_COUNT    = 450;
const SMALL_TREE_COUNT = 600;
const ROCK_COUNT     = 700;
const FLINT_COUNT    = 500;
const BRANCH_COUNT   = 900;
const SEAWEED_COUNT  = 400;
const PEBBLE_COUNT   = 400;
const GRASS_PER_VARIANT = 22000;
const RAIN_COUNT     = 600;
const PLAYER_RADIUS  = 0.35;
const PLAYER_HEIGHT  = 1.8;
const SPEED          = 10;
const ACCEL          = 14;
const WATER_LEVEL    = -2.5; // Сделали воду глубже
const GRAVITY        = 25;
const JUMP_SPEED     = 9;
const SWIM_SPEED_MUL = 0.55;
const DIVE_SPEED     = 4.5;
const SWIM_DEPTH_THRESHOLD = 1.0;
const MAX_STEP_DOWN  = 0.5;
const OXYGEN_MAX     = 100;
const OXYGEN_DRAIN   = 9;
const OXYGEN_REFILL  = 35;
const FOG_DENSITY    = 0.0025;
const FOG_DENSITY_UNDER = 0.09;
const DAY_CYCLE      = 720;
const INV_SLOTS      = 30;
const HOTBAR_SLOTS   = 9;

/* ==================== РЕНДЕР ==================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
// Улучшенное разрешение для устранения "мыла"
renderer.setPixelRatio(Math.min(devicePixelRatio, 3));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa8c8d8);
scene.fog = new THREE.FogExp2(0xa8c8d8, FOG_DENSITY);

const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 3000);
camera.position.set(0, 12, 18);

const hemi = new THREE.HemisphereLight(0xd8ecff, 0x445533, 0.9);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2d0, 2.2);
sun.position.set(40, 60, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -60; sc.right = 60; sc.top = 60; sc.bottom = -60; sc.near = 1; sc.far = 220;
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.03;
scene.add(sun); scene.add(sun.target);

const skyGeo = new THREE.SphereGeometry(2000, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    topColor: { value: new THREE.Color(0x4a90d0) },
    midColor: { value: new THREE.Color(0xa8c8d8) },
    botColor: { value: new THREE.Color(0xe0d8c0) },
  },
  vertexShader: `varying vec3 vDir; void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader: `varying vec3 vDir; uniform vec3 topColor,midColor,botColor; void main(){ float h=clamp(vDir.y*0.5+0.5,0.0,1.0); vec3 c=mix(botColor,midColor,smoothstep(0.3,0.55,h)); c=mix(c,topColor,smoothstep(0.55,1.0,h)); gl_FragColor=vec4(c,1.0);} `,
});
const sky = new THREE.Mesh(skyGeo, skyMat);
sky.renderOrder = -1;
scene.add(sky);

/* ==================== ШУМ И РЕЛЬЕФ ==================== */
function hash(x, y) { const s = Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); }
function smooth(t) { return t*t*(3-2*t); }
function valueNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x-xi, yf = y-yi;
  const a = hash(xi,yi), b = hash(xi+1,yi), c = hash(xi,yi+1), d = hash(xi+1,yi+1);
  const u = smooth(xf), v = smooth(yf);
  return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
}
function fbm(x, y) { let v=0,amp=0.5,freq=1; for(let i=0;i<4;i++){v+=amp*valueNoise(x*freq,y*freq);freq*=2;amp*=0.5;} return v; }
function valueNoiseSeamless(x, y, period) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x-xi, yf = y-yi;
  const x0 = ((xi%period)+period)%period, y0 = ((yi%period)+period)%period;
  const x1 = (x0+1)%period, y1 = (y0+1)%period;
  const a = hash(x0,y0), b = hash(x1,y0), c = hash(x0,y1), d = hash(x1,y1);
  const u = smooth(xf), v = smooth(yf);
  return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
}

function terrainHeight(x, z) {
  const hills = (fbm(x*0.008+10, z*0.008+10)-0.42)*22;
  const amp = 0.35 + 0.65*fbm(x*0.0035+50, z*0.0035+50);
  let h = hills*amp;

  // Добавляем горы
  const mountainNoise = fbm(x*0.002 + 100, z*0.002 + 100);
  if (mountainNoise > 0.6) {
    h += Math.pow(mountainNoise - 0.6, 2) * 250; // Резкие пики
  }

  h += (fbm(x*0.06, z*0.06)-0.5)*1.4;

  // Реки (углубленные)
  const r1c = Math.sin(x*0.016)*30+Math.cos(x*0.005)*20;
  const r1 = Math.max(0, 1-Math.abs(z-r1c)/11);
  const r2c = Math.sin(z*0.014)*28+Math.cos(z*0.006)*18;
  const r2 = Math.max(0, 1-Math.abs(x-r2c)/10);
  const rm = Math.max(r1,r2);
  if (rm > 0) {
    const k = rm*rm;
    h = h*(1-k*0.95) - k*18.0; // Сделали реки глубже
  }

  return h;
}

const GRID_HALF = WORLD_SIZE/2;
const GRID_CELL = WORLD_SIZE/TERRAIN_SEG;
const GRID_N = TERRAIN_SEG+1;
const gridHeights = new Float32Array(GRID_N*GRID_N);
for (let iz = 0; iz < GRID_N; iz++) for (let ix = 0; ix < GRID_N; ix++)
  gridHeights[iz*GRID_N+ix] = terrainHeight(-GRID_HALF+ix*GRID_CELL, -GRID_HALF+iz*GRID_CELL);

function getTerrainYAt(x, z) {
  const gx = (x+GRID_HALF)/GRID_CELL, gz = (z+GRID_HALF)/GRID_CELL;
  let ix = Math.floor(gx), iz = Math.floor(gz);
  if (ix < 0) ix = 0; if (iz < 0) iz = 0;
  if (ix > GRID_N-2) ix = GRID_N-2; if (iz > GRID_N-2) iz = GRID_N-2;
  const fx = Math.max(0, Math.min(1, gx-ix));
  const fz = Math.max(0, Math.min(1, gz-iz));
  const h00 = gridHeights[iz*GRID_N+ix];
  const h10 = gridHeights[iz*GRID_N+ix+1];
  const h01 = gridHeights[(iz+1)*GRID_N+ix];
  const h11 = gridHeights[(iz+1)*GRID_N+ix+1];
  if (fx+fz < 1) return h00*(1-fx-fz)+h01*fz+h10*fx;
  return h01*(1-fx)+h11*(fx+fz-1)+h10*(1-fz);
}

/* ==================== ТЕКСТУРЫ ==================== */
function makeNoiseTexture() {
  const SIZE = 1024;
  const c = document.createElement('canvas');
  c.width = SIZE; c.height = SIZE;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(SIZE, SIZE);
  const P1 = 8, P2 = 24;
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
    const i = (y*SIZE+x)*4;
    const n1 = valueNoiseSeamless(x*P1/SIZE, y*P1/SIZE, P1);
    const n2 = valueNoiseSeamless(x*P2/SIZE, y*P2/SIZE, P2);
    const v = 180 + (n1*0.5 + n2*0.5) * 75;
    img.data[i]=v; img.data[i+1]=v; img.data[i+2]=v*0.95; img.data[i+3]=255;
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(60, 60);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = MAX_ANISO;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  return tex;
}

function makeWaterNormalMap() {
  const SIZE = 512;
  const c = document.createElement('canvas');
  c.width = SIZE; c.height = SIZE;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(SIZE, SIZE);
  const P1 = 12, P2 = 32, P3 = 80;
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
    const i = (y*SIZE+x)*4;
    const b = valueNoiseSeamless(x*P1/SIZE, y*P1/SIZE, P1)*0.5 + valueNoiseSeamless(x*P2/SIZE, y*P2/SIZE, P2)*0.3 + valueNoiseSeamless(x*P3/SIZE, y*P3/SIZE, P3)*0.2;
    const nx = valueNoiseSeamless((x+1)*P1/SIZE, y*P1/SIZE, P1)*0.5 + valueNoiseSeamless((x+1)*P2/SIZE, y*P2/SIZE, P2)*0.3 + valueNoiseSeamless((x+1)*P3/SIZE, y*P3/SIZE, P3)*0.2;
    const ny = valueNoiseSeamless(x*P1/SIZE, (y+1)*P1/SIZE, P1)*0.5 + valueNoiseSeamless(x*P2/SIZE, (y+1)*P2/SIZE, P2)*0.3 + valueNoiseSeamless(x*P3/SIZE, (y+1)*P3/SIZE, P3)*0.2;
    img.data[i] = 128+(nx-b)*380;
    img.data[i+1] = 128+(ny-b)*380;
    img.data[i+2] = 255; img.data[i+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(40, 40);
  tex.anisotropy = MAX_ANISO;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  return tex;
}

waterMat.onBeforeCompile = (shader) => {
  shader.uniforms.uTime = { value: 0 };
  shader.uniforms.uWaveHeight = { value: 0.15 }; // Высота волн
  
  shader.vertexShader = `
    uniform float uTime;
    uniform float uWaveHeight;
    varying float vWave;
  ` + shader.vertexShader;

  shader.vertexShader = shader.vertexShader.replace(
    '#include <begin_vertex>',
    `
    vec3 transformed = vec3(position);
    float wx = position.x * 0.05;
    float wz = position.z * 0.04;
    float wave = sin(wx + uTime * 0.8) * 0.4 + sin(wz + uTime * 0.6) * 0.35 + sin((wx+wz)*0.6 + uTime * 1.0) * 0.25;
    transformed.y += wave * uWaveHeight;
    vWave = wave;
    `
  );

  shader.fragmentShader = `varying float vWave;\n` + shader.fragmentShader;
  shader.fragmentShader = shader.fragmentShader.replace(
    '#include <color_fragment>',
    `
    #include <color_fragment>
    // Пена: появляется на высоких волнах
    float foam = smoothstep(0.3, 0.7, vWave) * smoothstep(0.1, 0.3, vWaveHeight);
    diffuseColor.rgb = mix(diffuseColor.rgb, vec3(1.0, 1.0, 1.0), foam * 0.8);
    `
  );
  // Исправляем опечатку в шейдере (uWaveHeight -> uWaveHeight) для точности
  shader.fragmentShader = shader.fragmentShader.replace('vWaveHeight', 'vWave'); 
  // Но у нас нет uniform в фрагментном, поэтому используем varying vWave напрямую.
  // Убираем smoothstep(..., vWaveHeight), так как он не нужен, если vWave уже содержит высоту.
  // Просто перепишем замену:
  shader.fragmentShader = shader.fragmentShader.replace(
    '#include <color_fragment>',
    `
    #include <color_fragment>
    float foam = smoothstep(0.3, 0.7, vWave);
    diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.9, 0.95, 1.0), foam * 0.9);
    `
  );

  waterMat.userData.shader = shader;
};

function makeGrassCluster() {
  const geos = [];
  for (let i = 0; i < 4; i++) {
    const g = new THREE.ConeGeometry(0.035 + Math.random()*0.025, 0.45 + Math.random()*0.35, 3);
    g.translate((Math.random()-0.5)*0.28, 0.28, (Math.random()-0.5)*0.28);
    g.rotateY(Math.random() * Math.PI * 2);
    geos.push(g.toNonIndexed());
  }
  const posArr = [], normArr = [];
  for (const g of geos) {
    posArr.push(...g.attributes.position.array);
    normArr.push(...g.attributes.normal.array);
  }
  const merged = new THREE.BufferGeometry();
  merged.setAttribute('position', new THREE.Float32BufferAttribute(posArr, 3));
  merged.setAttribute('normal', new THREE.Float32BufferAttribute(normArr, 3));
  return merged;
}
const grassGeo = makeGrassCluster();

const grassShaders = [];
function attachGrassShader(mat) {
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uPlayerPos = { value: new THREE.Vector3(0, -9999, 0) };
    shader.uniforms.uTime = { value: 0 };
    shader.vertexShader = `uniform vec3 uPlayerPos;\nuniform float uTime;\n` + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      `
      vec3 transformed = vec3(position);
      #ifdef USE_INSTANCING
        vec3 instPos = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
      #else
        vec3 instPos = vec3(0.0);
      #endif
      float windPhase = uTime * 1.6 + instPos.x * 0.3 + instPos.z * 0.2;
      float windAmt = sin(windPhase) * 0.12 + sin(windPhase * 0.7) * 0.06;
      transformed.x += windAmt * position.y * position.y;
      vec2 delta = instPos.xz - uPlayerPos.xz;
      float dist = length(delta);
      float bend = smoothstep(2.0, 0.2, dist);
      vec2 pushDir = normalize(delta + vec2(0.0001, 0.0001));
      transformed.xz += pushDir * bend * position.y * 1.1;
      transformed.y *= 1.0 - bend * 0.7;
      `
    );
    grassShaders.push(shader);
  };
}

function getItemCount(id) {
  let n = 0;
  for (const s of inventory) if (s && s.id === id) n += s.count || 1;
  for (const s of hotbar) if (s && s.id === id) n += s.count || 1;
  return n;
}
function hasTool(id) {
  for (const s of inventory) if (s && s.id === id) return true;
  for (const s of hotbar) if (s && s.id === id) return true;
  return false;
}
function addItem(id, count = 1) {
  const def = ITEM_DEFS[id];
  if (!def) return;
  if (def.isResource) {
    for (const arr of [inventory, hotbar]) {
      for (let i = 0; i < arr.length; i++) {
        if (arr[i] && arr[i].id === id) { arr[i].count += count; refreshUI(); return; }
      }
    }
    for (const arr of [inventory, hotbar]) {
      for (let i = 0; i < arr.length; i++) {
        if (!arr[i]) { arr[i] = { id, count }; refreshUI(); return; }
      }
    }
  } else {
    for (const arr of [hotbar, inventory]) {
      for (let i = 0; i < arr.length; i++) {
        if (!arr[i]) { arr[i] = { id }; refreshUI(); return; }
      }
    }
  }
}
function removeItem(id, count) {
  for (const arr of [inventory, hotbar]) {
    for (let i = 0; i < arr.length && count > 0; i++) {
      if (arr[i] && arr[i].id === id) {
        if (ITEM_DEFS[id].isResource) {
          const take = Math.min(count, arr[i].count || 1);
          arr[i].count -= take;
          if (arr[i].count <= 0) arr[i] = null;
          count -= take;
        } else {
          arr[i] = null;
          count--;
        }
      }
    }
  }
}

const invGrid = document.getElementById('invGrid');
const hotbarMGrid = document.getElementById('hotbarMGrid');

let dragState = null;

function attachDrag(slotEl, fromType, index) {
  slotEl.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    const arr = fromType === 'inv' ? inventory : hotbar;
    if (!arr[index]) return;
    dragState = {
      from: fromType, index, startX: e.clientX, startY: e.clientY,
      moved: false, item: { ...arr[index] }
    };
    const ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    ghost.innerHTML = ITEM_DEFS[arr[index].id].icon;
    ghost.style.cssText = `position:fixed;left:${e.clientX}px;top:${e.clientY}px;font-size:36px;transform:translate(-50%,-50%);z-index:10000;`;
    document.body.appendChild(ghost);
    dragState.ghostEl = ghost;
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onDragUp);
  });
}

function onDragMove(e) {
  if (!dragState) return;
  const dx = e.clientX - dragState.startX;
  const dy = e.clientY - dragState.startY;
  if (Math.hypot(dx, dy) > 5) dragState.moved = true;
  dragState.ghostEl.style.left = e.clientX + 'px';
  dragState.ghostEl.style.top = e.clientY + 'px';
}

function onDragUp(e) {
  if (!dragState) return;
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragUp);
  if (dragState.ghostEl) dragState.ghostEl.remove();
  if (!dragState.moved) {
    if (dragState.from === 'hotbar') selectSlot(dragState.index);
    dragState = null;
    return;
  }
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const target = el ? el.closest('.slot-target') : null;
  if (target) {
    const toFrom = target.dataset.from;
    const toIdx = parseInt(target.dataset.index);
    if (!(toFrom === dragState.from && toIdx === dragState.index)) {
      moveItem(dragState.from, dragState.index, toFrom, toIdx);
    }
  }
  dragState = null;
}

function moveItem(fromType, fromIdx, toType, toIdx) {
  const fromArr = fromType === 'inv' ? inventory : hotbar;
  const toArr = toType === 'inv' ? inventory : hotbar;
  const item = fromArr[fromIdx];
  if (!item) return;
  const target = toArr[toIdx];
  if (target && target.id === item.id && ITEM_DEFS[item.id].isResource) {
    target.count = (target.count || 1) + (item.count || 1);
    fromArr[fromIdx] = null;
  } else {
    fromArr[fromIdx] = target;
    toArr[toIdx] = item;
  }
  refreshUI();
  updateBuildBtn();
}

function beep(freq = 600) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(); const g = actx.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(freq, actx.currentTime);
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.12, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.18);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.2);

}

let camYaw = 0;
let camPitch = 0.4;
let camDist = 8;
const CAM_MIN = 2;
const CAM_MAX = 20;

let camTouchId = null, camTouchStart = { x: 0, y: 0 };
let pinchDist = 0;

addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 2) return; // Мышка на правую кнопку для камеры
  if (modalOpen) return;
  // Правая сторона экрана - камера
  if (e.clientX > innerWidth * 0.4 && !e.target.closest('button, .modal, #hotbar, #stick')) {
    if (camTouchId === null) {
      camTouchId = e.pointerId;
      camTouchStart = { x: e.clientX, y: e.clientY };
    } else {
      const dx = e.clientX - camTouchStart.x;
      const dy = e.clientY - camTouchStart.y;
      pinchDist = Math.hypot(dx, dy);
    }
  }
});

addEventListener('pointermove', e => {
  if (e.pointerId === camTouchId) {
    const dx = e.clientX - camTouchStart.x;
    const dy = e.clientY - camTouchStart.y;
    
    // Исправленная инверсия: свайп вправо -> камера вправо, свайп вверх -> камера вверх
    camYaw -= dx * 0.005;
    camPitch -= dy * 0.005;
    camPitch = Math.max(-1.2, Math.min(1.2, camPitch)); // Ограничение
    
    camTouchStart = { x: e.clientX, y: e.clientY };
  }
});

function endCamTouch(e) {
  if (e.pointerId === camTouchId) {
    camTouchId = null;
    pinchDist = 0;
  }
}
addEventListener('pointerup', endCamTouch);
addEventListener('pointercancel', endCamTouch);

// Пинч-зум (2 пальца)
let touchPointers = {};
addEventListener('touchstart', e => {
  for (let t of e.changedTouches) touchPointers[t.identifier] = t;
  if (Object.keys(touchPointers).length === 2) {
    const pts = Object.values(touchPointers);
    pinchDist = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
  }
}, {passive: false});

addEventListener('touchmove', e => {
  for (let t of e.changedTouches) {
    if (touchPointers[t.identifier]) touchPointers[t.identifier] = t;
  }
  if (Object.keys(touchPointers).length === 2) {
    const pts = Object.values(touchPointers);
    const newDist = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
    if (pinchDist > 0) {
      const zoomDelta = (pinchDist - newDist) * 0.02;
      camDist = Math.max(CAM_MIN, Math.min(CAM_MAX, camDist + zoomDelta));
    }
    pinchDist = newDist;
    e.preventDefault();
  }
}, {passive: false});

addEventListener('touchend', e => {
  for (let t of e.changedTouches) delete touchPointers[t.identifier];
  if (Object.keys(touchPointers).length < 2) pinchDist = 0;
});

/* ==================== ОБНОВЛЕНИЕ КАМЕРЫ ==================== */
const camDesired = new THREE.Vector3();
const lookAt = new THREE.Vector3();
const tmpV = new THREE.Vector3();
const euler = new THREE.Euler(0, 0, 0, 'YXZ');

function updateCamera(dt) {
  if (isFirstPerson.value) {
    // Вид от 1 лица (без инверсии)
    camera.position.set(player.position.x, player.position.y + 1.6, player.position.z);
    euler.set(camPitch, camYaw, 0);
    camera.quaternion.setFromEuler(euler);
  } else {
    // Вид от 3 лица
    const sp = Math.hypot(velocity.x, velocity.z);
    if (sp > 1.0 && camTouchId === null) {
      const targetYaw = Math.atan2(-velocity.x, -velocity.z);
      camYaw = dampAngle(camYaw, targetYaw, 2, dt);
    }

    const offset = new THREE.Vector3(
      Math.sin(camYaw) * Math.cos(camPitch),
      Math.sin(camPitch),
      Math.cos(camYaw) * Math.cos(camPitch)
    ).multiplyScalar(camDist);

    camDesired.copy(player.position).add(offset);
    camDesired.y += 1.2;
    camera.position.lerp(camDesired, 1 - Math.exp(-10 * dt));
    
    lookAt.set(player.position.x, player.position.y + 1.2, player.position.z);
    camera.lookAt(lookAt);
  }
}

/* ==================== ФИЗИКА ==================== */
const velocity = new THREE.Vector3();
let vy = 0, onGround = true;
let walkPhase = 0, idlePhase = 0;
let currentSpeed01 = 0;
let oxygen = OXYGEN_MAX;
let isSwimming = false, isUnderwater = false;
let bodyTiltTarget = 0, airborneBlend = 0, runBlend = 0, holdBlend = 0;

function findSpawn() {
  if (getTerrainYAt(0, 0) > WATER_LEVEL + 2) return { x: 0, z: 0 };
  for (let r = 5; r < 200; r += 5) for (let a = 0; a < Math.PI * 2; a += 0.3) {
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (getTerrainYAt(x, z) > WATER_LEVEL + 2) return { x, z };
  }
  return { x: 0, z: 0 };
}
const spawn = findSpawn();
player.position.set(spawn.x, getTerrainYAt(spawn.x, spawn.z), spawn.z);

function dampAngle(cur, target, lambda, dt) {
  let diff = (target - cur) % (Math.PI * 2);
  if (diff > Math.PI) diff -= Math.PI * 2;
  if (diff < -Math.PI) diff += Math.PI * 2;
  return cur + diff * (1 - Math.exp(-lambda * dt));
}

function getInput() {
  if (modalOpen) return { x: 0, z: 0 };
  let x = 0, z = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp'))    z -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown'))  z += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft'))  x -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) x += 1;
  x += joyVec.x; z += joyVec.y;
  const len = Math.hypot(x, z);
  if (len > 1) { x /= len; z /= len; }
  return { x, z };
}

function resolveObstacles() {
  for (const o of obstacles) {
    const dx = player.position.x - o.x, dz = player.position.z - o.z;
    const d = Math.hypot(dx, dz), min = o.radius + PLAYER_RADIUS;
    if (d < min && d > 0.0001) {
      const k = min / d;
      player.position.x = o.x + dx * k;
      player.position.z = o.z + dz * k;
    }
  }
}

function updatePlayer(dt) {
  const inp = getInput();
  const t = 1 - Math.exp(-ACCEL * dt);
  
  // Относительно камеры
  const fwdX = -Math.sin(camYaw);
  const fwdZ = -Math.cos(camYaw);
  const rightX = Math.cos(camYaw);
  const rightZ = -Math.sin(camYaw);

  const moveX = fwdX * (-inp.z) + rightX * inp.x;
  const moveZ = fwdZ * (-inp.z) + rightZ * inp.x;

  const gPre = getTerrainYAt(player.position.x, player.position.z);
  const inWaterPre = player.position.y < WATER_LEVEL - 0.1;
  isSwimming = inWaterPre && (WATER_LEVEL - gPre) > SWIM_DEPTH_THRESHOLD;
  const speedMul = isSwimming ? SWIM_SPEED_MUL : (inWaterPre ? 0.7 : 1.0);
  
  velocity.x += (moveX * SPEED * speedMul - velocity.x) * t;
  velocity.z += (moveZ * SPEED * speedMul - velocity.z) * t;
  player.position.x += velocity.x * dt;
  player.position.z += velocity.z * dt;
  
  resolveObstacles();
  const half = WORLD_SIZE / 2 - 5;
  player.position.x = Math.max(-half, Math.min(half, player.position.x));
  player.position.z = Math.max(-half, Math.min(half, player.position.z));

  const groundY = getTerrainYAt(player.position.x, player.position.z);
  const waterSurface = WATER_LEVEL - 0.3;
  const waterDepth = WATER_LEVEL - groundY;
  const inWaterNow = player.position.y < WATER_LEVEL - 0.1;
  isSwimming = inWaterNow && waterDepth > SWIM_DEPTH_THRESHOLD;

  if (isSwimming) {
    const holdingDive = touchDive || keys.has('ShiftLeft') || keys.has('ShiftRight');
    if (oxygen <= 0) vy += (waterSurface - player.position.y) * 12 * dt;
    else if (holdingDive) vy -= DIVE_SPEED * 5 * dt;
    else vy += (waterSurface - player.position.y) * 6 * dt;
    vy = Math.max(-DIVE_SPEED, Math.min(vy, 4));
    if (jumpRequested) vy = Math.max(vy, JUMP_SPEED * 0.5);
    player.position.y += vy * dt;
    if (player.position.y < groundY + 0.2) { player.position.y = groundY + 0.2; vy = Math.max(0, vy); }
    if (player.position.y > waterSurface && vy > 0) { player.position.y = waterSurface; vy = 0; }
    onGround = false;
  } else {
    if (jumpRequested && onGround) {
      vy = JUMP_SPEED; onGround = false; player.position.y += vy * dt;
    } else if (!onGround) {
      vy -= GRAVITY * dt;
      player.position.y += vy * dt;
      if (player.position.y <= groundY && vy <= 0) { player.position.y = groundY; vy = 0; onGround = true; }
    } else {
      const drop = player.position.y - groundY;
      if (drop > MAX_STEP_DOWN) { onGround = false; vy = 0; }
      else { player.position.y = groundY; vy = 0; }
    }
  }
  jumpRequested = false;

  const headY = player.position.y + PLAYER_HEIGHT;
  isUnderwater = headY < WATER_LEVEL;
  if (isUnderwater) { oxygen -= OXYGEN_DRAIN * dt; if (oxygen < 0) oxygen = 0; }
  else { oxygen += OXYGEN_REFILL * dt; if (oxygen > OXYGEN_MAX) oxygen = OXYGEN_MAX; }

  const sp = Math.hypot(velocity.x, velocity.z);
  currentSpeed01 = onGround ? Math.min(1, sp / SPEED) : 0;
  
  if (sp > 0.4) {
    if (isFirstPerson.value) {
      player.rotation.y = camYaw + Math.PI;
    } else {
      player.rotation.y = dampAngle(player.rotation.y, Math.atan2(velocity.x, velocity.z), 12, dt);
    }
  }
  
  diveBtnEl.style.display = isSwimming ? 'flex' : 'none';
}

/* ==================== АНИМАЦИЯ ==================== */
const lerpA = (a, b, t) => a + (b - a) * t;
function updatePlayerAnim(dt) {
  const s = currentSpeed01;
  walkPhase += dt * (4 + s * 9) * s;
  idlePhase += dt * 2;
  const airborneTarget = (!onGround && !isSwimming) ? 1 : 0;
  airborneBlend += (airborneTarget - airborneBlend) * (1 - Math.exp(-14 * dt));
  const runTarget = s > 0.65 ? 1 : 0;
  runBlend += (runTarget - runBlend) * (1 - Math.exp(-6 * dt));

  const holding = selectedSlot >= 0 && hotbar[selectedSlot];
  const holdTarget = holding ? 1 : 0;
  holdBlend += (holdTarget - holdBlend) * (1 - Math.exp(-10 * dt));

  if (isSwimming) {
    bodyTiltTarget = 1.15;
    const t = performance.now() / 1000, sp = 4.5;
    armL.shoulder.rotation.x = Math.sin(t * sp) * 1.3 + 0.3;
    armL.shoulder.rotation.z = -0.35;
    armR.shoulder.rotation.x = Math.sin(t * sp + Math.PI) * 1.3 + 0.3;
    armR.shoulder.rotation.z = 0.35;
    armR.elbow.rotation.x = 0;
    const kick = Math.sin(t * sp * 2);
    legL.hip.rotation.x = kick * 0.45; legR.hip.rotation.x = -kick * 0.45;
    headGroup.rotation.x = -0.6; headGroup.rotation.y = 0;
  } else {
    const swing = Math.sin(walkPhase) * (0.6 + runBlend * 0.3) * s;
    const swingOpp = Math.sin(walkPhase + Math.PI) * (0.6 + runBlend * 0.3) * s;
    const airLeg = -0.55;
    const airArm = -1.15 + (vy < 0 ? 0.3 : 0);

    legL.hip.rotation.x = lerpA(swing, airLeg, airborneBlend);
    legR.hip.rotation.x = lerpA(swingOpp, airLeg - 0.1, airborneBlend);

    armL.shoulder.rotation.x = lerpA(swingOpp * 0.8, airArm, airborneBlend);
    armL.shoulder.rotation.z = lerpA(-0.06 - runBlend * 0.15, -0.5, airborneBlend);

    const walkShoulderX = swing * 0.8;
    const holdShoulderX = -0.6;
    armR.shoulder.rotation.x = lerpA(lerpA(walkShoulderX, airArm, airborneBlend), holdShoulderX, holdBlend);
    armR.shoulder.rotation.z = lerpA(lerpA(0.06 + runBlend * 0.15, 0.5, airborneBlend), 0.1, holdBlend);
    armR.elbow.rotation.x = holdBlend * 1.2;

    const headBob = Math.sin(walkPhase * 2) * 0.03 * s;
    headGroup.rotation.x = lerpA(headBob, 0.15, airborneBlend);
    if (s < 0.05) headGroup.rotation.y = Math.sin(idlePhase * 0.4) * 0.25;
    else headGroup.rotation.y *= Math.exp(-4 * dt);
    bodyTiltTarget = lerpA(s * 0.07 + runBlend * 0.05, 0.18, airborneBlend);
  }
  bodyRoot.rotation.x += (bodyTiltTarget - bodyRoot.rotation.x) * (1 - Math.exp(-8 * dt));
  bodyRoot.rotation.z = Math.sin(walkPhase) * (0.04 + runBlend * 0.03) * s;
  const bob = Math.abs(Math.sin(walkPhase * 2)) * (0.04 + runBlend * 0.03) * s;
  const breathe = s < 0.1 && onGround && !isSwimming ? Math.sin(idlePhase) * 0.012 : 0;
  bodyRoot.position.y = bob + breathe;
}

function updateTorch(t) {
  if (selectedSlot < 0 || !hotbar[selectedSlot] || hotbar[selectedSlot].id !== 'torch') return;
  const flicker = 2.3 + Math.sin(t * 18) * 0.35 + Math.sin(t * 27) * 0.2 + Math.sin(t * 9) * 0.15;
  torchLight.intensity = flicker;
  const scale = 1 + Math.sin(t * 15) * 0.08;
  torchFlame.scale.set(scale, 1 + Math.sin(t * 20) * 0.15, scale);
  torchFlame2.scale.set(scale, 1 + Math.sin(t * 25) * 0.2, scale);
}

/* ==================== ДЕЙСТВИЯ (ПОДБОР ИЗ-ПОД ВОДЫ) ==================== */
function findNearestAction() {
  if (modalOpen || placingPiece) { setAction(null); return; }
  const px = player.position.x, pz = player.position.z;
  let best = null, bestDist = Infinity;

  // Убрано ограничение по высоте воды (WATER_PICKUP_BUFFER)
  for (const r of rockData) {
    if (!r.alive) continue;
    const d = Math.hypot(px-r.x, pz-r.z);
    if (d < 2.0 && d < bestDist) { bestDist = d; best = { kind: 'rock', target: r, label: 'Подобрать камень' }; }
  }
  for (const f of flintData) {
    if (!f.alive) continue;
    const d = Math.hypot(px-f.x, pz-f.z);
    if (d < 2.0 && d < bestDist) { bestDist = d; best = { kind: 'flint', target: f, label: 'Подобрать кремень' }; }
  }
  for (const b of branchData) {
    if (!b.alive) continue;
    const d = Math.hypot(px-b.x, pz-b.z);
    if (d < 2.0 && d < bestDist) { bestDist = d; best = { kind: 'branch', target: b, label: 'Подобрать ветку' }; }
  }
  const hasAxe = hasTool('stoneAxe') || hasTool('flintAxe');
  for (const tt of treeData) {
    if (!tt.alive) continue;
    const d = Math.hypot(px-tt.x, pz-tt.z);
    if (d < 2.4 && d < bestDist) {
      bestDist = d;
      const canCut = hasAxe || tt.type === 'small';
      let label;
      if (tt.type === 'small') label = hasAxe ? 'Рубить маленькое дерево' : 'Срубить руками';
      else if (hasAxe) label = 'Рубить дерево';
      else label = 'Нужен топор';
      best = { kind: canCut ? 'tree' : 'tree-noaxe', target: tt, label };
    }
  }
  setAction(best);
}
function hideInstance(inst, idx) {
  dummy.position.set(0, -9999, 0); dummy.rotation.set(0, 0, 0); dummy.scale.set(0, 0, 0); dummy.updateMatrix();
  inst.setMatrixAt(idx, dummy.matrix); inst.instanceMatrix.needsUpdate = true;
}
function doAction() {
  if (!currentAction) return;
  const { kind, target } = currentAction;
  if (kind === 'rock') {
    target.alive = false; hideInstance(rockInst, target.idx);
    addItem('stone', 2 + Math.floor(Math.random()*2));
    toast('+ камень'); beep(420);
  } else if (kind === 'flint') {
    target.alive = false; hideInstance(flintInst, target.idx);
    addItem('flint', 2 + Math.floor(Math.random()*2));
    toast('+ кремень'); beep(560);
  } else if (kind === 'branch') {
    target.alive = false; hideInstance(branchInst, target.idx);
    addItem('wood', 1 + Math.floor(Math.random()*2));
    toast('+ дерево'); beep(480);
  } else if (kind === 'tree' || kind === 'tree-noaxe') {
    if (kind === 'tree-noaxe') { toast('Сначала топор'); return; }
    const hasFlint = hasTool('flintAxe');
    const dmg = target.type === 'small' ? 2 : (hasFlint ? 6 : 4);
    target.hp -= dmg;
    beep(hasFlint ? 300 : 240);
    if (target.hp <= 0) {
      target.alive = false;
      for (const inst of target.insts) hideInstance(inst, target.idx);
      let wood, resin = 0;
      if (target.type === 'small') {
        wood = 2 + Math.floor(Math.random()*2); resin = 1 + Math.floor(Math.random()*2);
        toast(`Маленькое дерево (+${wood}🪵 +${resin}🟠)`);
      } else {
        wood = (target.type === 'oak' ? 5 : target.type === 'birch' ? 3 : 4) + Math.floor(Math.random()*3);
        if (Math.random() < 0.6) resin = 1 + Math.floor(Math.random()*2);
        const name = target.type === 'oak' ? 'Дуб' : target.type === 'birch' ? 'Берёза' : 'Сосна';
        toast(`${name} (+${wood}🪵${resin > 0 ? ` +${resin}🟠` : ''})`);
      }
      addItem('wood', wood);
      if (resin > 0) addItem('resin', resin);
    } else {
      toast(target.type === 'small' ? 'Хрясь!' : (hasFlint ? 'Быстрый удар' : 'Удар топором'));
    }
  }
  setAction(null);
}

/* ==================== КИСЛОРОД ==================== */
const oxyEl = document.getElementById('oxygen');
const oxyFill = document.getElementById('oxyFill');
function updateOxygenUI() {
  oxyEl.style.display = isUnderwater ? 'block' : 'none';
  if (!isUnderwater) return;
  const pct = (oxygen / OXYGEN_MAX) * 100;
  oxyFill.style.width = pct + '%';
  oxyFill.style.background = oxygen < 30 ? '#f44336' : 'linear-gradient(90deg, #4fc3f7, #29b6f6)';
}

/* ==================== ВРЕМЯ СУТОК / ПОГОДА ==================== */
let timeOfDay = 90;
const SKY_DAY = { top: 0x4a90d0, mid: 0xa8c8d8, bot: 0xe0d8c0 };
const SKY_SUNSET = { top: 0x2a2a6a, mid: 0xff6050, bot: 0xffb070 };
const SKY_NIGHT = { top: 0x080818, mid: 0x101828, bot: 0x1a2038 };
const _c1 = new THREE.Color(), _c2 = new THREE.Color(), _c3 = new THREE.Color();
function lerpHex(a, b, t) { _c1.setHex(a); _c2.setHex(b); return _c3.copy(_c1).lerp(_c2, t).clone(); }

function updateDayNight(dt) {
  timeOfDay = (timeOfDay + dt) % DAY_CYCLE;
  const sunAngle = (timeOfDay / DAY_CYCLE) * Math.PI * 2;
  const elev = Math.sin(sunAngle);

  const dayFactor = Math.max(0, elev);
  sun.intensity = (0.1 + dayFactor * 2.0) * weatherSunMul;
  sun.color.setHex(dayFactor > 0.5 ? 0xfff2d0 : 0xff9060);
  hemi.intensity = (0.15 + dayFactor * 0.75) * weatherAmbMul;

  let skyTop, skyMid, skyBot;
  if (elev > 0.3) {
    const t = Math.min(1, (elev - 0.3) / 0.7);
    skyTop = lerpHex(SKY_SUNSET.top, SKY_DAY.top, t);
    skyMid = lerpHex(SKY_SUNSET.mid, SKY_DAY.mid, t);
    skyBot = lerpHex(SKY_SUNSET.bot, SKY_DAY.bot, t);
  } else if (elev > -0.2) {
    const t = (elev + 0.2) / 0.5;
    skyTop = lerpHex(SKY_NIGHT.top, SKY_SUNSET.top, t);
    skyMid = lerpHex(SKY_NIGHT.mid, SKY_SUNSET.mid, t);
    skyBot = lerpHex(SKY_NIGHT.bot, SKY_SUNSET.bot, t);
  } else {
    skyTop = new THREE.Color(SKY_NIGHT.top);
    skyMid = new THREE.Color(SKY_NIGHT.mid);
    skyBot = new THREE.Color(SKY_NIGHT.bot);
  }
  if (weatherSkyGray > 0) {
    const gray = new THREE.Color(0x666666);
    skyTop.lerp(gray, weatherSkyGray);
    skyMid.lerp(gray, weatherSkyGray * 0.8);
    skyBot.lerp(gray, weatherSkyGray * 0.6);
  }

  skyMat.uniforms.topColor.value.copy(skyTop);
  skyMat.uniforms.midColor.value.copy(skyMid);
  skyMat.uniforms.botColor.value.copy(skyBot);

  const sunHeight = Math.max(0.1, elev);
  sun.position.set(
    player.position.x + Math.cos(sunAngle) * 80,
    player.position.y + sunHeight * 100,
    player.position.z + 40
  );
  sun.target.position.copy(player.position);
  sun.castShadow = elev > 0.05;

  currentFogColor.copy(skyMid);

  const hour = Math.floor((timeOfDay / DAY_CYCLE) * 24) + 6;
  const mm = Math.floor(((timeOfDay / DAY_CYCLE) * 24 * 60) % 60);
  const hh = hour % 24;
  document.getElementById('clockTime').textContent = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  document.getElementById('clockIcon').innerHTML = elev > 0.1 ? '<span class="ui-icon ui-icon-white">☀️</span>' : (elev > -0.1 ? '<span class="ui-icon ui-icon-white">🌅</span>' : '<span class="ui-icon ui-icon-white">🌙</span>');
}

let weather = 'clear';
let weatherTimer = 180 + Math.random() * 120;
let weatherSunMul = 1, weatherAmbMul = 1, weatherSkyGray = 0, weatherFogMul = 1;
const currentFogColor = new THREE.Color(0xa8c8d8);
const WEATHER_NAMES = { clear: 'Ясно', cloudy: 'Облачно', rain: 'Дождь', fog: 'Туман' };
function applyWeather() {
  switch (weather) {
    case 'clear':  weatherSunMul = 1.0; weatherAmbMul = 1.0; weatherSkyGray = 0;   weatherFogMul = 1.0; break;
    case 'cloudy': weatherSunMul = 0.5; weatherAmbMul = 0.8; weatherSkyGray = 0.4; weatherFogMul = 1.2; break;
    case 'rain':   weatherSunMul = 0.3; weatherAmbMul = 0.7; weatherSkyGray = 0.6; weatherFogMul = 1.6; break;
    case 'fog':    weatherSunMul = 0.5; weatherAmbMul = 0.7; weatherSkyGray = 0.5; weatherFogMul = 3.0; break;
  }
  document.getElementById('weatherName').textContent = '· ' + WEATHER_NAMES[weather];
}
applyWeather();
function updateWeather(dt) {
  weatherTimer -= dt;
  if (weatherTimer <= 0) {
    const opts = ['clear', 'clear', 'cloudy', 'cloudy', 'rain', 'fog'];
    weather = opts[Math.floor(Math.random() * opts.length)];
    weatherTimer = 180 + Math.random() * 180;
    applyWeather();
    toast(`Погода: ${WEATHER_NAMES[weather]}`);
  }
}

/* ==================== АТМОСФЕРА И ШЕЙДЕРЫ ==================== */
const FOG_WATER = new THREE.Color(0x1a4a6a);
function updateAtmosphere() {
  if (isUnderwater) {
    scene.fog.color.copy(FOG_WATER);
    scene.fog.density = FOG_DENSITY_UNDER;
    scene.background.copy(FOG_WATER);
    waterMat.opacity = 0.15;
  } else {
    scene.fog.color.copy(currentFogColor);
    scene.fog.density = FOG_DENSITY * weatherFogMul;
    scene.background.copy(currentFogColor);
    waterMat.opacity = 0.75;
  }
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.6, 0.9));
composer.addPass(new OutputPass());
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

const hintEl = document.getElementById('hint');
setTimeout(() => { if(hintEl) hintEl.style.opacity = '0'; }, 5500);

/* ==================== ЦИКЛ ==================== */
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  updatePlayer(dt);
  updatePlayerAnim(dt);
  updateCamera(dt);
  findNearestAction();
  updateDayNight(dt);
  updateWeather(dt);
  updateAtmosphere();
  updateOxygenUI();
  updateBuildBtn();
  updateTorch(elapsed);
  updateRain(dt);

  if (placingPiece) updateGhostPosition();
  waterNormalMap.offset.x = elapsed * 0.02;
  waterNormalMap.offset.y = elapsed * 0.03;
  
  // Динамическая высота волн в шейдере
  if (waterMat.userData.shader) {
    waterMat.userData.shader.uniforms.uTime.value = elapsed;
    waterMat.userData.shader.uniforms.uWaveHeight.value = weather === 'rain' ? 0.6 : 0.1;
  }

  for (const sh of grassShaders) {
    sh.uniforms.uPlayerPos.value.copy(player.position);
    sh.uniforms.uTime.value = elapsed;
  }

  sky.position.copy(player.position);
  composer.render();
}

renderOutsideHotbar();
animate();
</script>
