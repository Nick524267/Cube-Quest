<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Cube_Quest</title>

<style>
  :root {
    --wood-dark: #2e1f12; --wood-mid: #4a3520; --wood-light: #6a4a2a;
    --wood-border: #a8804a; --parchment: #f5e6c8; --gold: #e0b060; --gold-bright: #ffd27a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--wood-dark); font-family: 'Segoe UI', sans-serif; user-select: none; touch-action: none; }
  canvas { display: block; touch-action: none; width: 100vw !important; height: 100vh !important; }

  #versionLabel { position: fixed; top: 60px; right: 12px; color: var(--gold-bright); font-size: 12px; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; z-index: 100; }
  
  .ui-icon { filter: sepia(1) hue-rotate(-15deg) saturate(1.5) brightness(0.9); display: inline-block; }

  /* Меню */
  .menu-screen { position: fixed; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(42,26,14,0.95), rgba(10,6,2,0.98)); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; padding: 20px; backdrop-filter: blur(5px); }
  .menu-screen.active { display: flex; }
  .menu-screen h1 { color: var(--gold-bright); font-size: clamp(32px, 8vw, 64px); margin: 0 0 10px; letter-spacing: 6px; text-shadow: 0 0 30px rgba(224,176,96,.6); }
  .menu-btn { width: 280px; padding: 14px; margin-bottom: 10px; background: linear-gradient(180deg, var(--wood-mid), var(--wood-dark)); color: var(--parchment); border: 2px solid var(--wood-border); border-radius: 8px; font-size: 18px; font-weight: 600; cursor: pointer; transition: all .1s; font-family: inherit; }
  .menu-btn:hover { background: var(--wood-light); color: #fff; border-color: var(--gold); }
  .menu-btn:active { transform: scale(.97); }
  .menu-btn:disabled { opacity: .5; cursor: not-allowed; }

  #pauseMenu { background: rgba(10, 6, 2, 0.85); justify-content: flex-start; padding-top: 5vh; }
  .settings-panel { background: rgba(0,0,0,0.4); border: 2px solid var(--wood-border); padding: 15px; border-radius: 12px; width: 320px; margin-bottom: 20px; color: var(--parchment); }
  .settings-panel h3 { margin: 0 0 10px; color: var(--gold-bright); text-align: center; font-size: 16px; }
  .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; }
  .setting-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--gold); }
  .setting-row select { padding: 4px; background: var(--wood-dark); color: white; border: 1px solid var(--wood-border); border-radius: 4px; }

  /* Игровой интерфейс */
  #topright { position: fixed; top: 12px; right: 60px; display: flex; gap: 6px; color: var(--parchment); z-index: 5; }
  #menuBtns { position: fixed; top: 12px; left: 12px; display: none; gap: 6px; z-index: 6; }
  .icon-btn { width: 46px; height: 46px; border-radius: 8px; border: 2px solid var(--wood-border); background: rgba(30,20,10,.8); color: var(--parchment); font-size: 20px; cursor: pointer; }
  .icon-btn:active { border-color: var(--gold); }
  #pauseBtn { position: fixed; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 8px; border: 2px solid var(--wood-border); background: rgba(30,20,10,.8); color: white; font-size: 18px; z-index: 100; cursor: pointer; display: none; }

  #clockBadge { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: none; gap: 8px; align-items: center; padding: 6px 14px; border-radius: 8px; background: rgba(30,20,10,.7); border: 1px solid var(--wood-border); color: var(--parchment); font-size: 12px; z-index: 5; }
  #hotbar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: none; gap: 4px; z-index: 6; padding: 5px; background: rgba(30,20,10,.75); border: 2px solid var(--wood-border); border-radius: 10px; }
  .hotbar-slot { width: 44px; height: 44px; border-radius: 6px; border: 2px solid var(--wood-light); background: rgba(0,0,0,.4); color: var(--parchment); font-size: 20px; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
  .hotbar-slot.selected { border-color: var(--gold); background: rgba(224,176,96,.3); transform: translateY(-3px); }
  .hotbar-slot .num { position: absolute; top: 1px; left: 3px; font-size: 9px; font-weight: 700; }
  .hotbar-slot .cnt { position: absolute; bottom: 1px; right: 3px; font-size: 10px; font-weight: 700; color: var(--gold-bright); }

  #action { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 20px; border: 2px solid var(--wood-border); background: rgba(30,20,10,.9); color: var(--parchment); font-size: 14px; font-weight: 700; display: none; z-index: 7; cursor: pointer; }
  #jumpBtn, #diveBtn { position: fixed; right: 20px; width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--wood-border); background: rgba(30,20,10,.7); color: var(--parchment); font-size: 24px; display: none; align-items: center; justify-content: center; z-index: 6; }
  #jumpBtn { bottom: 90px; } #diveBtn { bottom: 160px; border-color: #4fc3f7; }
  #stick { position: fixed; left: 20px; bottom: 20px; width: 120px; height: 120px; border-radius: 50%; background: rgba(30,20,10,.35); border: 2px solid var(--wood-border); display: none; z-index: 5; }
  #knob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, var(--parchment), var(--wood-border)); }

  #toast { position: fixed; top: 40%; left: 50%; transform: translate(-50%,-50%); padding: 10px 20px; border-radius: 8px; background: rgba(30,20,10,.92); border: 2px solid var(--gold); color: var(--parchment); font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 20; }
</style>
</head>
<body>

<div id="versionLabel">v1.01</div>

<!-- ГЛАВНОЕ МЕНЮ -->
<div id="mainMenu" class="menu-screen active">
  <h1>CUBE_QUEST</h1>
  <button class="menu-btn" id="btnNewGame">Новая игра</button>
  <button class="menu-btn" id="btnContinue" disabled>Продолжить</button>
</div>

<!-- МЕНЮ ПАУЗЫ -->
<div id="pauseMenu" class="menu-screen">
  <h1 style="font-size: 36px; margin-bottom: 15px;">ПАУЗА</h1>
  <div class="settings-panel">
    <h3>Оптимизация</h3>
    <div class="setting-row">
      <span>Тени (FPS)</span>
      <input type="checkbox" id="setShadows" checked>
    </div>
    <div class="setting-row">
      <span>Туман (Дальность)</span>
      <select id="setFog">
        <option value="0.003">Близко (Быстро)</option>
        <option value="0.0015" selected>Средне</option>
        <option value="0.0008">Далеко (Тяжело)</option>
      </select>
    </div>
  </div>
  <button class="menu-btn" id="btnResume">Продолжить</button>
  <button class="menu-btn" id="btnSave">Сохранить</button>
  <button class="menu-btn" id="btnExit">В главное меню</button>
</div>

<!-- ИНТЕРФЕЙС ИГРЫ -->
<div id="clockBadge">
  <span id="clockIcon">☀️</span>
  <span id="clockTime">06:00</span>
</div>

<button id="pauseBtn">⏸</button>

<div id="menuBtns">
  <button class="icon-btn" id="openInv">🎒</button>
  <button class="icon-btn" id="openCraft">⚒</button>
</div>

<div id="hotbar"></div>
<button id="action">Подобрать</button>
<button id="jumpBtn">↑</button>
<button id="diveBtn">↓</button>
<div id="toast"></div>
<div id="stick"><div id="knob"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ==================== ОПТИМИЗИРОВАННЫЕ НАСТРОЙКИ ==================== */
const WORLD_SIZE = 2000; // Уменьшено с 2520
const TERRAIN_SEG = 100; // Снижено с 200 (экономия полигонов)
const TREE_COUNT = 500;  // Снижено с 1000
const ROCK_COUNT = 300;
const GRASS_COUNT = 2000; // Снижено в 5 раз (было 10к)
const SPEED = 9; const ACCEL = 14;
const WATER_LEVEL = -2.5; const GRAVITY = 25; const JUMP_SPEED = 9;
const DAY_CYCLE = 720; const INV_SLOTS = 24; const HOTBAR_SLOTS = 9;

let gameState = 'menu'; 
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1500);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const clock = new THREE.Clock();

let player = new THREE.Group();
let playerModel = null;
let mixer = null;
let actions = {};
let activeAction = null;

let timeOfDay = 180;
let inventory = new Array(INV_SLOTS).fill(null);
let hotbar = new Array(HOTBAR_SLOTS).fill(null);
let selectedSlot = -1;

const velocity = new THREE.Vector3();
let vy = 0, onGround = true;
let camYaw = 0, camPitch = 0.4, camDist = 8;
let jumpRequested = false;

let sun, hemi;
let worldObjects = []; // Для сбора ресурсов
let currentAction = null;

/* ==================== ИНИЦИАЛИЗАЦИЯ ==================== */
function initEngine() {
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.body.appendChild(renderer.domElement);

  scene.background = new THREE.Color(0xa8c8d8);
  scene.fog = new THREE.FogExp2(0xa8c8d8, 0.0015); // Оптимизированный туман

  hemi = new THREE.HemisphereLight(0xd8ecff, 0x445533, 0.9);
  scene.add(hemi);

  sun = new THREE.DirectionalLight(0xfff2d0, 2.2);
  sun.position.set(40, 60, 30);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024); // Уменьшено с 2048 для FPS
  sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
  sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
  sun.shadow.bias = -0.001;
  scene.add(sun); scene.add(sun.target);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

/* ==================== ГЕНЕРАЦИЯ МИРА ==================== */
function generateWorld() {
  // Земля
  const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, TERRAIN_SEG, TERRAIN_SEG);
  groundGeo.rotateX(-Math.PI / 2);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x74a344, roughness: 0.9 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.receiveShadow = true;
  scene.add(ground);

  // Вода (Оптимизированная, без тяжелых шейдеров)
  const waterGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE);
  waterGeo.rotateX(-Math.PI / 2);
  const waterMat = new THREE.MeshStandardMaterial({ color: 0x2a8ab0, transparent: true, opacity: 0.7 });
  const water = new THREE.Mesh(waterGeo, waterMat);
  water.position.y = WATER_LEVEL;
  scene.add(water);

  // Деревья (InstancedMesh для оптимизации)
  const treeGeo = new THREE.ConeGeometry(1, 3, 5);
  const treeMat = new THREE.MeshStandardMaterial({ color: 0x2d6b3a, flatShading: true });
  const trees = new THREE.InstancedMesh(treeGeo, treeMat, TREE_COUNT);
  trees.castShadow = true;
  const dummy = new THREE.Object3D();
  
  for(let i=0; i<TREE_COUNT; i++) {
    const x = (Math.random()-0.5)*WORLD_SIZE*0.8;
    const z = (Math.random()-0.5)*WORLD_SIZE*0.8;
    dummy.position.set(x, 1.5, z);
    dummy.rotation.set(0, Math.random()*Math.PI, 0);
    dummy.updateMatrix();
    trees.setMatrixAt(i, dummy.matrix);
    worldObjects.push({ type: 'tree', x, z, obj: dummy.clone() }); // Для сбора
  }
  scene.add(trees);

  // Трава (Через InstancedMesh)
  const grassGeo = new THREE.ConeGeometry(0.05, 0.5, 3);
  const grassMat = new THREE.MeshStandardMaterial({ color: 0x5a8a2a, flatShading: true });
  const grass = new THREE.InstancedMesh(grassGeo, grassMat, GRASS_COUNT);
  for(let i=0; i<GRASS_COUNT; i++) {
    dummy.position.set((Math.random()-0.5)*WORLD_SIZE*0.9, 0.25, (Math.random()-0.5)*WORLD_SIZE*0.9);
    dummy.updateMatrix();
    grass.setMatrixAt(i, dummy.matrix);
  }
  scene.add(grass);
}

/* ==================== ИГРОК ==================== */
function loadPlayer() {
  return new Promise((resolve) => {
    const loader = new GLTFLoader();
    loader.load('./Soldier.glb', (gltf) => {
      playerModel = gltf.scene;
      playerModel.traverse(o => { if (o.isMesh) o.castShadow = true; });
      playerModel.scale.set(1.5, 1.5, 1.5);
      player.add(playerModel);
      scene.add(player);

      mixer = new THREE.AnimationMixer(playerModel);
      gltf.animations.forEach(clip => {
        // Используем стандартные названия из Soldier.glb
        if (clip.name.includes('Idle')) actions['Idle'] = mixer.clipAction(clip);
        if (clip.name.includes('Walk')) actions['Walk'] = mixer.clipAction(clip);
        if (clip.name.includes('Run')) actions['Run'] = mixer.clipAction(clip);
        if (clip.name.includes('Jump')) actions['Jump'] = mixer.clipAction(clip);
      });

      if (actions['Idle']) {
        activeAction = actions['Idle'];
        activeAction.play();
      }
      resolve();
    }, undefined, (err) => {
      console.warn("Soldier.glb не найден, используется заглушка");
      const g = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 1, 4, 8), new THREE.MeshStandardMaterial({color: 0x8F6E43}));
      g.position.y = 1; g.castShadow = true;
      playerModel = g; player.add(playerModel); scene.add(player);
      resolve();
    });
  });
}

function fadeToAction(name, duration = 0.2) {
  if (!mixer || !actions[name]) return;
  const next = actions[name];
  if (next === activeAction) return;
  if (activeAction) activeAction.fadeOut(duration);
  next.reset().setEffectiveWeight(1).fadeIn(duration).play();
  activeAction = next;
}

/* ==================== СИСТЕМА СОХРАНЕНИЙ ==================== */
function saveGame() {
  const saveData = {
    pos: player.position.toArray(),
    camYaw: camYaw,
    timeOfDay: timeOfDay,
    inventory: inventory,
    hotbar: hotbar,
    selectedSlot: selectedSlot
  };
  localStorage.setItem('cubeQuest_save', JSON.stringify(saveData));
  toast('Игра сохранена!');
  document.getElementById('btnContinue').disabled = false;
}

function loadGame() {
  const data = JSON.parse(localStorage.getItem('cubeQuest_save'));
  if (!data) return false;

  player.position.fromArray(data.pos);
  camYaw = data.camYaw;
  timeOfDay = data.timeOfDay;
  inventory = data.inventory || new Array(INV_SLOTS).fill(null);
  hotbar = data.hotbar || new Array(HOTBAR_SLOTS).fill(null);
  selectedSlot = data.selectedSlot || -1;
  
  updateHotbarUI();
  return true;
}

/* ==================== ИГРОВАЯ ЛОГИКА ==================== */
function updatePlayer(dt) {
  // Ввод
  let inX = 0, inZ = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) inZ -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) inZ += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) inX -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) inX += 1;
  
  // Джойстик (заглушка, если не трогаем)
  if (joyVec.lengthSq() > 0.1) { inX = joyVec.x; inZ = joyVec.y; }

  const len = Math.hypot(inX, inZ);
  if (len > 1) { inX /= len; inZ /= len; }

  // Движение относительно камеры
  const fwdX = -Math.sin(camYaw); const fwdZ = -Math.cos(camYaw);
  const rightX = Math.cos(camYaw); const rightZ = -Math.sin(camYaw);
  const moveX = fwdX * (-inZ) + rightX * inX;
  const moveZ = fwdZ * (-inZ) + rightZ * inX;

  const t = 1 - Math.exp(-ACCEL * dt);
  velocity.x += (moveX * SPEED - velocity.x) * t;
  velocity.z += (moveZ * SPEED - velocity.z) * t;
  
  player.position.x += velocity.x * dt;
  player.position.z += velocity.z * dt;

  // Прыжок
  if (jumpRequested && onGround) {
    vy = JUMP_SPEED; onGround = false; jumpRequested = false;
  }
  if (!onGround) {
    vy -= GRAVITY * dt;
    player.position.y += vy * dt;
    if (player.position.y <= 0) { player.position.y = 0; vy = 0; onGround = true; }
  }

  // Поворот модели
  const sp = Math.hypot(velocity.x, velocity.z);
  if (sp > 0.5) {
    const targetRot = Math.atan2(velocity.x, velocity.z);
    player.rotation.y += (targetRot - player.rotation.y) * 10 * dt;
  }

  // Анимация
  if (mixer) {
    if (!onGround) fadeToAction('Jump');
    else if (sp > SPEED * 0.7) fadeToAction('Run');
    else if (sp > 0.5) fadeToAction('Walk');
    else fadeToAction('Idle');
    mixer.update(dt);
  }
}

function updateCamera(dt) {
  const offset = new THREE.Vector3(
    Math.sin(camYaw) * Math.cos(camPitch),
    Math.sin(camPitch),
    Math.cos(camYaw) * Math.cos(camPitch)
  ).multiplyScalar(camDist);

  const camDesired = player.position.clone().add(offset);
  camDesired.y += 1.2;
  camera.position.lerp(camDesired, 1 - Math.exp(-10 * dt));
  camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);
}

function updateDayNight(dt) {
  timeOfDay = (timeOfDay + dt) % DAY_CYCLE;
  const progress = timeOfDay / DAY_CYCLE;
  
  const angle = progress * Math.PI * 2 - Math.PI / 2;
  const sunHeight = Math.sin(angle);
  
  sun.position.set(player.position.x + Math.cos(angle) * 80, Math.max(0.1, sunHeight) * 100, player.position.z + 40);
  sun.target.position.copy(player.position);
  sun.intensity = Math.max(0, sunHeight) * 2.5;
  sun.castShadow = sunHeight > 0.1;

  let skyColor = new THREE.Color(0xa8c8d8);
  if (sunHeight <= 0.2 && sunHeight > -0.1) {
    skyColor = new THREE.Color().lerpColors(new THREE.Color(0xff6a3d), new THREE.Color(0xa8c8d8), (sunHeight+0.1)/0.3);
    hemi.intensity = 0.5;
  } else if (sunHeight <= -0.1) {
    skyColor = new THREE.Color(0x0a1020);
    hemi.intensity = 0.15;
  } else {
    hemi.intensity = 0.9;
  }
  
  scene.background = skyColor;
  scene.fog.color = skyColor;

  const hours = Math.floor(progress * 24);
  const mins = Math.floor((progress * 24 * 60) % 60);
  document.getElementById('clockTime').textContent = `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
}

/* ==================== UI ЛОГИКА ==================== */
function updateHotbarUI() {
  const el = document.getElementById('hotbar');
  el.innerHTML = '';
  for (let i = 0; i < HOTBAR_SLOTS; i++) {
    const slot = document.createElement('div');
    slot.className = 'hotbar-slot' + (i === selectedSlot ? ' selected' : '');
    let inner = `<span class="num">${i+1}</span>`;
    if (hotbar[i]) {
      inner += '📦';
      inner += `<span class="cnt">${hotbar[i].count || 1}</span>`;
    }
    slot.innerHTML = inner;
    slot.onclick = () => { selectedSlot = i; updateHotbarUI(); };
    el.appendChild(slot);
  }
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 2000);
}

/* ==================== УПРАВЛЕНИЕ ИГРОЙ ==================== */
function startGame(isNew) {
  if (isNew) {
    localStorage.removeItem('cubeQuest_save');
    player.position.set(0, 5, 0);
    timeOfDay = 180;
    inventory.fill(null); hotbar.fill(null); selectedSlot = -1;
  } else {
    if(!loadGame()) return alert('Сохранение повреждено');
  }
  updateHotbarUI();

  document.getElementById('mainMenu').classList.remove('active');
  document.getElementById('pauseMenu').classList.remove('active');
  document.getElementById('menuBtns').style.display = 'flex';
  document.getElementById('clockBadge').style.display = 'flex';
  document.getElementById('hotbar').style.display = 'flex';
  document.getElementById('jumpBtn').style.display = 'flex';
  document.getElementById('pauseBtn').style.display = 'block';

  gameState = 'playing';
  clock.getDelta(); // Сброс таймера
}

function pauseGame() {
  if (gameState !== 'playing') return;
  gameState = 'paused';
  document.getElementById('pauseMenu').classList.add('active');
}

function exitToMenu() {
  gameState = 'menu';
  document.getElementById('pauseMenu').classList.remove('active');
  document.getElementById('mainMenu').classList.add('active');
  document.getElementById('menuBtns').style.display = 'none';
  document.getElementById('clockBadge').style.display = 'none';
  document.getElementById('hotbar').style.display = 'none';
  document.getElementById('jumpBtn').style.display = 'none';
  document.getElementById('pauseBtn').style.display = 'none';
  document.getElementById('btnContinue').disabled = !localStorage.getItem('cubeQuest_save');
}

/* ==================== ВВОД ДАННЫХ ==================== */
const keys = new Set();
let joyVec = new THREE.Vector2(0, 0);
let camTouchId = null, camTouchStart = { x: 0, y: 0 };

window.addEventListener('keydown', e => {
  keys.add(e.code);
  if (e.code === 'Space' && gameState === 'playing') jumpRequested = true;
  if (e.code === 'Escape' && gameState === 'playing') pauseGame();
});
window.addEventListener('keyup', e => keys.delete(e.code));

// Сенсорное управление (упрощенное)
const stick = document.getElementById('stick');
const knob = document.getElementById('knob');

window.addEventListener('pointerdown', e => {
  if (gameState !== 'playing') return;
  if (e.clientX < window.innerWidth * 0.4) {
    // Левая часть - джойстик
    if (e.target.closest('button')) return;
    stick.style.display = 'block';
    stick.style.left = (e.clientX - 60) + 'px';
    stick.style.top = (e.clientY - 60) + 'px';
    stick.style.bottom = 'auto';
    e.target.setPointerCapture(e.pointerId);
  } else {
    // Правая часть - камера
    if (e.target.closest('button, #hotbar')) return;
    camTouchId = e.pointerId;
    camTouchStart = { x: e.clientX, y: e.clientY };
  }
});

window.addEventListener('pointermove', e => {
  if (e.pointerId === camTouchId) {
    camYaw -= (e.clientX - camTouchStart.x) * 0.005;
    camPitch -= (e.clientY - camTouchStart.y) * 0.005;
    camPitch = Math.max(-1.2, Math.min(1.2, camPitch));
    camTouchStart = { x: e.clientX, y: e.clientY };
  } else if (stick.style.display === 'block') {
    const rect = stick.getBoundingClientRect();
    const dx = e.clientX - (rect.left + 60);
    const dy = e.clientY - (rect.top + 60);
    const len = Math.hypot(dx, dy) || 1;
    const max = 40; const k = len > max ? max / len : 1;
    knob.style.transform = `translate(${dx*k}px, ${dy*k}px)`;
    joyVec.set(dx*k/max, dy*k/max);
  }
});

window.addEventListener('pointerup', e => {
  if (e.pointerId === camTouchId) camTouchId = null;
  stick.style.display = 'none';
  knob.style.transform = 'translate(0,0)';
  joyVec.set(0,0);
});

document.getElementById('jumpBtn').addEventListener('pointerdown', () => jumpRequested = true);
document.getElementById('pauseBtn').addEventListener('click', pauseGame);
document.getElementById('btnNewGame').addEventListener('click', () => startGame(true));
document.getElementById('btnContinue').addEventListener('click', () => startGame(false));
document.getElementById('btnResume').addEventListener('click', () => { gameState='playing'; document.getElementById('pauseMenu').classList.remove('active'); clock.getDelta(); });
document.getElementById('btnSave').addEventListener('click', saveGame);
document.getElementById('btnExit').addEventListener('click', () => { saveGame(); exitToMenu(); });

/* ==================== НАСТРОЙКИ ==================== */
document.getElementById('setShadows').addEventListener('change', (e) => {
  renderer.shadowMap.enabled = e.target.checked;
  scene.traverse((child) => { if (child.isMesh) child.material.needsUpdate = true; });
});
document.getElementById('setFog').addEventListener('change', (e) => {
  scene.fog.density = parseFloat(e.target.value);
});

/* ==================== ЦИКЛ ==================== */
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (gameState === 'playing') {
    updatePlayer(dt);
    updateCamera(dt);
    updateDayNight(dt);
  }
  renderer.render(scene, camera);
}

/* ==================== ЗАПУСК ==================== */
initEngine();
generateWorld();
loadPlayer().then(() => {
  document.getElementById('btnContinue').disabled = !localStorage.getItem('cubeQuest_save');
  animate();
});
</script>
