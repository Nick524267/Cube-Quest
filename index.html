<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Cube_Quest</title>

<style>
  /* Стили Project Zomboid */
  :root {
    --pz-bg: #0a0a0a;
    --pz-panel: rgba(15, 15, 15, 0.95);
    --pz-border: #333;
    --pz-text: #999;
    --pz-text-dark: #555;
    --pz-highlight: #b8c7a1; /* Бледно-зеленый цвет PZ */
    --pz-red: #8b2525;       /* Кроваво-красный */
    --pz-font: Consolas, "Courier New", Courier, monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--pz-bg);
    font-family: var(--pz-font);
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  canvas { display: block; touch-action: none; width: 100vw !important; height: 100vh !important; }

  /* Общие стили меню */
  .menu-screen {
    position: fixed; inset: 0;
    background: var(--pz-panel);
    display: none; flex-direction: column;
    align-items: flex-start; justify-content: center;
    z-index: 1000; padding: 10vw;
    border-left: 2px solid var(--pz-border);
  }
  .menu-screen.active { display: flex; }
  
  .menu-title {
    color: var(--pz-red);
    font-size: clamp(32px, 6vw, 54px);
    font-weight: bold;
    text-transform: uppercase;
    margin: 0 0 10px 0;
    letter-spacing: 2px;
    text-shadow: 2px 2px 0px #000;
  }
  .menu-subtitle {
    color: var(--pz-text);
    font-size: 14px;
    margin-bottom: 40px;
    text-transform: uppercase;
  }

  .menu-btn {
    background: transparent;
    color: var(--pz-text);
    border: none;
    border-bottom: 1px solid transparent;
    font-family: var(--pz-font);
    font-size: 20px;
    font-weight: bold;
    padding: 8px 0;
    margin-bottom: 5px;
    cursor: pointer;
    text-align: left;
    transition: all 0.1s;
    text-transform: uppercase;
  }
  .menu-btn:hover {
    color: var(--pz-highlight);
    border-bottom: 1px solid var(--pz-highlight);
    padding-left: 10px;
  }
  .menu-btn:disabled {
    color: var(--pz-text-dark);
    cursor: not-allowed;
  }
  .menu-btn:disabled:hover {
    color: var(--pz-text-dark);
    border-bottom: 1px solid transparent;
    padding-left: 0;
  }

  /* Версия (теперь только в меню) */
  #versionLabel {
    position: absolute; bottom: 20px; left: 10vw;
    color: var(--pz-text-dark); font-size: 12px;
    font-family: var(--pz-font); pointer-events: none;
  }

  /* Меню паузы */
  #pauseMenu {
    background: rgba(5, 5, 5, 0.9);
    align-items: center;
    padding: 0;
    border-left: none;
  }
  .pause-box {
    background: rgba(15, 15, 15, 0.95);
    border: 1px solid var(--pz-border);
    padding: 40px;
    width: 400px;
    max-width: 90vw;
    display: flex; flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  /* Панель настроек */
  .settings-panel {
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--pz-border);
    padding: 15px;
    margin-bottom: 20px;
    width: 100%;
  }
  .settings-panel h3 {
    color: var(--pz-highlight);
    font-size: 14px;
    margin: 0 0 15px 0;
    text-transform: uppercase;
    border-bottom: 1px solid var(--pz-border);
    padding-bottom: 5px;
  }
  .setting-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; font-size: 14px; color: var(--pz-text);
  }
  .setting-row input[type="checkbox"] { accent-color: var(--pz-highlight); }
  .setting-row select {
    background: var(--pz-bg); color: var(--pz-text);
    border: 1px solid var(--pz-border); font-family: var(--pz-font);
    padding: 2px 5px; outline: none;
  }

  /* Игровой HUD */
  #clockBadge {
    position: fixed; top: 15px; left: 15px;
    display: none; gap: 8px;
    color: var(--pz-text);
    font-size: 14px; font-weight: bold;
    z-index: 5; text-transform: uppercase;
    text-shadow: 1px 1px 0 #000;
  }
  
  #menuBtns { position: fixed; top: 15px; right: 60px; display: none; gap: 5px; z-index: 6; }
  .icon-btn {
    width: 40px; height: 40px;
    background: var(--pz-panel);
    border: 1px solid var(--pz-border);
    color: var(--pz-text); font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { border-color: var(--pz-highlight); color: var(--pz-highlight); }
  
  #pauseBtn {
    position: fixed; top: 15px; right: 15px;
    width: 40px; height: 40px;
    background: var(--pz-panel); border: 1px solid var(--pz-border);
    color: var(--pz-text); font-size: 18px; z-index: 100; cursor: pointer; display: none;
  }
  #pauseBtn:hover { border-color: var(--pz-highlight); }

  #hotbar {
    position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
    display: none; gap: 2px; z-index: 6; padding: 2px;
    background: var(--pz-panel); border: 1px solid var(--pz-border);
  }
  .hotbar-slot {
    width: 44px; height: 44px;
    background: rgba(0,0,0,0.8);
    border: 1px solid var(--pz-border);
    color: var(--pz-text); font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    position: relative; cursor: pointer;
  }
  .hotbar-slot.selected { border-color: var(--pz-highlight); background: rgba(184, 199, 161, 0.1); }
  .hotbar-slot .num { position: absolute; top: 2px; left: 4px; font-size: 10px; color: var(--pz-text-dark); }
  .hotbar-slot .cnt { position: absolute; bottom: 2px; right: 4px; font-size: 12px; font-weight: bold; color: var(--pz-highlight); }

  #action {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    padding: 10px 20px; border: 1px solid var(--pz-border);
    background: var(--pz-panel); color: var(--pz-highlight);
    font-family: var(--pz-font); font-size: 14px; font-weight: bold; text-transform: uppercase;
    display: none; z-index: 7; cursor: pointer;
  }
  #action:hover { border-color: var(--pz-highlight); background: #222; }

  #jumpBtn, #diveBtn {
    position: fixed; right: 20px; width: 60px; height: 60px;
    border-radius: 50%; border: 2px solid var(--pz-border);
    background: rgba(15, 15, 15, 0.8); color: var(--pz-text);
    font-size: 24px; display: none; align-items: center; justify-content: center; z-index: 6;
  }
  #jumpBtn { bottom: 90px; } 
  #diveBtn { bottom: 160px; border-color: #4fc3f7; }

  #stick {
    position: fixed; left: 20px; bottom: 20px; width: 120px; height: 120px;
    border-radius: 50%; background: rgba(15,15,15,0.5); border: 2px solid var(--pz-border);
    display: none; z-index: 5;
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 50px; height: 50px;
    margin: -25px 0 0 -25px; border-radius: 50%;
    background: var(--pz-text-dark);
  }

  #toast {
    position: fixed; top: 20%; left: 50%; transform: translate(-50%,-50%);
    padding: 8px 15px; background: rgba(0,0,0,0.8);
    border: 1px solid var(--pz-border); color: var(--pz-highlight);
    font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 20;
  }
</style>
</head>
<body>

<!-- ГЛАВНОЕ МЕНЮ (Стиль PZ) -->
<div id="mainMenu" class="menu-screen active">
  <h1 class="menu-title">Cube_Quest</h1>
  <div class="menu-subtitle">Выживание в открытом мире</div>
  
  <button class="menu-btn" id="btnNewGame">Новая игра</button>
  <button class="menu-btn" id="btnContinue" disabled>Продолжить</button>
  
  <!-- Версия перенесена сюда -->
  <div id="versionLabel">v1.05</div>
</div>

<!-- МЕНЮ ПАУЗЫ (Стиль PZ) -->
<div id="pauseMenu" class="menu-screen">
  <div class="pause-box">
    <h1 class="menu-title" style="font-size: 32px; margin-bottom: 20px;">Пауза</h1>
    
    <button class="menu-btn" id="btnResume">Продолжить игру</button>

      <h3>Настройки</h3>

      </div>

</div>

<!-- HUD -->
<div id="clockBadge"><span>☀️</span><span id="clockTime">06:00</span></div>
<button id="pauseBtn">⏸</button>
<div id="menuBtns">
  <button class="icon-btn" id="openCraft">⚒</button>
</div>
<div id="hotbar"></div>
<button id="action">Действие</button>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ==================== НАСТРОЙКИ ==================== */
const WORLD_SIZE = 2000;
const TERRAIN_SEG = 120;
const TREE_COUNT = 800;
const ROCK_COUNT = 400;
const BRANCH_COUNT = 300;
const GRASS_COUNT = 5000;
const SPEED = 9; const GRAVITY = 25; const JUMP_SPEED = 9;
const WATER_LEVEL = -1.5; const DAY_CYCLE = 720;
const INV_SLOTS = 20; const HOTBAR_SLOTS = 9;

let gameState = 'menu'; 
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1500);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const clock = new THREE.Clock();

let player = new THREE.Group();
let playerModel = null;
let mixer = null;
let actions = {};
let activeAction = null;

let timeOfDay = 180;
let inventory = new Array(INV_SLOTS).fill(null);
let hotbar = new Array(HOTBAR_SLOTS).fill(null);
let selectedSlot = -1;
let tools = { stoneAxe: false, torch: false };

const velocity = new THREE.Vector3();
let vy = 0, onGround = true;
let camYaw = 0, camPitch = 0.4, camDist = 8;
let jumpRequested = false;

let sun, hemi, waterMaterial;
let interactables = [];
let currentAction = null;

/* ==================== ИНИЦИАЛИЗАЦИЯ ==================== */
function initEngine() {
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  scene.background = new THREE.Color(0xa8c8d8);
  scene.fog = new THREE.FogExp2(0xa8c8d8, 0.002);

  hemi = new THREE.HemisphereLight(0xd8ecff, 0x445533, 0.9);
  scene.add(hemi);

  sun = new THREE.DirectionalLight(0xfff2d0, 2.2);
  sun.position.set(40, 60, 30);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  scene.add(sun); scene.add(sun.target);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

/* ==================== РЕЛЬЕФ И ГЕНЕРАЦИЯ ==================== */
function getTerrainHeight(x, z) {
  const h = Math.sin(x * 0.005) * Math.cos(z * 0.005) * 15 + Math.sin(x * 0.02) * 2;
  return h > -3 ? h : -3;
}

function generateWorld() {
  const dummy = new THREE.Object3D();

  const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, TERRAIN_SEG, TERRAIN_SEG);
  groundGeo.rotateX(-Math.PI / 2);
  const pos = groundGeo.attributes.position;
  const colors = [];
  const cGrass = new THREE.Color(0x74a344);
  const cSand = new THREE.Color(0xe0c890);

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const h = getTerrainHeight(x, z);
    pos.setY(i, h);
    if (h < WATER_LEVEL + 1) colors.push(cSand.r, cSand.g, cSand.b);
    else colors.push(cGrass.r, cGrass.g, cGrass.b);
  }
  groundGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  groundGeo.computeVertexNormals();
  
  const groundMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.receiveShadow = true;
  scene.add(ground);

  const waterGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, 64, 64);
  waterGeo.rotateX(-Math.PI / 2);
  waterMaterial = new THREE.MeshStandardMaterial({ color: 0x2a8ab0, transparent: true, opacity: 0.8, roughness: 0.1, metalness: 0.5 });

  waterMaterial.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = { value: 0 };
    shader.vertexShader = `uniform float uTime;\n` + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      `
      vec3 transformed = vec3(position);
      float wave = sin(position.x * 0.1 + uTime * 1.5) * 0.3 + cos(position.z * 0.15 + uTime) * 0.2;
      transformed.y += wave; 
      `
    );
    waterMaterial.userData.shader = shader;
  };

  const water = new THREE.Mesh(waterGeo, waterMaterial);
  water.position.y = WATER_LEVEL;
  scene.add(water);

  // Деревья
  const trunkGeo = new THREE.CylinderGeometry(0.2, 0.3, 2, 6);
  const leafGeo = new THREE.ConeGeometry(1.5, 3, 6);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3a1e, flatShading: true });
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d6b3a, flatShading: true });
  
  const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, TREE_COUNT);
  const leaves = new THREE.InstancedMesh(leafGeo, leafMat, TREE_COUNT);
  trunks.castShadow = true; leaves.castShadow = true;

  for (let i = 0; i < TREE_COUNT; i++) {
    const x = (Math.random() - 0.5) * WORLD_SIZE * 0.9;
    const z = (Math.random() - 0.5) * WORLD_SIZE * 0.9;
    const h = getTerrainHeight(x, z);
    if (h < WATER_LEVEL + 1) continue;

    dummy.position.set(x, h + 1, z);
    dummy.rotation.set(0, Math.random() * Math.PI, 0);
    dummy.updateMatrix();
    trunks.setMatrixAt(i, dummy.matrix);

    dummy.position.set(x, h + 3, z);
    dummy.updateMatrix();
    leaves.setMatrixAt(i, dummy.matrix);

    interactables.push({ type: 'tree', mesh: leaves, idx: i, pos: new THREE.Vector3(x, h, z), hp: 3, active: true });
  }
  scene.add(trunks, leaves);

  // Камни и Ветки
  const rockGeo = new THREE.DodecahedronGeometry(0.5);
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x888888, flatShading: true });
  const rocks = new THREE.InstancedMesh(rockGeo, rockMat, ROCK_COUNT);

  for (let i = 0; i < ROCK_COUNT; i++) {
    const x = (Math.random() - 0.5) * WORLD_SIZE * 0.9;
    const z = (Math.random() - 0.5) * WORLD_SIZE * 0.9;
    const h = getTerrainHeight(x, z);
    if (h < WATER_LEVEL) continue;
    dummy.position.set(x, h + 0.3, z);
    dummy.rotation.set(Math.random(), Math.random(), Math.random());
    dummy.updateMatrix();
    rocks.setMatrixAt(i, dummy.matrix);
    interactables.push({ type: 'rock', mesh: rocks, idx: i, pos: new THREE.Vector3(x, h, z), active: true });
  }
  scene.add(rocks);

  const branchGeo = new THREE.CylinderGeometry(0.05, 0.05, 1);
  const branchMat = new THREE.MeshStandardMaterial({ color: 0x4a2e15 });
  const branches = new THREE.InstancedMesh(branchGeo, branchMat, BRANCH_COUNT);

  for (let i = 0; i < BRANCH_COUNT; i++) {
    const x = (Math.random() - 0.5) * WORLD_SIZE * 0.9;
    const z = (Math.random() - 0.5) * WORLD_SIZE * 0.9;
    const h = getTerrainHeight(x, z);
    if (h < WATER_LEVEL) continue;
    dummy.position.set(x, h + 0.05, z);
    dummy.rotation.set(Math.PI / 2, Math.random() * Math.PI, 0);
    dummy.updateMatrix();
    branches.setMatrixAt(i, dummy.matrix);
    interactables.push({ type: 'branch', mesh: branches, idx: i, pos: new THREE.Vector3(x, h, z), active: true });
  }
  scene.add(branches);

  // Трава
  const grassGeo = new THREE.ConeGeometry(0.05, 0.4, 3);
  const grassMat = new THREE.MeshStandardMaterial({ color: 0x5a8a2a, flatShading: true });
  const grass = new THREE.InstancedMesh(grassGeo, grassMat, GRASS_COUNT);
  for (let i = 0; i < GRASS_COUNT; i++) {
    const x = (Math.random() - 0.5) * WORLD_SIZE * 0.9;
    const z = (Math.random() - 0.5) * WORLD_SIZE * 0.9;
    const h = getTerrainHeight(x, z);
    if (h < WATER_LEVEL + 0.5) continue;
    dummy.position.set(x, h + 0.2, z);
    dummy.rotation.set(0, Math.random() * Math.PI, 0);
    dummy.updateMatrix();
    grass.setMatrixAt(i, dummy.matrix);
  }
  scene.add(grass);
}

/* ==================== ИГРОК ==================== */
function loadPlayer() {
  return new Promise((resolve) => {
    const loader = new GLTFLoader();
    loader.load('./Soldier.glb', (gltf) => {
      playerModel = gltf.scene;
      playerModel.traverse(o => { if (o.isMesh) o.castShadow = true; });
      playerModel.scale.set(1.2, 1.2, 1.2);
      player.add(playerModel);
      scene.add(player);

      mixer = new THREE.AnimationMixer(playerModel);
      gltf.animations.forEach(clip => {
        if (clip.name.includes('Idle')) actions['Idle'] = mixer.clipAction(clip);
        if (clip.name.includes('Walk')) actions['Walk'] = mixer.clipAction(clip);
        if (clip.name.includes('Run')) actions['Run'] = mixer.clipAction(clip);
        if (clip.name.includes('Jump')) actions['Jump'] = mixer.clipAction(clip);
      });
      if (actions['Idle']) { activeAction = actions['Idle']; activeAction.play(); }
      resolve();
    }, undefined, () => {
      const g = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 1, 4, 8), new THREE.MeshStandardMaterial({color: 0x8F6E43}));
      g.position.y = 1; g.castShadow = true;
      playerModel = g; player.add(playerModel); scene.add(player);
      resolve();
    });
  });
}

function fadeToAction(name, duration = 0.2) {
  if (!mixer || !actions[name]) return;
  const next = actions[name];
  if (next === activeAction) return;
  if (activeAction) activeAction.fadeOut(duration);
  next.reset().setEffectiveWeight(1).fadeIn(duration).play();
  activeAction = next;
}

/* ==================== СОХРАНЕНИЯ ==================== */
function saveGame() {
  const data = { pos: player.position.toArray(), camYaw, timeOfDay, inventory, hotbar, selectedSlot, tools };
  localStorage.setItem('cubeQuest_save_v5', JSON.stringify(data));
  toast('Игра сохранена');
  document.getElementById('btnContinue').disabled = false;
}

function loadGame() {
  const data = JSON.parse(localStorage.getItem('cubeQuest_save_v5'));
  if (!data) return false;
  player.position.fromArray(data.pos);
  camYaw = data.camYaw; timeOfDay = data.timeOfDay;
  inventory = data.inventory; hotbar = data.hotbar; selectedSlot = data.selectedSlot; tools = data.tools;
  updateHotbarUI();
  return true;
}

/* ==================== ЛОГИКА ==================== */
function updatePlayer(dt) {
  let inX = 0, inZ = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) inZ -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) inZ += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) inX -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) inX += 1;
  if (joyVec.lengthSq() > 0.1) { inX = joyVec.x; inZ = joyVec.y; }

  const len = Math.hypot(inX, inZ);
  if (len > 1) { inX /= len; inZ /= len; }

  const fwdX = -Math.sin(camYaw); const fwdZ = -Math.cos(camYaw);
  const rightX = Math.cos(camYaw); const rightZ = -Math.sin(camYaw);
  const moveX = fwdX * (-inZ) + rightX * inX;
  const moveZ = fwdZ * (-inZ) + rightZ * inX;

  const t = 1 - Math.exp(-14 * dt);
  velocity.x += (moveX * SPEED - velocity.x) * t;
  velocity.z += (moveZ * SPEED - velocity.z) * t;
  player.position.x += velocity.x * dt;
  player.position.z += velocity.z * dt;

  const half = WORLD_SIZE / 2 - 10;
  player.position.x = Math.max(-half, Math.min(half, player.position.x));
  player.position.z = Math.max(-half, Math.min(half, player.position.z));

  const groundH = getTerrainHeight(player.position.x, player.position.z);
  if (jumpRequested && onGround) { vy = JUMP_SPEED; onGround = false; jumpRequested = false; }
  if (!onGround) {
    vy -= GRAVITY * dt;
    player.position.y += vy * dt;
    if (player.position.y <= groundH) { player.position.y = groundH; vy = 0; onGround = true; }
  } else {
    player.position.y = groundH;
  }

  const sp = Math.hypot(velocity.x, velocity.z);
  if (sp > 0.5) {
    const targetRot = Math.atan2(velocity.x, velocity.z);
    player.rotation.y += (targetRot - player.rotation.y) * 10 * dt;
  }

  if (mixer) {
    if (!onGround) fadeToAction('Jump');
    else if (sp > SPEED * 0.7) fadeToAction('Run');
    else if (sp > 0.5) fadeToAction('Walk');
    else fadeToAction('Idle');
    mixer.update(dt);
  }
}

function updateCamera(dt) {
  const offset = new THREE.Vector3(
    Math.sin(camYaw) * Math.cos(camPitch),
    Math.sin(camPitch),
    Math.cos(camYaw) * Math.cos(camPitch)
  ).multiplyScalar(camDist);
  const camDesired = player.position.clone().add(offset);
  camDesired.y += 1.2;
  camera.position.lerp(camDesired, 1 - Math.exp(-10 * dt));
  camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);
}

function updateDayNight(dt, elapsed) {
  timeOfDay = (timeOfDay + dt) % DAY_CYCLE;
  const progress = timeOfDay / DAY_CYCLE;
  const angle = progress * Math.PI * 2 - Math.PI / 2;
  const sunHeight = Math.sin(angle);
  
  sun.position.set(player.position.x + Math.cos(angle) * 80, Math.max(0.1, sunHeight) * 100, player.position.z + 40);
  sun.target.position.copy(player.position);
  sun.intensity = Math.max(0, sunHeight) * 2.5;
  sun.castShadow = sunHeight > 0.1;

  let skyColor = new THREE.Color(0xa8c8d8);
  if (sunHeight <= 0.2 && sunHeight > -0.1) {
    skyColor = new THREE.Color().lerpColors(new THREE.Color(0xff6a3d), new THREE.Color(0xa8c8d8), (sunHeight+0.1)/0.3);
    hemi.intensity = 0.5;
  } else if (sunHeight <= -0.1) {
    skyColor = new THREE.Color(0x0a1020);
    hemi.intensity = 0.15;
  } else hemi.intensity = 0.9;
  
  scene.background = skyColor;
  scene.fog.color = skyColor;

  const hours = Math.floor(progress * 24);
  const mins = Math.floor((progress * 24 * 60) % 60);
  document.getElementById('clockTime').textContent = `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;

  if (waterMaterial && waterMaterial.userData.shader) {
    waterMaterial.userData.shader.uniforms.uTime.value = elapsed;
  }
}

function checkInteractables() {
  let closest = null; let minDist = 3.0;
  for (let i = 0; i < interactables.length; i++) {
    const obj = interactables[i];
    if (!obj.active) continue;
    const dist = player.position.distanceTo(obj.pos);
    if (dist < minDist) { minDist = dist; closest = obj; }
  }

  const actionBtn = document.getElementById('action');
  if (closest) {
    currentAction = closest;
    if (closest.type === 'tree') {
      actionBtn.textContent = tools.stoneAxe ? 'Рубить дерево' : 'Нужен топор';
      actionBtn.style.display = 'block';
    } else {
      actionBtn.textContent = 'Подобрать';
      actionBtn.style.display = 'block';
    }
  } else {
    currentAction = null;
    actionBtn.style.display = 'none';
  }
}

function doAction() {
  if (!currentAction) return;
  const obj = currentAction;

  if (obj.type === 'branch' || obj.type === 'rock') {
    if (obj.type === 'branch') { addItem('wood', 1); toast('+ Дерево'); }
    else { addItem('stone', 2); toast('+ Камень'); }
    obj.active = false;
    obj.mesh.setMatrixAt(obj.idx, new THREE.Matrix4().makeScale(0,0,0));
    obj.mesh.instanceMatrix.needsUpdate = true;
  } else if (obj.type === 'tree') {
    if (!tools.stoneAxe) return toast('Нужен топор');
    obj.hp -= 1;
    if (obj.hp <= 0) {
      addItem('wood', 3); toast('+ 3 Дерева');
      obj.active = false;
      obj.mesh.setMatrixAt(obj.idx, new THREE.Matrix4().makeScale(0,0,0));
      obj.mesh.instanceMatrix.needsUpdate = true;
    } else { toast('Удар! Осталось: ' + obj.hp); }
  }
  checkInteractables();
}

/* ==================== ИНВЕНТАРЬ ==================== */
const ICONS = { wood: '🪵', stone: '🪨', axe: '🪓' };

function addItem(type, count) {
  for (let i = 0; i < HOTBAR_SLOTS; i++) {
    if (hotbar[i] && hotbar[i].type === type) { hotbar[i].count += count; updateHotbarUI(); return; }
  }
  for (let i = 0; i < HOTBAR_SLOTS; i++) {
    if (!hotbar[i]) { hotbar[i] = { type, count }; updateHotbarUI(); return; }
  }
}

function getItemsCount(type) {
  let c = 0;
  hotbar.forEach(s => { if(s && s.type===type) c+=s.count; });
  return c;
}

function removeItem(type, count) {
  for (let i = 0; i < hotbar.length; i++) {
    if (hotbar[i] && hotbar[i].type === type) {
      const take = Math.min(count, hotbar[i].count);
      hotbar[i].count -= take; if (hotbar[i].count <= 0) hotbar[i] = null; count -= take;
      if (count <= 0) break;
    }
  }
  updateHotbarUI();
}

function craftAxe() {
  if (tools.stoneAxe) return toast('Уже есть');
  if (getItemsCount('wood') >= 2 && getItemsCount('stone') >= 2) {
    removeItem('wood', 2); removeItem('stone', 2);
    tools.stoneAxe = true; toast('Топор создан!'); updateHotbarUI();
  } else toast('Нужно 2 дерева и 2 камня');
}

function updateHotbarUI() {
  const el = document.getElementById('hotbar');
  el.innerHTML = '';
  for (let i = 0; i < HOTBAR_SLOTS; i++) {
    const slot = document.createElement('div');
    slot.className = 'hotbar-slot' + (i === selectedSlot ? ' selected' : '');
    let inner = `<span class="num">${i+1}</span>`;
    if (hotbar[i]) {
      inner += ICONS[hotbar[i].type] || '📦';
      inner += `<span class="cnt">${hotbar[i].count}</span>`;
    }
    slot.innerHTML = inner;
    el.appendChild(slot);
  }
}

/* ==================== УПРАВЛЕНИЕ И ПОЛНЫЙ ЭКРАН ==================== */
function startGame(isNew) {
  if (isNew) {
    localStorage.removeItem('cubeQuest_save_v5');
    player.position.set(0, getTerrainHeight(0,0), 0);
    timeOfDay = 180; inventory.fill(null); hotbar.fill(null); selectedSlot = -1;
    tools = { stoneAxe: false, torch: false };
  } else {
    if(!loadGame()) return alert('Сохранение не найдено');
  }
  updateHotbarUI();
  
  // === ЗАПРОС ПОЛНОЭКРАННОГО РЕЖИМА ===
  // Браузеры разрешают это только после клика пользователя
  try {
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen();
    } else if (document.documentElement.webkitRequestFullscreen) {
      document.documentElement.webkitRequestFullscreen();
    }
    
    // Пытаемся заблокировать ландшафтную ориентацию
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(e => console.log("Orientation lock failed", e));
    }
  } catch (err) {
    console.log("Fullscreen error:", err);
  }

  document.getElementById('mainMenu').classList.remove('active');
  document.getElementById('pauseMenu').classList.remove('active');
  document.getElementById('menuBtns').style.display = 'flex';
  document.getElementById('clockBadge').style.display = 'flex';
  document.getElementById('hotbar').style.display = 'flex';
  document.getElementById('jumpBtn').style.display = 'flex';
  document.getElementById('pauseBtn').style.display = 'block';
  
  gameState = 'playing'; 
  clock.getDelta();
}

function pauseGame() {
  if (gameState !== 'playing') return;
  gameState = 'paused';
  document.getElementById('pauseMenu').classList.add('active');
}

function exitToMenu() {
  gameState = 'menu';
  document.getElementById('pauseMenu').classList.remove('active');
  document.getElementById('mainMenu').classList.add('active');
  document.getElementById('menuBtns').style.display = 'none';
  document.getElementById('clockBadge').style.display = 'none';
  document.getElementById('hotbar').style.display = 'none';
  document.getElementById('jumpBtn').style.display = 'none';
  document.getElementById('pauseBtn').style.display = 'none';
  document.getElementById('action').style.display = 'none';
  document.getElementById('btnContinue').disabled = !localStorage.getItem('cubeQuest_save_v5');
}

const keys = new Set();
let joyVec = new THREE.Vector2(0, 0);
let camTouchId = null, camTouchStart = { x: 0, y: 0 };

window.addEventListener('keydown', e => {
  keys.add(e.code);
  if (e.code === 'Space' && gameState === 'playing') jumpRequested = true;
  if (e.code === 'KeyE' && gameState === 'playing') doAction();
  if (e.code === 'Escape' && gameState === 'playing') pauseGame();
});
window.addEventListener('keyup', e => keys.delete(e.code));

const stick = document.getElementById('stick');
const knob = document.getElementById('knob');

window.addEventListener('pointerdown', e => {
  if (gameState !== 'playing') return;
  if (e.clientX < window.innerWidth * 0.4) {
    if (e.target.closest('button')) return;
    stick.style.display = 'block';
    stick.style.left = (e.clientX - 60) + 'px';
    stick.style.top = (e.clientY - 60) + 'px';
  } else {
    if (e.target.closest('button, #hotbar')) return;
    camTouchId = e.pointerId;
    camTouchStart = { x: e.clientX, y: e.clientY };
  }
});

window.addEventListener('pointermove', e => {
  if (e.pointerId === camTouchId) {
    camYaw -= (e.clientX - camTouchStart.x) * 0.005;
    camPitch -= (e.clientY - camTouchStart.y) * 0.005;
    camPitch = Math.max(-1.2, Math.min(1.2, camPitch));
    camTouchStart = { x: e.clientX, y: e.clientY };
  } else if (stick.style.display === 'block') {
    const rect = stick.getBoundingClientRect();
    const dx = e.clientX - (rect.left + 60);
    const dy = e.clientY - (rect.top + 60);
    const len = Math.hypot(dx, dy) || 1;
    const max = 40; const k = len > max ? max / len : 1;
    knob.style.transform = `translate(${dx*k}px, ${dy*k}px)`;
    joyVec.set(dx*k/max, dy*k/max);
  }
});

window.addEventListener('pointerup', e => {
  if (e.pointerId === camTouchId) camTouchId = null;
  stick.style.display = 'none';
  knob.style.transform = 'translate(0,0)';
  joyVec.set(0,0);
});

document.getElementById('jumpBtn').addEventListener('pointerdown', () => jumpRequested = true);
document.getElementById('action').addEventListener('click', doAction);
document.getElementById('pauseBtn').addEventListener('click', pauseGame);
document.getElementById('btnNewGame').addEventListener('click', () => startGame(true));
document.getElementById('btnContinue').addEventListener('click', () => startGame(false));
document.getElementById('btnResume').addEventListener('click', () => { gameState='playing'; document.getElementById('pauseMenu').classList.remove('active'); clock.getDelta(); });
document.getElementById('btnSave').addEventListener('click', saveGame);
document.getElementById('btnExit').addEventListener('click', () => { saveGame(); exitToMenu(); });
document.getElementById('openCraft').addEventListener('click', craftAxe);

document.getElementById('setShadows').addEventListener('change', (e) => {
  renderer.shadowMap.enabled = e.target.checked;
  scene.traverse((child) => { if (child.isMesh) child.material.needsUpdate = true; });
});
document.getElementById('setFog').addEventListener('change', (e) => {
  scene.fog.density = parseFloat(e.target.value);
});

/* ==================== ЦИКЛ ==================== */
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.getElapsedTime();

  if (gameState === 'playing') {
    updatePlayer(dt);
    updateCamera(dt);
    updateDayNight(dt, elapsed);
    checkInteractables();
  }
  renderer.render(scene, camera);
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 2000);
}

/* ==================== ЗАПУСК ==================== */
initEngine();
generateWorld();
loadPlayer().then(() => {
  document.getElementById('btnContinue').disabled = !localStorage.getItem('cubeQuest_save_v5');
  animate();
});
</script>
