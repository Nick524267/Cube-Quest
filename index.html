<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Valheim-like — Открытый мир</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; }
  canvas { display: block; touch-action: none; }

  #hint {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    font-family: system-ui, sans-serif; font-size: 12px;
    color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.7);
    pointer-events: none; transition: opacity 1.2s ease; z-index: 5;
    background: rgba(0,0,0,.35); padding: 6px 12px; border-radius: 8px;
    max-width: 90vw; text-align: center;
  }

  #inventory {
    position: fixed; bottom: 16px; right: 16px;
    background: rgba(10,16,24,.72);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px; padding: 8px;
    backdrop-filter: blur(6px); z-index: 5;
    font-family: system-ui, sans-serif;
  }
  #invTitle {
    font-size: 11px; color: rgba(255,255,255,.75);
    margin-bottom: 6px; letter-spacing: .5px; text-align: center;
  }
  .inv-grid {
    display: grid;
    grid-template-columns: repeat(6, 40px);
    gap: 4px;
  }
  .inv-slot {
    width: 40px; height: 40px;
    background: rgba(0,0,0,.4);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    font-size: 22px;
    transition: background .2s ease;
  }
  .inv-slot .count {
    position: absolute;
    bottom: 2px; right: 3px;
    font-size: 10px; font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 2px #000;
  }

  #topright {
    position: fixed; top: 12px; right: 12px;
    display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
    font-family: system-ui, sans-serif; color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,.55); pointer-events: auto; z-index: 5;
  }
  #topright label.small { font-size: 11px; opacity: .8; }
  #zoom {
    -webkit-appearance: none; appearance: none;
    width: 130px; height: 6px; border-radius: 3px;
    background: rgba(255,255,255,.25); outline: none;
  }
  #zoom::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: #d9b45b; box-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  #zoom::-moz-range-thumb {
    width: 18px; height: 18px; border: 0; border-radius: 50%;
    background: #d9b45b;
  }

  #craft {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 6; pointer-events: auto;
    font-family: system-ui, sans-serif;
  }
  .craft-btn {
    padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25);
    background: rgba(10, 16, 24, .72); color: #fff; font-size: 12px; font-weight: 600;
    backdrop-filter: blur(6px); cursor: pointer; text-align: left; line-height: 1.35;
    transition: transform .15s ease, background .15s ease;
  }
  .craft-btn:active { transform: scale(.96); }
  .craft-btn.enough { border-color: #d9b45b; box-shadow: 0 0 12px rgba(217,180,91,.35); }
  .craft-btn small { display: block; font-weight: 400; opacity: .75; font-size: 10px; }

  #action {
    position: fixed; bottom: 200px; left: 50%; transform: translateX(-50%);
    padding: 12px 20px; border-radius: 999px; border: 1px solid rgba(255,255,255,.3);
    background: rgba(10,16,24,.78); color: #fff; font-family: system-ui, sans-serif;
    font-size: 14px; font-weight: 600; display: none; z-index: 7;
    backdrop-filter: blur(6px); cursor: pointer;
  }

  #jumpBtn {
    position: fixed; right: 22px; bottom: 110px;
    width: 70px; height: 70px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35);
    background: rgba(10,16,24,.55); color: #fff;
    font-size: 28px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; cursor: pointer; z-index: 6;
    user-select: none; -webkit-user-select: none;
    transition: background .15s ease, transform .1s ease;
  }
  #jumpBtn:active { background: rgba(217,180,91,.55); transform: scale(.94); }

  #diveBtn {
    position: fixed; right: 22px; bottom: 195px;
    width: 70px; height: 70px; border-radius: 50%;
    border: 2px solid rgba(79,195,247,.55);
    background: rgba(10,30,50,.6); color: #fff;
    font-size: 28px; font-weight: 700;
    display: none; align-items: center; justify-content: center;
    touch-action: none; cursor: pointer; z-index: 6;
    user-select: none; -webkit-user-select: none;
  }
  #diveBtn:active { background: rgba(79,195,247,.55); }

  #oxygen {
    position: fixed; bottom: 200px; left: 50%; transform: translateX(-50%);
    width: 200px; height: 14px;
    background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 7px; overflow: hidden;
    display: none; z-index: 8;
  }
  .oxy-fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #4fc3f7, #29b6f6);
    transition: width .08s linear, background .3s ease;
  }

  #stick {
    position: fixed; left: 24px; bottom: 24px; width: 130px; height: 130px;
    border-radius: 50%; background: rgba(255,255,255,.10);
    border: 2px solid rgba(255,255,255,.28);
    display: none; touch-action: none; z-index: 5;
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px;
    margin: -28px 0 0 -28px; border-radius: 50%;
    background: rgba(255,255,255,.8);
    box-shadow: 0 4px 16px rgba(0,0,0,.35);
  }

  #toast {
    position: fixed; top: 45%; left: 50%; transform: translate(-50%,-50%);
    padding: 10px 18px; border-radius: 10px; background: rgba(10,16,24,.85);
    color: #fff; font-family: system-ui, sans-serif; font-size: 14px;
    opacity: 0; transition: opacity .3s ease; pointer-events: none; z-index: 20;
  }
</style>
</head>
<body>

<div id="hint">WASD / джойстик — движение · Space / ↑ — прыжок · Shift / ↓ — нырять · E — действие</div>

<div id="topright">
  <label class="small">Обзор</label>
  <input type="range" id="zoom" min="8" max="30" step="0.5" value="16" />
</div>

<div id="oxygen"><div class="oxy-fill" id="oxyFill"></div></div>

<div id="inventory">
  <div id="invTitle">Инвентарь</div>
  <div class="inv-grid" id="invGrid"></div>
</div>

<div id="craft">
  <button class="craft-btn" id="craftStone">
    Каменный топор
    <small>5 дерева · 4 камня</small>
  </button>
  <button class="craft-btn" id="craftFlint">
    Кремневый топор
    <small>4 дерева · 6 кремня</small>
  </button>
</div>

<button id="action">Подобрать</button>
<button id="jumpBtn">↑</button>
<button id="diveBtn">↓</button>
<div id="toast"></div>
<div id="stick"><div id="knob"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ==================== НАСТРОЙКИ ==================== */
const WORLD_SIZE     = 420;
const TERRAIN_SEG    = 160;
const FOREST_COUNT   = 220;
const ROCK_COUNT     = 70;
const FLINT_COUNT    = 55;
const BRANCH_COUNT   = 90;
const SEAWEED_COUNT  = 80;
const PLAYER_RADIUS  = 0.35;
const SPEED          = 7.5;
const ACCEL          = 14;
const CAM_MIN        = 8;
const CAM_MAX        = 30;
const WATER_LEVEL    = -1.2;
const GRAVITY        = 25;
const JUMP_SPEED     = 9;
const SWIM_SPEED_MUL = 0.55;
const DIVE_SPEED     = 4.5;
const OXYGEN_MAX     = 100;
const OXYGEN_DRAIN   = 9;
const OXYGEN_REFILL  = 35;

/* ==================== РЕНДЕР ==================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa8c8d8);
scene.fog = new THREE.Fog(0xa8c8d8, 70, 240);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 600);
camera.position.set(0, 10, 15);

/* ==================== СВЕТ ==================== */
scene.add(new THREE.HemisphereLight(0xd8ecff, 0x445533, 0.9));

const sun = new THREE.DirectionalLight(0xfff2d0, 2.2);
sun.position.set(40, 60, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -60; sc.right = 60; sc.top = 60; sc.bottom = -60; sc.near = 1; sc.far = 220;
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.03;
scene.add(sun);
scene.add(sun.target);

/* ==================== ШУМ ==================== */
function hash(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function smooth(t) { return t * t * (3 - 2 * t); }
function valueNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const a = hash(xi, yi), b = hash(xi + 1, yi);
  const c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  const u = smooth(xf), v = smooth(yf);
  return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
}
function fbm(x, y) {
  let v = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < 4; i++) {
    v += amp * valueNoise(x * freq, y * freq);
    freq *= 2; amp *= 0.5;
  }
  return v;
}

/* ==================== РЕЛЬЕФ ==================== */
function terrainHeight(x, z) {
  const hills = (fbm(x * 0.008 + 10, z * 0.008 + 10) - 0.42) * 24;
  const amp = 0.35 + 0.65 * fbm(x * 0.0035 + 50, z * 0.0035 + 50);
  let h = hills * amp;
  h += (fbm(x * 0.06, z * 0.06) - 0.5) * 1.4;

  const r1center = Math.sin(x * 0.016) * 30 + Math.cos(x * 0.005) * 20;
  const r1dist = Math.abs(z - r1center);
  const r1 = Math.max(0, 1 - r1dist / 11);

  const r2center = Math.sin(z * 0.014) * 28 + Math.cos(z * 0.006) * 18;
  const r2dist = Math.abs(x - r2center);
  const r2 = Math.max(0, 1 - r2dist / 10);

  const riverMask = Math.max(r1, r2);
  if (riverMask > 0) {
    const k = riverMask * riverMask;
    h = h * (1 - k * 0.95) - k * 6.5;
  }

  return h;
}

/* ==================== ТЕКСТУРА NOISE ==================== */
function makeNoiseTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#c8c8c8';
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 5000; i++) {
    const g = 140 + Math.random() * 90;
    ctx.fillStyle = `rgb(${g},${g},${g})`;
    ctx.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 3, 1 + Math.random() * 3);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(60, 60);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ==================== ЗЕМЛЯ ==================== */
const terrainGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, TERRAIN_SEG, TERRAIN_SEG);
terrainGeo.rotateX(-Math.PI / 2);

const pos = terrainGeo.attributes.position;
const colors = [];
const cGrass  = new THREE.Color(0x74a344);
const cGrass2 = new THREE.Color(0x94c25c);
const cRock   = new THREE.Color(0x8a8a7e);
const cSand   = new THREE.Color(0xd0bc84);
const cSeabed = new THREE.Color(0x5a6a7a);

for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i);
  const z = pos.getZ(i);
  const h = terrainHeight(x, z);
  pos.setY(i, h);

  let c;
  if (h < WATER_LEVEL - 0.6) c = cSeabed;
  else if (h < WATER_LEVEL + 0.6) c = cSand;
  else if (h > 9) c = cRock;
  else {
    const t = Math.min(1, Math.max(0, (h + 2) / 11));
    c = cGrass.clone().lerp(cGrass2, t * 0.7 + Math.random() * 0.3);
  }
  colors.push(c.r, c.g, c.b);
}

terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
terrainGeo.computeVertexNormals();

const terrainMat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  map: makeNoiseTexture(),
  roughness: 0.95,
  metalness: 0.0,
  flatShading: true
});
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
terrain.receiveShadow = true;
scene.add(terrain);

/* ==================== ВОДА ==================== */
const waterGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE);
waterGeo.rotateX(-Math.PI / 2);
const waterMat = new THREE.MeshStandardMaterial({
  color: 0x2a6a8a,
  transparent: true,
  opacity: 0.6,
  roughness: 0.15,
  metalness: 0.6,
  side: THREE.DoubleSide
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.position.y = WATER_LEVEL;
water.receiveShadow = true;
scene.add(water);

/* ==================== ХИТБОКСЫ ==================== */
const obstacles = [];
function addCyl(x, z, radius) { obstacles.push({ type: 'cyl', x, z, radius }); }

/* ==================== ДЕРЕВЬЯ ==================== */
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2b, roughness: 1, flatShading: true });
const leafMat  = new THREE.MeshStandardMaterial({ color: 0x2d6b3a, roughness: 0.9, flatShading: true });
const leafMat2 = new THREE.MeshStandardMaterial({ color: 0x3f8a4a, roughness: 0.9, flatShading: true });

const trunkGeo = new THREE.CylinderGeometry(0.18, 0.28, 1.6, 6);
const leaf1Geo = new THREE.ConeGeometry(1.3, 2.2, 7);
const leaf2Geo = new THREE.ConeGeometry(0.95, 1.7, 7);

const trunkInst = new THREE.InstancedMesh(trunkGeo, trunkMat, FOREST_COUNT);
trunkInst.castShadow = true; trunkInst.receiveShadow = true;
const leaf1Inst = new THREE.InstancedMesh(leaf1Geo, leafMat, FOREST_COUNT);
leaf1Inst.castShadow = true;
const leaf2Inst = new THREE.InstancedMesh(leaf2Geo, leafMat2, FOREST_COUNT);
leaf2Inst.castShadow = true;

const treeData = [];
const dummy = new THREE.Object3D();

for (let i = 0; i < FOREST_COUNT; i++) {
  let x = 0, z = 0, h = 1, ok = false, attempts = 0;
  while (!ok && attempts < 80) {
    attempts++;
    x = (Math.random() - 0.5) * (WORLD_SIZE - 20);
    z = (Math.random() - 0.5) * (WORLD_SIZE - 20);
    h = terrainHeight(x, z);
    if (h > WATER_LEVEL + 0.8 && h < 12) ok = true;
  }
  const s = 0.8 + Math.random() * 0.9;
  const rotY = Math.random() * Math.PI * 2;

  dummy.position.set(x, h + 0.8 * s, z);
  dummy.rotation.set(0, rotY, 0);
  dummy.scale.set(s, s, s);
  dummy.updateMatrix();
  trunkInst.setMatrixAt(i, dummy.matrix);

  dummy.position.set(x, h + 2.1 * s, z);
  dummy.updateMatrix();
  leaf1Inst.setMatrixAt(i, dummy.matrix);

  dummy.position.set(x, h + 3.2 * s, z);
  dummy.updateMatrix();
  leaf2Inst.setMatrixAt(i, dummy.matrix);

  treeData.push({ x, z, hp: 10, maxHp: 10, alive: true, scale: s, idx: i });
  addCyl(x, z, 0.4 * s);
}
trunkInst.instanceMatrix.needsUpdate = true;
leaf1Inst.instanceMatrix.needsUpdate = true;
leaf2Inst.instanceMatrix.needsUpdate = true;
scene.add(trunkInst, leaf1Inst, leaf2Inst);

/* ==================== КАМНИ ==================== */
const rockGeo = new THREE.IcosahedronGeometry(0.32, 0);
const rockMat = new THREE.MeshStandardMaterial({ color: 0x8a8a80, roughness: 0.95, flatShading: true });
const rockInst = new THREE.InstancedMesh(rockGeo, rockMat, ROCK_COUNT);
rockInst.castShadow = true; rockInst.receiveShadow = true;

const rockData = [];
for (let i = 0; i < ROCK_COUNT; i++) {
  let x = 0, z = 0, h = 1, ok = false, attempts = 0;
  while (!ok && attempts < 60) {
    attempts++;
    x = (Math.random() - 0.5) * (WORLD_SIZE - 30);
    z = (Math.random() - 0.5) * (WORLD_SIZE - 30);
    h = terrainHeight(x, z);
    if (h > WATER_LEVEL + 0.6) ok = true;
  }
  const s = 0.8 + Math.random() * 0.7;
  dummy.position.set(x, h + 0.2 * s, z);
  dummy.rotation.set(Math.random(), Math.random(), Math.random());
  dummy.scale.set(s, s * 0.8, s);
  dummy.updateMatrix();
  rockInst.setMatrixAt(i, dummy.matrix);
  rockData.push({ x, z, y: h, alive: true, idx: i, scale: s });
}
rockInst.instanceMatrix.needsUpdate = true;
scene.add(rockInst);

/* ==================== КРЕМЕНЬ ==================== */
const flintGeo = new THREE.IcosahedronGeometry(0.22, 0);
const flintMat = new THREE.MeshStandardMaterial({
  color: 0xe8e8dc, roughness: 0.4, metalness: 0.15, flatShading: true,
  emissive: 0x333322, emissiveIntensity: 0.15
});
const flintInst = new THREE.InstancedMesh(flintGeo, flintMat, FLINT_COUNT);
flintInst.castShadow = true;

const flintData = [];
for (let i = 0; i < FLINT_COUNT; i++) {
  let x = 0, z = 0, h = 0, ok = false, attempts = 0;
  while (!ok && attempts < 120) {
    attempts++;
    x = (Math.random() - 0.5) * (WORLD_SIZE - 30);
    z = (Math.random() - 0.5) * (WORLD_SIZE - 30);
    h = terrainHeight(x, z);
    if (h > WATER_LEVEL - 0.5 && h < WATER_LEVEL + 1.8) ok = true;
  }
  const s = 0.9 + Math.random() * 0.5;
  dummy.position.set(x, Math.max(h, WATER_LEVEL) + 0.12, z);
  dummy.rotation.set(Math.random(), Math.random(), Math.random());
  dummy.scale.set(s, s * 0.6, s * 1.4);
  dummy.updateMatrix();
  flintInst.setMatrixAt(i, dummy.matrix);
  flintData.push({ x, z, y: Math.max(h, WATER_LEVEL), alive: true, idx: i, scale: s });
}
flintInst.instanceMatrix.needsUpdate = true;
scene.add(flintInst);

/* ==================== ВЕТКИ ==================== */
const branchGeo = new THREE.CylinderGeometry(0.05, 0.07, 0.7, 5);
const branchMat = new THREE.MeshStandardMaterial({ color: 0x5a3a1e, roughness: 1, flatShading: true });
const branchInst = new THREE.InstancedMesh(branchGeo, branchMat, BRANCH_COUNT);
branchInst.castShadow = true;

const branchData = [];
for (let i = 0; i < BRANCH_COUNT; i++) {
  let x = 0, z = 0, h = 1, ok = false, attempts = 0;
  while (!ok && attempts < 60) {
    attempts++;
    x = (Math.random() - 0.5) * (WORLD_SIZE - 30);
    z = (Math.random() - 0.5) * (WORLD_SIZE - 30);
    h = terrainHeight(x, z);
    if (h > WATER_LEVEL + 0.6) ok = true;
  }
  dummy.position.set(x, h + 0.08, z);
  dummy.rotation.set(Math.PI / 2, Math.random() * Math.PI * 2, 0);
  dummy.scale.set(1, 1, 1);
  dummy.updateMatrix();
  branchInst.setMatrixAt(i, dummy.matrix);
  branchData.push({ x, z, y: h, alive: true, idx: i });
}
branchInst.instanceMatrix.needsUpdate = true;
scene.add(branchInst);

/* ==================== ВОДОРОСЛИ ==================== */
const seaweedGeo = new THREE.ConeGeometry(0.12, 1.2, 4);
const seaweedMat = new THREE.MeshStandardMaterial({ color: 0x2a7a4a, roughness: 0.9, flatShading: true });
const seaweedInst = new THREE.InstancedMesh(seaweedGeo, seaweedMat, SEAWEED_COUNT);

for (let i = 0; i < SEAWEED_COUNT; i++) {
  let x = 0, z = 0, h = 0, ok = false, attempts = 0;
  while (!ok && attempts < 200) {
    attempts++;
    x = (Math.random() - 0.5) * (WORLD_SIZE - 40);
    z = (Math.random() - 0.5) * (WORLD_SIZE - 40);
    h = terrainHeight(x, z);
    if (h < WATER_LEVEL - 0.5 && h > WATER_LEVEL - 6) ok = true;
  }
  const s = 0.7 + Math.random() * 0.7;
  dummy.position.set(x, h + 0.6 * s, z);
  dummy.rotation.set(0, Math.random() * Math.PI * 2, 0);
  dummy.scale.set(s, s, s);
  dummy.updateMatrix();
  seaweedInst.setMatrixAt(i, dummy.matrix);
}
seaweedInst.instanceMatrix.needsUpdate = true;
scene.add(seaweedInst);

/* ==================== ПЕРСОНАЖ ==================== */
const player = new THREE.Group();
scene.add(player);

const bodyRoot = new THREE.Group();
player.add(bodyRoot);

const skinMat  = new THREE.MeshStandardMaterial({ color: 0xe8b98b, roughness: 0.7, flatShading: true });
const hairMat  = new THREE.MeshStandardMaterial({ color: 0x2b1a10, roughness: 0.95, flatShading: true });
const shirtMat = new THREE.MeshStandardMaterial({ color: 0x5a7a8a, roughness: 0.8, flatShading: true });
const pantsMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.9, flatShading: true });
const shoeMat  = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8, flatShading: true });

const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.23, 0.5, 4, 8), shirtMat);
torso.position.y = 1.15; torso.castShadow = true; bodyRoot.add(torso);

const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.1, 6), skinMat);
neck.position.y = 1.55; bodyRoot.add(neck);

const headGroup = new THREE.Group();
headGroup.position.y = 1.72; bodyRoot.add(headGroup);

const head = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 10), skinMat);
head.castShadow = true; headGroup.add(head);

const hair = new THREE.Mesh(
  new THREE.SphereGeometry(0.18, 12, 8, 0, Math.PI * 2, 0, Math.PI * 0.55),
  hairMat
);
hair.position.y = 0.02; headGroup.add(hair);

for (const sx of [-1, 1]) {
  const eye = new THREE.Mesh(
    new THREE.SphereGeometry(0.025, 6, 6),
    new THREE.MeshStandardMaterial({ color: 0x111111 })
  );
  eye.position.set(0.06 * sx, 0.02, 0.15);
  headGroup.add(eye);

function makeArm(side) {
  const g = new THREE.Group();
  g.position.set(0.27 * side, 1.42, 0);
  const upper = new THREE.Mesh(new THREE.CapsuleGeometry(0.065, 0.3, 3, 6), shirtMat);
  upper.position.y = -0.2; upper.castShadow = true; g.add(upper);
  const fore = new THREE.Mesh(new THREE.CapsuleGeometry(0.055, 0.28, 3, 6), skinMat);
  fore.position.y = -0.55; fore.castShadow = true; g.add(fore);
  const hand = new THREE.Mesh(new THREE.SphereGeometry(0.075, 6, 6), skinMat);
  hand.position.y = -0.75; hand.castShadow = true; g.add(hand);
  bodyRoot.add(g);
  return g;
}
const armL = makeArm(-1);
const armR = makeArm(1);

function makeLeg(side) {
  const g = new THREE.Group();
  g.position.set(0.11 * side, 0.85, 0);
  const thigh = new THREE.Mesh(new THREE.CapsuleGeometry(0.085, 0.32, 3, 6), pantsMat);
  thigh.position.y = -0.22; thigh.castShadow = true; g.add(thigh);
  const shin = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.32, 3, 6), pantsMat);
  shin.position.y = -0.62; shin.castShadow = true; g.add(shin);
  const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.09, 0.24), shoeMat);
  shoe.position.set(0, -0.84, 0.03); shoe.castShadow = true; g.add(shoe);
  bodyRoot.add(g);
  return g;
}
const legL = makeLeg(-1);
const legR = makeLeg(1);

/* ==================== ИНВЕНТАРЬ ==================== */
const inv = { wood: 0, stone: 0, flint: 0, stoneAxe: false, flintAxe: false };
const INV_SLOTS = 18;

const invGrid = document.getElementById('invGrid');
const invSlots = [];
for (let i = 0; i < INV_SLOTS; i++) {
  const s = document.createElement('div');
  s.className = 'inv-slot';
  invGrid.appendChild(s);
  invSlots.push(s);
}

function renderInventory() {
  const items = [];
  if (inv.wood > 0)     items.push({ icon: '🪵', count: inv.wood,  bg: 'rgba(90,58,30,.55)' });
  if (inv.stone > 0)    items.push({ icon: '🪨', count: inv.stone, bg: 'rgba(90,90,80,.55)' });
  if (inv.flint > 0)    items.push({ icon: '⚪', count: inv.flint, bg: 'rgba(200,200,180,.35)' });
  if (inv.stoneAxe)     items.push({ icon: '🪓', count: 1,         bg: 'rgba(122,90,58,.7)' });
  if (inv.flintAxe)     items.push({ icon: '🪓', count: 1,         bg: 'rgba(180,180,180,.6)' });

  for (let i = 0; i < INV_SLOTS; i++) {
    const slot = invSlots[i];
    if (items[i]) {
      slot.innerHTML = items[i].icon + (items[i].count > 1 ? `<span class="count">${items[i].count}</span>` : '');
      slot.style.background = items[i].bg;
    } else {
      slot.innerHTML = '';
      slot.style.background = 'rgba(0,0,0,.4)';
    }
  }
}
renderInventory();

/* ==================== КРАФТ ==================== */
const craftStoneBtn = document.getElementById('craftStone');
const craftFlintBtn = document.getElementById('craftFlint');

function updateCraftButtons() {
  craftStoneBtn.classList.toggle('enough', inv.wood >= 5 && inv.stone >= 4 && !inv.stoneAxe);
  craftFlintBtn.classList.toggle('enough', inv.wood >= 4 && inv.flint >= 6 && !inv.flintAxe);
}
updateCraftButtons();

craftStoneBtn.addEventListener('click', () => {
  if (inv.stoneAxe) return toast('Каменный топор уже есть');

  toast('Каменный топор создан!');
  beep(520);
});

craftFlintBtn.addEventListener('click', () => {
  if (inv.flintAxe) return toast('Кремневый топор уже есть');
  if (inv.wood < 4 || inv.flint < 6) return toast('Нужно 4 дерева и 6 кремня');
  inv.wood -= 4; inv.flint -= 6; inv.flintAxe = true;
  renderInventory(); updateCraftButtons();
  toast('Кремневый топор создан!');
  beep(680);
});

/* ==================== ДЕЙСТВИЕ (ИСПРАВЛЕНО) ==================== */
const actionBtn = document.getElementById('action');
let currentAction = null;

// принимает объект best { kind, target, label }
function setAction(best) {
  currentAction = best || null;
  if (currentAction) {
    actionBtn.style.display = 'block';
    actionBtn.textContent = currentAction.label;
  } else {
    actionBtn.style.display = 'none';
  }
}
actionBtn.addEventListener('click', () => { if (currentAction) doAction(); });

/* ==================== TOAST ==================== */
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.style.opacity = '0'; }, 1600);
}

/* ==================== ЗВУК ==================== */
let actx = null;
function beep(freq = 600) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(freq, actx.currentTime);
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.12, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.18);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 0.2);
  } catch (e) {}
}

/* ==================== УПРАВЛЕНИЕ ==================== */
const keys = new Set();
let jumpRequested = false;
let touchDive = false;

addEventListener('keydown', (e) => {
  keys.add(e.code);
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyE' && currentAction) doAction();
  if (e.code === 'Space') jumpRequested = true;
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => { keys.clear(); touchDive = false; });

const jumpBtn = document.getElementById('jumpBtn');
jumpBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); jumpRequested = true; });

const diveBtn = document.getElementById('diveBtn');
diveBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); touchDive = true; });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => {
  diveBtn.addEventListener(ev, () => { touchDive = false; });
});

/* джойстик */
const stick = document.getElementById('stick');
const knob = document.getElementById('knob');
let joyId = null, joyOrigin = { x: 0, y: 0 }, joyVec = { x: 0, y: 0 };

addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' || joyId !== null) return;
  if (e.clientX > innerWidth * 0.5) return;
  if (e.target.closest('#topright, #craft, #action, #jumpBtn, #diveBtn, #inventory')) return;
  joyId = e.pointerId;
  joyOrigin = { x: e.clientX, y: e.clientY };
  stick.style.display = 'block';
  stick.style.left = (e.clientX - 65) + 'px';
  stick.style.top  = (e.clientY - 65) + 'px';
  stick.style.bottom = 'auto';
  knob.style.transform = 'translate(0,0)';
});
addEventListener('pointermove', (e) => {
  if (e.pointerId !== joyId) return;
  const dx = e.clientX - joyOrigin.x;
  const dy = e.clientY - joyOrigin.y;
  const max = 55;
  const len = Math.hypot(dx, dy) || 1;
  const k = len > max ? max / len : 1;
  const kx = dx * k, ky = dy * k;
  knob.style.transform = `translate(${kx}px, ${ky}px)`;
  joyVec.x = kx / max; joyVec.y = ky / max;
});
function endJoy(e) {
  if (e.pointerId !== joyId) return;
  joyId = null; joyVec.x = joyVec.y = 0;
  stick.style.display = 'none';
  knob.style.transform = 'translate(0,0)';
}
addEventListener('pointerup', endJoy);
addEventListener('pointercancel', endJoy);

/* ==================== КАМЕРА ==================== */
let camDistance = 16;
const zoomEl = document.getElementById('zoom');
zoomEl.value = String(camDistance);
zoomEl.addEventListener('input', (e) => {
  const v = parseFloat(e.target.value);
  if (!isNaN(v)) camDistance = Math.max(CAM_MIN, Math.min(CAM_MAX, v));
});

const camDesired = new THREE.Vector3();
const lookAt = new THREE.Vector3();
const tmpV = new THREE.Vector3();

function updateCamera(dt) {
  const height = camDistance * 0.55;
  const back   = camDistance * 0.85;
  camDesired.set(player.position.x, player.position.y + height, player.position.z + back);
  const t = 1 - Math.exp(-5 * dt);
  camera.position.lerp(camDesired, t);
  tmpV.set(player.position.x, player.position.y + 1.2, player.position.z);
  lookAt.lerp(tmpV, Math.min(1, t * 1.8));
  camera.lookAt(lookAt);
}

/* ==================== ФИЗИКА / ПЛАВАНИЕ ==================== */
const velocity = new THREE.Vector3();
let vy = 0;
let onGround = false;
let walkPhase = 0;
let idlePhase = 0;
let currentSpeed01 = 0;
let oxygen = OXYGEN_MAX;
let isSwimming = false;
let isUnderwater = false;

function dampAngle(cur, target, lambda, dt) {
  let diff = (target - cur) % (Math.PI * 2);
  if (diff > Math.PI) diff -= Math.PI * 2;
  if (diff < -Math.PI) diff += Math.PI * 2;
  return cur + diff * (1 - Math.exp(-lambda * dt));
}

function getInput() {
  let x = 0, z = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp'))    z -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown'))  z += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft'))  x -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) x += 1;
  x += joyVec.x; z += joyVec.y;
  const len = Math.hypot(x, z);
  if (len > 1) { x /= len; z /= len; }
  return { x, z };
}

function resolveObstacles() {
  for (const o of obstacles) {
    const dx = player.position.x - o.x;
    const dz = player.position.z - o.z;
    const d = Math.hypot(dx, dz);
    const min = o.radius + PLAYER_RADIUS;
    if (d < min && d > 0.0001) {
      const k = min / d;
      player.position.x = o.x + dx * k;
      player.position.z = o.z + dz * k;
    }
  }
}

function updatePlayer(dt) {
  const inp = getInput();
  const t = 1 - Math.exp(-ACCEL * dt);

  const groundY = terrainHeight(player.position.x, player.position.z);
  const waterSurface = WATER_LEVEL - 0.3; // где плавает тело
  isSwimming = player.position.y < WATER_LEVEL - 0.2;
  isUnderwater = player.position.y < WATER_LEVEL - 0.5;

  const speedMul = isSwimming ? SWIM_SPEED_MUL : 1.0;

  velocity.x += (inp.x * SPEED * speedMul - velocity.x) * t;
  velocity.z += (inp.z * SPEED * speedMul - velocity.z) * t;

  player.position.x += velocity.x * dt;
  player.position.z += velocity.z * dt;

  resolveObstacles();

  const half = WORLD_SIZE / 2 - 5;
  player.position.x = Math.max(-half, Math.min(half, player.position.x));
  player.position.z = Math.max(-half, Math.min(half, player.position.z));

  const floorY = groundY + 0.3; // ниже нельзя (дно/земля)

  if (isSwimming) {
    const holdingDive = touchDive || keys.has('ShiftLeft') || keys.has('ShiftRight');

    if (oxygen <= 0) {
      // принудительное всплытие
      vy += (waterSurface - player.position.y) * 8 * dt;
      vy = Math.min(vy, 5);
    } else if (holdingDive) {
      vy -= DIVE_SPEED * 4 * dt;
      vy = Math.max(vy, -DIVE_SPEED);
    } else {
      // плавучесть тянет к поверхности
      const depth = waterSurface - player.position.y;
      vy += depth * 6 * dt;
      vy = Math.min(vy, 3.5);
    }

    if (jumpRequested) {
      vy = Math.max(vy, JUMP_SPEED * 0.6);
    }

    player.position.y += vy * dt;

    if (player.position.y < floorY) {
      player.position.y = floorY;
      vy = Math.max(vy, 0);
    }

    if (player.position.y > waterSurface && vy <= 0.5) {
      player.position.y = waterSurface;
      vy = Math.max(vy, -0.5);
    }

    onGround = (player.position.y <= floorY + 0.05);
    if (onGround) vy = Math.max(vy, 0);
  } else {
    // на земле — обычная физика
    if (onGround) {
      player.position.y = groundY;
      if (jumpRequested) {
        vy = JUMP_SPEED;
        onGround = false;
      }
    } else {
      vy -= GRAVITY * dt;
      player.position.y += vy * dt;
      if (player.position.y <= groundY) {
        player.position.y = groundY;
        vy = 0;
        onGround = true;
      }
    }
  }
  jumpRequested = false;

  // кислород
  if (isUnderwater) {
    oxygen -= OXYGEN_DRAIN * dt;
    if (oxygen < 0) oxygen = 0;
  } else {
    oxygen += OXYGEN_REFILL * dt;
    if (oxygen > OXYGEN_MAX) oxygen = OXYGEN_MAX;
  }

  const sp = Math.hypot(velocity.x, velocity.z);
  currentSpeed01 = onGround ? Math.min(1, sp / SPEED) : 0;

  if (sp > 0.4) {
    player.rotation.y = dampAngle(player.rotation.y, Math.atan2(velocity.x, velocity.z), 12, dt);
  }

  // UI кнопки ныряния
  diveBtn.style.display = isSwimming ? 'flex' : 'none';
}

/* ==================== АНИМАЦИЯ ==================== */
function updatePlayerAnim(dt) {
  const s = currentSpeed01;
  walkPhase += dt * (4 + s * 9) * s;
  idlePhase += dt * 2;

  const swing = Math.sin(walkPhase) * 0.7 * s;
  const swingOpp = Math.sin(walkPhase + Math.PI) * 0.7 * s;

  legL.rotation.x = swing;
  legR.rotation.x = swingOpp;
  armL.rotation.x = swingOpp * 0.8;
  armR.rotation.x = swing * 0.8;

  if (isSwimming) {
    // плавательная анимация — руки гребут горизонтально
    const t = performance.now() / 1000;
    armL.rotation.z = -1.2 + Math.sin(t * 4) * 0.4;
    armR.rotation.z =  1.2 - Math.sin(t * 4) * 0.4;
    armL.rotation.x = Math.sin(t * 4) * 0.3;
    armR.rotation.x = -Math.sin(t * 4) * 0.3;
    legL.rotation.x = Math.sin(t * 4) * 0.3;
    legR.rotation.x = -Math.sin(t * 4) * 0.3;
  } else {
    armL.rotation.z = -0.06;
    armR.rotation.z =  0.06;
  }

  bodyRoot.rotation.z = Math.sin(walkPhase) * 0.05 * s;
  bodyRoot.rotation.x = s * 0.07;
  headGroup.rotation.z = Math.sin(walkPhase) * 0.05 * s;

  const bob = Math.abs(Math.sin(walkPhase)) * 0.05 * s;
  const breathe = s < 0.1 && onGround ? Math.sin(idlePhase) * 0.01 : 0;
  bodyRoot.position.y = bob + breathe;
}

/* ==================== ПОИСК ДЕЙСТВИЯ ==================== */
function findNearestAction() {
  const px = player.position.x;
  const pz = player.position.z;
  let best = null, bestDist = Infinity;

  for (const r of rockData) {
    if (!r.alive) continue;
    const d = Math.hypot(px - r.x, pz - r.z);
    if (d < 2.0 && d < bestDist) { bestDist = d; best = { kind: 'rock', target: r, label: 'Подобрать камень' }; }
  }
  for (const f of flintData) {
    if (!f.alive) continue;
    const d = Math.hypot(px - f.x, pz - f.z);
    if (d < 2.0 && d < bestDist) { bestDist = d; best = { kind: 'flint', target: f, label: 'Подобрать кремень' }; }
  }
  for (const b of branchData) {
    if (!b.alive) continue;
    const d = Math.hypot(px - b.x, pz - b.z);
    if (d < 2.0 && d < bestDist) { bestDist = d; best = { kind: 'branch', target: b, label: 'Подобрать ветку' }; }
  }
  const hasAxe = inv.stoneAxe || inv.flintAxe;
  for (const tt of treeData) {
    if (!tt.alive) continue;
    const d = Math.hypot(px - tt.x, pz - tt.z);
    if (d < 2.4 && d < bestDist) {
      bestDist = d;
      best = { kind: hasAxe ? 'tree' : 'tree-noaxe', target: tt, label: hasAxe ? 'Рубить дерево' : 'Нужен топор' };
    }
  }

  setAction(best);
}

/* ==================== ПОДБОР / РУБКА ==================== */
function hideInstance(inst, idx) {
  dummy.position.set(0, -9999, 0);
  dummy.rotation.set(0, 0, 0);
  dummy.scale.set(0, 0, 0);
  dummy.updateMatrix();
  inst.setMatrixAt(idx, dummy.matrix);
  inst.instanceMatrix.needsUpdate = true;
}

function doAction() {
  if (!currentAction) return;
  const { kind, target } = currentAction;

  if (kind === 'rock') {
    target.alive = false;
    hideInstance(rockInst, target.idx);
    inv.stone += 2 + Math.floor(Math.random() * 2);
    renderInventory(); updateCraftButtons();
    toast('+ камень');
    beep(420);
  } else if (kind === 'flint') {
    target.alive = false;
    hideInstance(flintInst, target.idx);
    inv.flint += 2 + Math.floor(Math.random() * 2);
    renderInventory(); updateCraftButtons();
    toast('+ кремень');
    beep(560);
  } else if (kind === 'branch') {
    target.alive = false;
    hideInstance(branchInst, target.idx);
    inv.wood += 1 + Math.floor(Math.random() * 2);
    renderInventory(); updateCraftButtons();
    toast('+ дерево');
    beep(480);
  } else if (kind === 'tree' || kind === 'tree-noaxe') {
    if (kind === 'tree-noaxe') { toast('Сначала сделай топор'); return; }
    const dmg = inv.flintAxe ? 6 : 4;
    target.hp -= dmg;
    beep(inv.flintAxe ? 300 : 240);
    if (target.hp <= 0) {
      target.alive = false;
      hideInstance(trunkInst, target.idx);
      hideInstance(leaf1Inst, target.idx);
      hideInstance(leaf2Inst, target.idx);
      const amount = 3 + Math.floor(Math.random() * 3);
      inv.wood += amount;
      renderInventory(); updateCraftButtons();
      toast(`Дерево срублено (+${amount})`);
    } else {
      toast(inv.flintAxe ? 'Быстрый удар' : 'Медленный удар');
    }
  }

  setAction(null);
}

/* ==================== КИСЛОРОД (UI) ==================== */
const oxyEl = document.getElementById('oxygen');
const oxyFill = document.getElementById('oxyFill');

function updateOxygenUI() {
  const show = isUnderwater || oxygen < OXYGEN_MAX;
  oxyEl.style.display = show ? 'block' : 'none';
  if (!show) return;
  const pct = (oxygen / OXYGEN_MAX) * 100;
  oxyFill.style.width = pct + '%';
  if (oxygen < 30) {
    oxyFill.style.background = '#f44336';
  } else {
    oxyFill.style.background = 'linear-gradient(90deg, #4fc3f7, #29b6f6)';
  }
}

/* ==================== ПОСТОБРАБОТКА ==================== */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.6, 0.9));
composer.addPass(new OutputPass());

/* ==================== RESIZE ==================== */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

/* ==================== ПОДСКАЗКА ==================== */
const hintEl = document.getElementById('hint');
setTimeout(() => { hintEl.style.opacity = '0'; }, 6000);

/* ==================== АТМОСФЕРА ==================== */
const FOG_AIR_COLOR = new THREE.Color(0xa8c8d8);
const FOG_WATER_COLOR = new THREE.Color(0x1a4a6a);
const BG_AIR = new THREE.Color(0xa8c8d8);
const BG_WATER = new THREE.Color(0x1a4a6a);

function updateAtmosphere() {
  if (isUnderwater) {
    scene.fog.color.copy(FOG_WATER_COLOR);
    scene.fog.near = 3;
    scene.fog.far = 32;
    scene.background.copy(BG_WATER);
    waterMat.opacity = 0.15;
  } else {
    scene.fog.color.copy(FOG_AIR_COLOR);
    scene.fog.near = 70;
    scene.fog.far = 240;
    scene.background.copy(BG_AIR);
    waterMat.opacity = 0.6;
  }
}

/* ==================== ЦИКЛ ==================== */
const SUN_OFFSET = new THREE.Vector3(35, 55, 25);
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  updatePlayer(dt);
  updatePlayerAnim(dt);
  updateCamera(dt);
  findNearestAction();
  updateAtmosphere();
  updateOxygenUI();

  sun.position.copy(player.position).add(SUN_OFFSET);
  sun.target.position.copy(player.position);

  composer.render();
}

renderInventory();
updateCraftButtons();
animate();
</script>
