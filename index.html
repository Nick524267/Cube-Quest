<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Valheim-like — Открытый мир</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; }
  canvas { display: block; touch-action: none; }

  #hint {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    font-family: system-ui, sans-serif; font-size: 12px;
    color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.7);
    pointer-events: none; transition: opacity 1.2s ease; z-index: 5;
    background: rgba(0,0,0,.35); padding: 6px 12px; border-radius: 8px;
    max-width: 80vw; text-align: center;
  }

  #menuBtns {
    position: fixed; top: 12px; left: 12px;
    display: flex; gap: 8px; z-index: 6;
  }
  .icon-btn {
    width: 48px; height: 48px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(10,16,24,.72);
    color: #fff; font-size: 22px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { background: rgba(217,180,91,.55); }

  #topright {
    position: fixed; top: 12px; right: 12px;
    display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
    font-family: system-ui, sans-serif; color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,.55); pointer-events: auto; z-index: 5;
  }
  #topright label.small { font-size: 11px; opacity: .8; }
  #zoom {
    -webkit-appearance: none; appearance: none;
    width: 130px; height: 6px; border-radius: 3px;
    background: rgba(255,255,255,.25); outline: none;
  }
  #zoom::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: #d9b45b; box-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  #zoom::-moz-range-thumb {
    width: 18px; height: 18px; border: 0; border-radius: 50%; background: #d9b45b;
  }

  #action {
    position: fixed; bottom: 200px; left: 50%; transform: translateX(-50%);
    padding: 12px 20px; border-radius: 999px; border: 1px solid rgba(255,255,255,.3);
    background: rgba(10,16,24,.85); color: #fff; font-family: system-ui, sans-serif;
    font-size: 14px; font-weight: 600; display: none; z-index: 7;
    backdrop-filter: blur(6px); cursor: pointer;
  }

  #jumpBtn, #diveBtn {
    position: fixed; right: 22px;
    width: 70px; height: 70px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35);
    background: rgba(10,16,24,.55); color: #fff;
    font-size: 28px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; cursor: pointer; z-index: 6;
    user-select: none; -webkit-user-select: none;
  }
  #jumpBtn { bottom: 110px; }
  #jumpBtn:active { background: rgba(217,180,91,.55); transform: scale(.94); }
  #diveBtn { bottom: 195px; display: none; border-color: rgba(79,195,247,.55); background: rgba(10,30,50,.6); }
  #diveBtn:active { background: rgba(79,195,247,.55); }

  #oxygen {
    position: fixed; bottom: 200px; left: 50%; transform: translateX(-50%);
    width: 220px; height: 16px;
    background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 8px; overflow: hidden;
    display: none; z-index: 8;
  }
  .oxy-fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #4fc3f7, #29b6f6);
    transition: width .08s linear, background .3s ease;
  }

  #stick {
    position: fixed; left: 24px; bottom: 24px; width: 130px; height: 130px;
    border-radius: 50%; background: rgba(255,255,255,.10);
    border: 2px solid rgba(255,255,255,.28);
    display: none; touch-action: none; z-index: 5;
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px;
    margin: -28px 0 0 -28px; border-radius: 50%;
    background: rgba(255,255,255,.8);
    box-shadow: 0 4px 16px rgba(0,0,0,.35);
  }

  #toast {
    position: fixed; top: 45%; left: 50%; transform: translate(-50%,-50%);
    padding: 10px 18px; border-radius: 10px; background: rgba(10,16,24,.85);
    color: #fff; font-family: system-ui, sans-serif; font-size: 14px;
    opacity: 0; transition: opacity .3s ease; pointer-events: none; z-index: 20;
  }

  /* Модальные окна */
  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(4px);
  }
  .modal.open { display: flex; }
  .modal-content {
    background: rgba(15,20,30,.96);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 14px;
    padding: 20px 18px 18px;
    min-width: 280px; max-width: 92vw;
    max-height: 85vh; overflow-y: auto;
    color: #fff; font-family: system-ui, sans-serif;
    position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.7);
  }
  .modal-content h2 {
    margin: 0 0 14px; font-size: 18px; letter-spacing: .5px;
    color: #d9b45b;
  }
  .modal-close {
    position: absolute; top: 8px; right: 10px;
    width: 34px; height: 34px;
    border: 0; border-radius: 8px;
    background: rgba(255,255,255,.1); color: #fff;
    font-size: 22px; cursor: pointer; line-height: 1;
  }
  .modal-close:active { background: rgba(255,255,255,.3); }

  .inv-grid {
    display: grid;
    grid-template-columns: repeat(6, 46px);
    gap: 6px;
  }
  .inv-slot {
    width: 46px; height: 46px;
    background: rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    position: relative; font-size: 24px;
  }
  .inv-slot .count {
    position: absolute; bottom: 2px; right: 4px;
    font-size: 11px; font-weight: 700; color: #fff;
    text-shadow: 0 1px 3px #000;
  }

  .craft-list { display: flex; flex-direction: column; gap: 8px; }
  .craft-item {
    padding: 12px 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.05); color: #fff;
    cursor: pointer; text-align: left; font-family: inherit; font-size: 13px;
    transition: all .15s ease;
  }
  .craft-item:active { transform: scale(.97); }
  .craft-item.enough {
    border-color: #d9b45b;
    background: rgba(217,180,91,.15);
    box-shadow: 0 0 14px rgba(217,180,91,.3);
  }
  .craft-item.done {
    border-color: #4caf50;
    background: rgba(76,175,80,.15);
    opacity: .75;
    cursor: default;
  }
  .craft-item small { display: block; font-weight: 400; opacity: .7; font-size: 11px; margin-top: 3px; }
</style>
</head>
<body>

<div id="hint">WASD / джойстик — идти · Space / ↑ — прыжок · Shift / ↓ — нырять · E — действие</div>

<div id="menuBtns">
  <button class="icon-btn" id="openInv" title="Инвентарь">🎒</button>
  <button class="icon-btn" id="openCraft" title="Крафт">⚒</button>
</div>

<div id="topright">
  <label class="small">Обзор</label>
  <input type="range" id="zoom" min="8" max="30" step="0.5" value="16" />
</div>

<div id="oxygen"><div class="oxy-fill" id="oxyFill"></div></div>

<div class="modal" id="invModal">
  <div class="modal-content">
    <button class="modal-close" data-close>×</button>
    <h2>Инвентарь</h2>
    <div class="inv-grid" id="invGrid"></div>
  </div>
</div>

<div class="modal" id="craftModal">
  <div class="modal-content">
    <button class="modal-close" data-close>×</button>
    <h2>Крафт</h2>
    <div class="craft-list" id="craftList"></div>
  </div>
</div>

<button id="action">Подобрать</button>
<button id="jumpBtn">↑</button>
<button id="diveBtn">↓</button>
<div id="toast"></div>
<div id="stick"><div id="knob"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ==================== НАСТРОЙКИ ==================== */
const WORLD_SIZE     = 420;
const TERRAIN_SEG    = 160;
const FOREST_COUNT   = 220;
const ROCK_COUNT     = 70;
const FLINT_COUNT    = 55;
const BRANCH_COUNT   = 90;
const SEAWEED_COUNT  = 80;
const PLAYER_RADIUS  = 0.35;
const SPEED          = 7.5;
const ACCEL          = 14;
const CAM_MIN        = 8;
const CAM_MAX        = 30;
const WATER_LEVEL    = -1.2;
const GRAVITY        = 25;
const JUMP_SPEED     = 9;
const SWIM_SPEED_MUL = 0.55;
const DIVE_SPEED     = 4.5;
const OXYGEN_MAX     = 100;
const OXYGEN_DRAIN   = 9;
const OXYGEN_REFILL  = 35;

/* ==================== РЕНДЕР ==================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa8c8d8);
scene.fog = new THREE.Fog(0xa8c8d8, 70, 240);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 600);
camera.position.set(0, 10, 15);

/* ==================== СВЕТ ==================== */
scene.add(new THREE.HemisphereLight(0xd8ecff, 0x445533, 0.9));

const sun = new THREE.DirectionalLight(0xfff2d0, 2.2);
sun.position.set(40, 60, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -60; sc.right = 60; sc.top = 60; sc.bottom = -60; sc.near = 1; sc.far = 220;
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.03;
scene.add(sun);
scene.add(sun.target);

/* ==================== ШУМ ==================== */
function hash(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function smooth(t) { return t * t * (3 - 2 * t); }
function valueNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const a = hash(xi, yi), b = hash(xi + 1, yi);
  const c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  const u = smooth(xf), v = smooth(yf);
  return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
}
function fbm(x, y) {
  let v = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < 4; i++) {
    v += amp * valueNoise(x * freq, y * freq);
    freq *= 2; amp *= 0.5;
  }
  return v;
}

/* ==================== РЕЛЬЕФ ==================== */
function terrainHeight(x, z) {
  const hills = (fbm(x * 0.008 + 10, z * 0.008 + 10) - 0.42) * 24;
  const amp = 0.35 + 0.65 * fbm(x * 0.0035 + 50, z * 0.0035 + 50);
  let h = hills * amp;
  h += (fbm(x * 0.06, z * 0.06) - 0.5) * 1.4;

  const r1center = Math.sin(x * 0.016) * 30 + Math.cos(x * 0.005) * 20;
  const r1dist = Math.abs(z - r1center);
  const r1 = Math.max(0, 1 - r1dist / 11);

  const r2center = Math.sin(z * 0.014) * 28 + Math.cos(z * 0.006) * 18;
  const r2dist = Math.abs(x - r2center);
  const r2 = Math.max(0, 1 - r2dist / 10);

  const riverMask = Math.max(r1, r2);
  if (riverMask > 0) {
    const k = riverMask * riverMask;
    h = h * (1 - k * 0.95) - k * 6.5;
  }

  return h;
}

/* ==================== ТЕКСТУРЫ ==================== */
function makeNoiseTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#b0b0b0';
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 9000; i++) {
    const g = 120 + Math.random() * 100;
    ctx.fillStyle = `rgb(${g},${g},${g})`;
    const sz = Math.random() < 0.7 ? 1 : 2;
    ctx.fillRect(Math.random() * 256, Math.random() * 256, sz, sz);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(80, 80);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeSandNormalMap() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgb(128,128,255)';
  ctx.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 3000; i++) {
    const r = 100 + Math.random() * 55;
    const g = 100 + Math.random() * 55;
    ctx.fillStyle = `rgb(${r|0},${g|0},255)`;
    ctx.fillRect(Math.random() * 128, Math.random() * 128, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(60, 60);
  return tex;
}

/* ==================== ЗЕМЛЯ ==================== */
const terrainGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, TERRAIN_SEG, TERRAIN_SEG);
terrainGeo.rotateX(-Math.PI / 2);

const pos = terrainGeo.attributes.position;
const colors = [];
const cGrass  = new THREE.Color(0x74a344);
const cGrass2 = new THREE.Color(0x94c25c);
const cRock   = new THREE.Color(0x8a8a7e);
const cSand   = new THREE.Color(0xe0c890);
const cSeabed = new THREE.Color(0x6a7a8a);

for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i);
  const z = pos.getZ(i);
  const h = terrainHeight(x, z);
  pos.setY(i, h);

  let c;
  if (h < WATER_LEVEL - 0.6) c = cSeabed;
  else if (h < WATER_LEVEL + 0.8) c = cSand;
  else if (h > 9) c = cRock;
  else {
    const t = Math.min(1, Math.max(0, (h + 2) / 11));
    c = cGrass.clone().lerp(cGrass2, t * 0.7 + Math.random() * 0.3);
  }
  colors.push(c.r, c.g, c.b);
}

terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
terrainGeo.computeVertexNormals();

const terrainMat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  map: makeNoiseTexture(),
  normalMap: makeSandNormalMap(),
  normalScale: new THREE.Vector2(0.4, 0.4),
  roughness: 0.95,
  metalness: 0.0,
  flatShading: true
});
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
terrain.receiveShadow = true;
scene.add(terrain);

/* ==================== ВОДА С ВОЛНАМИ ==================== */
const WATER_SEG = 60;
const waterGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, WATER_SEG, WATER_SEG);
waterGeo.rotateX(-Math.PI / 2);

// сохраняем базовые позиции
const waterPosAttr = waterGeo.attributes.position;
const waterBaseX = new Float32Array(waterPosAttr.count);
const waterBaseY = new Float32Array(waterPosAttr.count);
const waterBaseZ = new Float32Array(waterPosAttr.count);
for (let i = 0; i < waterPosAttr.count; i++) {
  waterBaseX[i] = waterPosAttr.getX(i);
  waterBaseY[i] = waterPosAttr.getY(i);
  waterBaseZ[i] = waterPosAttr.getZ(i);
}

const waterMat = new THREE.MeshStandardMaterial({
  color: 0x3a7a9a,
  transparent: true,
  opacity: 0.72,
  roughness: 0.12,
  metalness: 0.65,
  side: THREE.DoubleSide,
  flatShading: true
});

const water = new THREE.Mesh(waterGeo, waterMat);
water.position.y = WATER_LEVEL;
water.receiveShadow = true;
scene.add(water);

function updateWaves(time) {
  const pa = waterGeo.attributes.position;
  for (let i = 0; i < pa.count; i++) {
    const x = waterBaseX[i];
    const z = waterBaseZ[i];
    const wave =
      Math.sin(x * 0.12 + time * 1.1) * 0.22 +
      Math.sin(z * 0.15 + time * 0.85) * 0.16 +
      Math.sin((x + z) * 0.07 + time * 1.4) * 0.12;
    pa.setY(i, waterBaseY[i] + wave);
  }
  pa.needsUpdate = true;
  waterGeo.computeVertexNormals();
}

/* ==================== ХИТБОКСЫ ==================== */
const obstacles = [];
function addCyl(x, z, radius) { obstacles.push({ type: 'cyl', x, z, radius }); }

/* ==================== ДЕРЕВЬЯ ==================== */
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2b, roughness: 1, flatShading: true });
const leafMat  = new THREE.MeshStandardMaterial({ color: 0x2d6b3a, roughness: 0.9, flatShading: true });
const leafMat2 = new THREE.MeshStandardMaterial({ color: 0x3f8a4a, roughness: 0.9, flatShading: true });

const trunkGeo = new THREE.CylinderGeometry(0.18, 0.28, 1.6, 6);
const leaf1Geo = new THREE.ConeGeometry(1.3, 2.2, 7);
const leaf2Geo = new THREE.ConeGeometry(0.95, 1.7, 7);

const trunkInst = new THREE.InstancedMesh(trunkGeo, trunkMat, FOREST_COUNT);
trunkInst.castShadow = true; trunkInst.receiveShadow = true;
const leaf1Inst = new THREE.InstancedMesh(leaf1Geo, leafMat, FOREST_COUNT);
leaf1Inst.castShadow = true;
const leaf2Inst = new THREE.InstancedMesh(leaf2Geo, leafMat2, FOREST_COUNT);
leaf2Inst.castShadow = true;

const treeData = [];
const dummy = new THREE.Object3D();

for (let i = 0; i < FOREST_COUNT; i++) {
  let x = 0, z = 0, h = 1, ok = false, attempts = 0;
  while (!ok && attempts < 80) {
    attempts++;
    x = (Math.random() - 0.5) * (WORLD_SIZE - 20);
    z = (Math.random() - 0.5) * (WORLD_SIZE - 20);
    h = terrainHeight(x, z);
    if (h > WATER_LEVEL + 0.8 && h < 12) ok = true;
  }
  const s = 0.8 + Math.random() * 0.9;
  const rotY = Math.random() * Math.PI * 2;

  dummy.position.set(x, h + 0.8 * s, z);
  dummy.rotation.set(0, rotY, 0);
  dummy.scale.set(s, s, s);
  dummy.updateMatrix();
  trunkInst.setMatrixAt(i, dummy.matrix);

  dummy.position.set(x, h + 2.1 * s, z);
  dummy.updateMatrix();
  leaf1Inst.setMatrixAt(i, dummy.matrix);

  dummy.position.set(x, h + 3.2 * s, z);
  dummy.updateMatrix();
  leaf2Inst.setMatrixAt(i, dummy.matrix);

  treeData.push({ x, z, hp: 10, maxHp: 10, alive: true, scale: s, idx: i });
  addCyl(x, z, 0.4 * s);
}
trunkInst.instanceMatrix.needsUpdate = true;
leaf1Inst.instanceMatrix.needsUpdate = true;
leaf2Inst.instanceMatrix.needsUpdate = true;
scene.add(trunkInst, leaf1Inst, leaf2Inst);

/* ==================== КАМНИ ==================== */
const rockGeo = new THREE.IcosahedronGeometry(0.32, 0);
const rockMat = new THREE.MeshStandardMaterial({ color: 0x8a8a80, roughness: 0.95, flatShading: true });
const rockInst = new THREE.InstancedMesh(rockGeo, rockMat, ROCK_COUNT);
rockInst.castShadow = true; rockInst.receiveShadow = true;

const rockData = [];
for (let i = 0; i < ROCK_COUNT; i++) {
  let x = 0, z = 0, h = 1, ok = false, attempts = 0;
  while (!ok && attempts < 60) {
    attempts++;
    x = (Math.random() - 0.5) * (WORLD_SIZE - 30);
    z = (Math.random() - 0.5) * (WORLD_SIZE - 30);
    h = terrainHeight(x, z);
    if (h > WATER_LEVEL + 0.6) ok = true;
  }
  const s = 0.8 + Math.random() * 0.7;
  dummy.position.set(x, h + 0.2 * s, z);
  dummy.rotation.set(Math.random(), Math.random(), Math.random());
  dummy.scale.set(s, s * 0.8, s);
  dummy.updateMatrix();
  rockInst.setMatrixAt(i, dummy.matrix);
  rockData.push({ x, z, y: h, alive: true, idx: i, scale: s });
}
rockInst.instanceMatrix.needsUpdate = true;
scene.add(rockInst);

/* ==================== КРЕМЕНЬ ==================== */
const flintGeo = new THREE.IcosahedronGeometry(0.22, 0);
const flintMat = new THREE.MeshStandardMaterial({
  color: 0xe8e8dc, roughness: 0.4, metalness: 0.15, flatShading: true,
  emissive: 0x333322, emissiveIntensity: 0.15
});
const flintInst = new THREE.InstancedMesh(flintGeo, flintMat, FLINT_COUNT);
flintInst.castShadow = true;

const flintData = [];
for (let i = 0; i < FLINT_COUNT; i++) {
  let x = 0, z = 0, h = 0, ok = false, attempts = 0;
  while (!ok && attempts < 120) {
    attempts++;
    x = (Math.random() - 0.5) * (WORLD_SIZE - 30);
    z = (Math.random() - 0.5) * (WORLD_SIZE - 30);
    h = terrainHeight(x, z);
    if (h > WATER_LEVEL - 0.5 && h < WATER_LEVEL + 1.8) ok = true;
  }
  const s = 0.9 + Math.random() * 0.5;
  dummy.position.set(x, Math.max(h, WATER_LEVEL) + 0.12, z);
  dummy.rotation.set(Math.random(), Math.random(), Math.random());
  dummy.scale.set(s, s * 0.6, s * 1.4);
  dummy.updateMatrix();
  flintInst.setMatrixAt(i, dummy.matrix);
  flintData.push({ x, z, y: Math.max(h, WATER_LEVEL), alive: true, idx: i, scale: s });

let actx = null;
function beep(freq = 600) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(freq, actx.currentTime);
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.12, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.18);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 0.2);
  } catch (e) {}
}

  if (e.target.closest('#topright, #action, #jumpBtn, #diveBtn, #menuBtns, .modal')) return;
  joyId = e.pointerId;
  joyOrigin = { x: e.clientX, y: e.clientY };

});
addEventListener('pointermove', (e) => {
  if (e.pointerId !== joyId) return;
  const dx = e.clientX - joyOrigin.x;
  const dy = e.clientY - joyOrigin.y;
  const max = 55;
  const len = Math.hypot(dx, dy) || 1;
  const k = len > max ? max / len : 1;
  const kx = dx * k, ky = dy * k;
  knob.style.transform = `translate(${kx}px, ${ky}px)`;
  joyVec.x = kx / max; joyVec.y = ky / max;
});
function endJoy(e) {
  if (e.pointerId !== joyId) return;
  joyId = null; joyVec.x = joyVec.y = 0;

/* ==================== ФИЗИКА ==================== */
const velocity = new THREE.Vector3();
let vy = 0;
let onGround = false;
let walkPhase = 0;
let idlePhase = 0;
let currentSpeed01 = 0;
let oxygen = OXYGEN_MAX;
let isSwimming = false;
let isUnderwater = false;
let bodyTiltTarget = 0;

function dampAngle(cur, target, lambda, dt) {
  let diff = (target - cur) % (Math.PI * 2);
  if (diff > Math.PI) diff -= Math.PI * 2;
  if (diff < -Math.PI) diff += Math.PI * 2;
  return cur + diff * (1 - Math.exp(-lambda * dt));
}

function getInput() {
  if (modalOpen) return { x: 0, z: 0 };
  let x = 0, z = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp'))    z -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown'))  z += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft'))  x -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) x += 1;
  x += joyVec.x; z += joyVec.y;
  const len = Math.hypot(x, z);
  if (len > 1) { x /= len; z /= len; }
  return { x, z };
}

function resolveObstacles() {
  for (const o of obstacles) {
    const dx = player.position.x - o.x;
    const dz = player.position.z - o.z;
    const d = Math.hypot(dx, dz);
    const min = o.radius + PLAYER_RADIUS;
    if (d < min && d > 0.0001) {
      const k = min / d;
      player.position.x = o.x + dx * k;
      player.position.z = o.z + dz * k;
    }
  }
}

function updatePlayer(dt) {
  const inp = getInput();
  const t = 1 - Math.exp(-ACCEL * dt);

  // Determine swimming based on current state
  const preGroundY = terrainHeight(player.position.x, player.position.z);
  const deepWater = preGroundY < WATER_LEVEL - 0.6;
  const belowSurface = player.position.y < WATER_LEVEL - 0.1;
  isSwimming = deepWater && belowSurface;

  const speedMul = isSwimming ? SWIM_SPEED_MUL : 1.0;

  velocity.x += (inp.x * SPEED * speedMul - velocity.x) * t;
  velocity.z += (inp.z * SPEED * speedMul - velocity.z) * t;
  player.position.x += velocity.x * dt;
  player.position.z += velocity.z * dt;

  resolveObstacles();

  const half = WORLD_SIZE / 2 - 5;
  player.position.x = Math.max(-half, Math.min(half, player.position.x));
  player.position.z = Math.max(-half, Math.min(half, player.position.z));

  // Recompute ground after move
  const groundY = terrainHeight(player.position.x, player.position.z);
  const waterSurface = WATER_LEVEL - 0.3;

  // Re-check swimming
  const deepNow = groundY < WATER_LEVEL - 0.6;
  const belowNow = player.position.y < WATER_LEVEL - 0.1;
  isSwimming = deepNow && belowNow;

  if (isSwimming) {
    const holdingDive = touchDive || keys.has('ShiftLeft') || keys.has('ShiftRight');

    if (oxygen <= 0) {
      vy += (waterSurface - player.position.y) * 12 * dt;
    } else if (holdingDive) {
      vy -= DIVE_SPEED * 5 * dt;
    } else {
      vy += (waterSurface - player.position.y) * 6 * dt;
    }
    vy = Math.max(-DIVE_SPEED, Math.min(vy, 4));

    if (jumpRequested) vy = Math.max(vy, JUMP_SPEED * 0.5);

    player.position.y += vy * dt;

    // Не проваливаться под дно
    if (player.position.y < groundY + 0.2) {
      player.position.y = groundY + 0.2;
      vy = Math.max(0, vy);
    }

    // Не вылетать над поверхностью
    if (player.position.y > waterSurface && vy > 0) {
      player.position.y = waterSurface;
      vy = 0;
    }

    onGround = false;
  } else {
    // Ходьба / падение
    if (onGround && groundY > player.position.y - 0.3) {
      player.position.y = groundY;
      if (jumpRequested) {
        vy = JUMP_SPEED;
        onGround = false;
      }
    } else {
      onGround = false;
      vy -= GRAVITY * dt;
      player.position.y += vy * dt;
    }

    // Абсолютная защита: никогда не ниже земли
    if (player.position.y <= groundY) {
      player.position.y = groundY;
      vy = 0;
      onGround = true;
    }
  }

  jumpRequested = false;

  // Кислород — по уровню головы
  const headY = player.position.y + 1.7;
  isUnderwater = headY < WATER_LEVEL;

  if (isUnderwater) {
    oxygen -= OXYGEN_DRAIN * dt;
    if (oxygen < 0) oxygen = 0;
  } else {
    oxygen += OXYGEN_REFILL * dt;
    if (oxygen > OXYGEN_MAX) oxygen = OXYGEN_MAX;
  }

  const sp = Math.hypot(velocity.x, velocity.z);
  currentSpeed01 = onGround ? Math.min(1, sp / SPEED) : 0;

  if (sp > 0.4) {
    player.rotation.y = dampAngle(player.rotation.y, Math.atan2(velocity.x, velocity.z), 12, dt);
  }

  diveBtn.style.display = isSwimming ? 'flex' : 'none';
}

/* ==================== АНИМАЦИЯ ==================== */
function updatePlayerAnim(dt) {
  const s = currentSpeed01;
  walkPhase += dt * (4 + s * 9) * s;
  idlePhase += dt * 2;

  if (isSwimming) {
    // Плавание: корпус почти горизонтальный, гребём попеременно
    bodyTiltTarget = 1.15;
    const t = performance.now() / 1000;
    const sp = 4.5;

    const pL = Math.sin(t * sp);
    const pR = Math.sin(t * sp + Math.PI);

    armL.rotation.x = pL * 1.3 + 0.3;
    armR.rotation.x = pR * 1.3 + 0.3;
    armL.rotation.z = -0.35;
    armR.rotation.z = 0.35;

    const kick = Math.sin(t * sp * 2);
    legL.rotation.x = kick * 0.45;
    legR.rotation.x = -kick * 0.45;

    headGroup.rotation.x = -0.6;
  } else {
    // Обычная ходьба
    bodyTiltTarget = s * 0.07;

    const swing = Math.sin(walkPhase) * 0.7 * s;
    const swingOpp = Math.sin(walkPhase + Math.PI) * 0.7 * s;

    legL.rotation.x = swing;
    legR.rotation.x = swingOpp;
    armL.rotation.x = swingOpp * 0.8;
    armR.rotation.x = swing * 0.8;
    armL.rotation.z = -0.06;
    armR.rotation.z =  0.06;

    headGroup.rotation.x = 0;
  }

  // Плавный переход наклона корпуса
  bodyRoot.rotation.x += (bodyTiltTarget - bodyRoot.rotation.x) * (1 - Math.exp(-8 * dt));

  bodyRoot.rotation.z = Math.sin(walkPhase) * 0.05 * s;

  const bob = Math.abs(Math.sin(walkPhase)) * 0.05 * s;
  const breathe = s < 0.1 && onGround && !isSwimming ? Math.sin(idlePhase) * 0.01 : 0;
  bodyRoot.position.y = bob + breathe;
}

/* ==================== ПОИСК ДЕЙСТВИЯ ==================== */
function findNearestAction() {
  if (modalOpen) { setAction(null); return; }

  const px = player.position.x;
  const pz = player.position.z;
  let best = null, bestDist = Infinity;

  for (const r of rockData) {
    if (!r.alive) continue;
    const d = Math.hypot(px - r.x, pz - r.z);
    if (d < 2.0 && d < bestDist) { bestDist = d; best = { kind: 'rock', target: r, label: 'Подобрать камень' }; }
  }
  for (const f of flintData) {
    if (!f.alive) continue;
    const d = Math.hypot(px - f.x, pz - f.z);
    if (d < 2.0 && d < bestDist) { bestDist = d; best = { kind: 'flint', target: f, label: 'Подобрать кремень' }; }
  }
  for (const b of branchData) {
    if (!b.alive) continue;
    const d = Math.hypot(px - b.x, pz - b.z);
    if (d < 2.0 && d < bestDist) { bestDist = d; best = { kind: 'branch', target: b, label: 'Подобрать ветку' }; }
  }
  const hasAxe = inv.stoneAxe || inv.flintAxe;
  for (const tt of treeData) {
    if (!tt.alive) continue;
    const d = Math.hypot(px - tt.x, pz - tt.z);
    if (d < 2.4 && d < bestDist) {
      bestDist = d;
      best = { kind: hasAxe ? 'tree' : 'tree-noaxe', target: tt, label: hasAxe ? 'Рубить дерево' : 'Нужен топор' };
    }
  }

  setAction(best);
}

/* ==================== ПОДБОР / РУБКА ==================== */
function hideInstance(inst, idx) {
  dummy.position.set(0, -9999, 0);
  dummy.rotation.set(0, 0, 0);
  dummy.scale.set(0, 0, 0);
  dummy.updateMatrix();
  inst.setMatrixAt(idx, dummy.matrix);
  inst.instanceMatrix.needsUpdate = true;
}

function doAction() {
  if (!currentAction) return;
  const { kind, target } = currentAction;

  if (kind === 'rock') {
    target.alive = false;
    hideInstance(rockInst, target.idx);
    inv.stone += 2 + Math.floor(Math.random() * 2);
    renderInventory();
    toast('+ камень');
    beep(420);
  } else if (kind === 'flint') {
    target.alive = false;
    hideInstance(flintInst, target.idx);
    inv.flint += 2 + Math.floor(Math.random() * 2);
    renderInventory();
    toast('+ кремень');
    beep(560);
  } else if (kind === 'branch') {
    target.alive = false;
    hideInstance(branchInst, target.idx);
    inv.wood += 1 + Math.floor(Math.random() * 2);
    renderInventory();
    toast('+ дерево');
    beep(480);
  } else if (kind === 'tree' || kind === 'tree-noaxe') {
    if (kind === 'tree-noaxe') { toast('Сначала сделай топор'); return; }
    const dmg = inv.flintAxe ? 6 : 4;
    target.hp -= dmg;
    beep(inv.flintAxe ? 300 : 240);
    if (target.hp <= 0) {
      target.alive = false;
      hideInstance(trunkInst, target.idx);
      hideInstance(leaf1Inst, target.idx);
      hideInstance(leaf2Inst, target.idx);
      const amount = 3 + Math.floor(Math.random() * 3);
      inv.wood += amount;
      renderInventory();
      toast(`Дерево срублено (+${amount})`);
    } else {
      toast(inv.flintAxe ? 'Быстрый удар' : 'Медленный удар');
    }
  }

  setAction(null);
}

/* ==================== КИСЛОРОД UI ==================== */
const oxyEl = document.getElementById('oxygen');
const oxyFill = document.getElementById('oxyFill');

function updateOxygenUI() {
  oxyEl.style.display = isUnderwater ? 'block' : 'none';
  if (!isUnderwater) return;
  const pct = (oxygen / OXYGEN_MAX) * 100;
  oxyFill.style.width = pct + '%';
  oxyFill.style.background = oxygen < 30
    ? '#f44336'
    : 'linear-gradient(90deg, #4fc3f7, #29b6f6)';
}

/* ==================== ПОСТОБРАБОТКА ==================== */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.6, 0.9));
composer.addPass(new OutputPass());

/* ==================== RESIZE ==================== */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

/* ==================== ПОДСКАЗКА ==================== */
const hintEl = document.getElementById('hint');
setTimeout(() => { hintEl.style.opacity = '0'; }, 5000);

/* ==================== АТМОСФЕРА ==================== */
const FOG_AIR_COLOR = new THREE.Color(0xa8c8d8);
const FOG_WATER_COLOR = new THREE.Color(0x1a4a6a);
const BG_AIR = new THREE.Color(0xa8c8d8);
const BG_WATER = new THREE.Color(0x1a4a6a);

function updateAtmosphere() {
  if (isUnderwater) {
    scene.fog.color.copy(FOG_WATER_COLOR);
    scene.fog.near = 3;
    scene.fog.far = 32;
    scene.background.copy(BG_WATER);
    waterMat.opacity = 0.15;
  } else {
    scene.fog.color.copy(FOG_AIR_COLOR);
    scene.fog.near = 70;
    scene.fog.far = 240;
    scene.background.copy(BG_AIR);
    waterMat.opacity = 0.72;
  }
}

/* ==================== ЦИКЛ ==================== */
const SUN_OFFSET = new THREE.Vector3(35, 55, 25);
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  updatePlayer(dt);
  updatePlayerAnim(dt);
  updateCamera(dt);
  findNearestAction();
  updateAtmosphere();
  updateOxygenUI();
  updateWaves(elapsed);

  sun.position.copy(player.position).add(SUN_OFFSET);
  sun.target.position.copy(player.position);

  composer.render();
}

renderInventory();
renderCraft();
animate();
</script>
</body>
